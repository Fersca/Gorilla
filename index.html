<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f24">
<title>🦍 Gorilla Banana 3D — homenaje a GORILLA.BAS</title>
<style>
  :root {
    --panel-bg: rgba(13, 17, 36, 0.66);
    --panel-border: rgba(255, 255, 255, 0.14);
    --accent: #ffd54a;
    --accent-2: #ff9d2e;
    --text: #eef2ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #0b0f24;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    display: flex;
    justify-content: space-between;
    gap: 8px;
    pointer-events: none;
    z-index: 5;
  }
  .hudGroup { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .3px;
    display: flex;
    align-items: center;
    gap: 7px;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
    white-space: nowrap;
  }
  .chip b { color: var(--accent); font-size: 15px; }
  button.chip {
    pointer-events: auto;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    touch-action: manipulation;
  }
  button.chip:active { transform: scale(.94); }
  #windArrow { display: inline-block; font-size: 14px; }

  /* ---------- banner de nivel ---------- */
  #banner {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .35s;
    z-index: 6;
    text-align: center;
    padding: 0 16px;
  }
  #banner.show { opacity: 1; }
  #banner h1 {
    font-size: clamp(30px, 9vw, 72px);
    font-weight: 800;
    background: linear-gradient(180deg, #fff, var(--accent) 55%, var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 6px 22px rgba(255, 170, 40, .45));
    transform: scale(.85);
    transition: transform .35s cubic-bezier(.2, 1.6, .4, 1);
  }
  #banner.show h1 { transform: scale(1); }
  #banner p { font-size: clamp(13px, 3.5vw, 17px); opacity: .9; font-weight: 600; text-shadow: 0 2px 8px rgba(0,0,0,.8); }

  /* ---------- hint de rotación ---------- */
  #rotateHint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
    z-index: 7;
    pointer-events: none;
    opacity: 0;
    transition: opacity .5s;
  }
  #rotateHint.show { opacity: 1; }

  /* ---------- controles ---------- */
  #controls {
    position: fixed;
    left: max(12px, env(safe-area-inset-left));
    right: max(12px, env(safe-area-inset-right));
    bottom: calc(10px + env(safe-area-inset-bottom));
    z-index: 5;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    align-items: center;
    gap: 10px 18px;
    background: var(--panel-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 12px 16px;
    box-shadow: 0 14px 40px rgba(0,0,0,.5);
    max-width: 1100px;
    margin: 0 auto;
  }
  .ctl { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ctl label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    opacity: .75;
    white-space: nowrap;
  }
  .ctl output {
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: 17px;
    color: var(--accent);
    min-width: 46px;
    text-align: right;
  }
  input[type="range"] {
    flex: 1;
    min-width: 0;
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent) var(--fill, 50%), rgba(255,255,255,.15) var(--fill, 50%));
    outline: none;
    cursor: pointer;
    touch-action: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--accent) 60%, var(--accent-2));
    box-shadow: 0 3px 10px rgba(0,0,0,.5), 0 0 0 3px rgba(255,213,74,.25);
  }
  input[type="range"]::-moz-range-thumb {
    width: 26px; height: 26px; border: none;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--accent) 60%, var(--accent-2));
    box-shadow: 0 3px 10px rgba(0,0,0,.5), 0 0 0 3px rgba(255,213,74,.25);
  }
  #throwBtn {
    font: inherit;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: .6px;
    padding: 13px 30px;
    border: none;
    border-radius: 14px;
    color: #2b1a00;
    background: linear-gradient(180deg, #ffe27a, var(--accent) 45%, var(--accent-2));
    box-shadow: 0 8px 22px rgba(255, 160, 30, .38), 0 1px 0 rgba(255,255,255,.6) inset;
    cursor: pointer;
    transition: transform .12s, filter .12s;
    touch-action: manipulation;
  }
  #throwBtn:active:not(:disabled) { transform: scale(.96); }
  #throwBtn:disabled { filter: grayscale(.7) brightness(.65); }

  /* móvil: sliders apilados, botón a lo ancho */
  @media (max-width: 640px) {
    #controls { grid-template-columns: 1fr; gap: 8px; padding: 10px 14px; }
    #throwBtn { width: 100%; padding: 14px; }
    .chip { font-size: 12px; padding: 6px 10px; }
  }
  /* pantallas bajas y anchas (celu apaisado): panel más compacto */
  @media (max-height: 450px) {
    #controls { padding: 8px 14px; gap: 6px 14px; }
    #throwBtn { padding: 10px 26px; font-size: 15px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div class="hudGroup">
    <div class="chip">🏆 Nivel <b id="levelTxt">1</b></div>
    <div class="chip">🍌 Intentos <b id="triesTxt">0</b></div>
  </div>
  <div class="hudGroup">
    <div class="chip" id="windChip" style="display:none">💨 <span id="windArrow">→</span> <b id="windTxt">0</b></div>
    <button class="chip" id="viewBtn">📷 Vista</button>
  </div>
</div>

<div id="banner"><h1 id="bannerTitle">¡GORILLA!</h1><p id="bannerSub">Emboca la banana en el canasto</p></div>
<div id="rotateHint">📱 Girá el teléfono para ver mejor la ciudad</div>

<div id="controls">
  <div class="ctl">
    <label for="angle">Ángulo</label>
    <input type="range" id="angle" min="10" max="85" value="45" step="1">
    <output id="angleOut">45°</output>
  </div>
  <div class="ctl">
    <label for="yaw">Giro</label>
    <input type="range" id="yaw" min="-45" max="45" value="0" step="1">
    <output id="yawOut">0°</output>
  </div>
  <div class="ctl">
    <label for="power">Fuerza</label>
    <input type="range" id="power" min="20" max="100" value="60" step="1">
    <output id="powerOut">60</output>
  </div>
  <button id="throwBtn">🍌 ¡LANZAR!</button>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
(() => {
  "use strict";

  // ==================================================================
  // Configuración del mundo (unidades de mundo, suelo en y=0)
  // ==================================================================
  const CFG = {
    gravity: 38,                 // u/s²
    powerToV: 0.72,              // v0 = fuerza * powerToV
    gorillaX: -38,
    handOffset: { x: 4.3, y: 10.6 },   // mano del gorila (brazo arriba) rel. a su base
    basketMinX: 4,
    basketMaxX: 44,
    basketH: 4.4,
    rimR: 3.1,
    boundsX: 75,
  };

  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;

  const state = {
    level: 1,
    tries: 0,
    wind: 0,                     // aceleración horizontal (eje x) u/s²
    banana: null,                // {x, y, z, py, vx, vy, vz, yaw}
    celebrating: false,
    shake: 0,
    time: 0,
    armUp: 0,
    gorillaYaw: 0,               // giro actual del gorila (radianes, animado)
    basket: { x: 20, z: 0, baseY: 0, rimY: CFG.basketH, pedestalH: 0 },
  };

  const ui = {
    angle: document.getElementById("angle"),
    yaw: document.getElementById("yaw"),
    yawOut: document.getElementById("yawOut"),
    viewBtn: document.getElementById("viewBtn"),
    power: document.getElementById("power"),
    angleOut: document.getElementById("angleOut"),
    powerOut: document.getElementById("powerOut"),
    throwBtn: document.getElementById("throwBtn"),
    levelTxt: document.getElementById("levelTxt"),
    triesTxt: document.getElementById("triesTxt"),
    windChip: document.getElementById("windChip"),
    windTxt: document.getElementById("windTxt"),
    windArrow: document.getElementById("windArrow"),
    banner: document.getElementById("banner"),
    bannerTitle: document.getElementById("bannerTitle"),
    bannerSub: document.getElementById("bannerSub"),
    rotateHint: document.getElementById("rotateHint"),
  };

  // ==================================================================
  // Sonido y vibración
  // ==================================================================
  let audioCtx = null;
  function beep(freq, dur, type = "sine", vol = 0.15, when = 0) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const t = audioCtx.currentTime + when;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) { /* sin audio */ }
  }
  const vibrate = (p) => { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} };
  const sndThrow = () => { beep(220, .12, "triangle", .1); beep(440, .1, "triangle", .06, .04); vibrate(25); };
  const sndMiss  = () => { beep(110, .25, "sawtooth", .12); vibrate(60); };
  const sndScore = () => { [523, 659, 784, 1047].forEach((f, i) => beep(f, .18, "triangle", .14, i * .09)); vibrate([40, 60, 40, 60, 90]); };

  // ==================================================================
  // Escena three.js
  // ==================================================================
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById("app").appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x453a75, 150, 560);   // bruma violeta que empalma con el cielo

  const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 1400);

  // cámara orbital estilo Google Earth: arrastrar rota, rueda/pinch acerca,
  // botón derecho / dos dedos panea
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 14;
  controls.maxDistance = 450;
  controls.maxPolarAngle = Math.PI / 2 + 0.04;   // no meterse bajo el piso

  function resetView() {
    const aspect = window.innerWidth / window.innerHeight;
    const vfov = THREE.MathUtils.degToRad(camera.fov);
    const hfov = 2 * Math.atan(Math.tan(vfov / 2) * aspect);
    const dW = 50 / Math.tan(hfov / 2);        // que entren x ∈ [-49, 51]
    const dH = 17 / Math.tan(vfov / 2);        // y suficiente de cielo y piso
    const d = Math.max(dW, dH);
    const lookY = aspect < 0.9 ? 24 : 10.5;    // en vertical, menos piso
    controls.target.set(1, lookY, 0);
    camera.position.set(1, lookY + 1.5, d);
    controls.update();
  }

  function onResize() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", () => setTimeout(() => { onResize(); resetView(); }, 250));

  // ------------------------------------------------ luces
  scene.add(new THREE.HemisphereLight(0x35426f, 0x0b0e16, 0.85));
  const moonLight = new THREE.DirectionalLight(0xcfdcff, 1.0);
  moonLight.position.set(30, 70, 35);
  moonLight.castShadow = true;
  moonLight.shadow.mapSize.set(1024, 1024);
  moonLight.shadow.camera.left = -70;
  moonLight.shadow.camera.right = 70;
  moonLight.shadow.camera.top = 60;
  moonLight.shadow.camera.bottom = -20;
  moonLight.shadow.camera.near = 20;
  moonLight.shadow.camera.far = 220;
  moonLight.shadow.bias = -0.002;
  scene.add(moonLight);
  const rimLight = new THREE.DirectionalLight(0x6a5aff, 0.35);
  rimLight.position.set(-40, 25, -30);
  scene.add(rimLight);

  // ------------------------------------------------ cielo, luna, estrellas
  function gradientTexture(stops, w = 2, h = 512) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const g = c.getContext("2d");
    const grd = g.createLinearGradient(0, 0, 0, h);
    for (const [p, col] of stops) grd.addColorStop(p, col);
    g.fillStyle = grd;
    g.fillRect(0, 0, w, h);
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }
  // cúpula de cielo: se ve el gradiente desde cualquier ángulo de la órbita
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(680, 32, 24),
    new THREE.MeshBasicMaterial({
      map: gradientTexture([[0, "#070a1c"], [0.26, "#1a2050"], [0.44, "#4a3a80"], [0.52, "#8a4a7d"], [1, "#8a4a7d"]]),
      fog: false, depthWrite: false, side: THREE.BackSide,
    })
  );
  scene.add(sky);

  const starGeo = new THREE.BufferGeometry();
  {
    // estrellas repartidas por todo el domo, así se ven orbitando en cualquier dirección
    const n = 700, pos = new Float32Array(n * 3), R = 620;
    for (let i = 0; i < n; i++) {
      const az = rand(0, Math.PI * 2);
      const elev = rand(0.06, 1.5);
      pos[i * 3] = R * Math.cos(elev) * Math.cos(az);
      pos[i * 3 + 1] = R * Math.sin(elev);
      pos[i * 3 + 2] = R * Math.cos(elev) * Math.sin(az);
    }
    starGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  }
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0.85, fog: false });
  scene.add(new THREE.Points(starGeo, starMat));

  function glowTexture(inner, outer) {
    const c = document.createElement("canvas");
    c.width = c.height = 128;
    const g = c.getContext("2d");
    const grd = g.createRadialGradient(64, 64, 4, 64, 64, 64);
    grd.addColorStop(0, inner);
    grd.addColorStop(1, outer);
    g.fillStyle = grd;
    g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }
  const moon = new THREE.Mesh(
    new THREE.CircleGeometry(13, 40),
    new THREE.MeshBasicMaterial({ color: 0xfdf6d8, fog: false })
  );
  moon.position.set(52, 105, -250);
  scene.add(moon);
  const moonGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture("rgba(255,248,214,.55)", "rgba(255,248,214,0)"),
    transparent: true, fog: false, depthWrite: false,
  }));
  moonGlow.scale.set(85, 85, 1);
  moonGlow.position.copy(moon.position).z -= 1;
  scene.add(moonGlow);

  // ------------------------------------------------ piso
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(3000, 1000),
    new THREE.MeshStandardMaterial({ color: 0x131b0e, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(0, 0, -100);   // llega hasta z=+400: cubre por delante de la cámara
  ground.receiveShadow = true;
  scene.add(ground);

  // ------------------------------------------------ edificios
  function buildingTextures(rows) {
    // devuelve {map, emissive} con ventanas; `rows` filas de ventanas
    const w = 64, h = rows * 16;
    const cm = document.createElement("canvas"); cm.width = w; cm.height = h;
    const ce = document.createElement("canvas"); ce.width = w; ce.height = h;
    const gm = cm.getContext("2d"), ge = ce.getContext("2d");
    const base = ["#232f57", "#1c2748", "#2a3763", "#1f2c52"][(Math.random() * 4) | 0];
    gm.fillStyle = base; gm.fillRect(0, 0, w, h);
    ge.fillStyle = "#000"; ge.fillRect(0, 0, w, h);
    const cols = 4;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (Math.random() < 0.42) continue;
        const x = 6 + c * 14, y = 5 + r * 16;
        const lit = Math.random() < 0.55;
        gm.fillStyle = lit ? "#ffd876" : "#0b1020";
        gm.fillRect(x, y, 8, 9);
        if (lit) {
          ge.fillStyle = "#ffca55";
          ge.fillRect(x, y, 8, 9);
        }
      }
    }
    const map = new THREE.CanvasTexture(cm);
    map.encoding = THREE.sRGBEncoding;
    return { map, emissive: new THREE.CanvasTexture(ce) };
  }
  const texPool = [];
  for (const rows of [4, 4, 6, 6, 8, 8, 10, 12]) texPool.push({ rows, tex: buildingTextures(rows) });
  function pickTex(bh) {
    // variante cuyas filas de ventanas mejor calcen con la altura del edificio
    const want = bh / 3.2;
    let best = texPool[0];
    for (const p of texPool) {
      if (Math.abs(p.rows - want) < Math.abs(best.rows - want)) best = p;
    }
    return best.tex;
  }

  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  boxGeo.translate(0, 0.5, 0);          // origen en la base
  let cityGroup = null;
  function makeCity() {
    if (cityGroup) {
      scene.remove(cityGroup);
      cityGroup.traverse(o => {
        const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
        for (const m of mats) {
          if (m.map) m.map.dispose();
          if (m.emissiveMap) m.emissiveMap.dispose();
          m.dispose();
        }
      });
    }
    cityGroup = new THREE.Group();
    const rows = [
      { z: -20, hMin: 5,  hMax: 15, wMin: 7,  wMax: 13, gap: [4, 14] },
      { z: -45, hMin: 12, hMax: 34, wMin: 10, wMax: 18, gap: [3, 9] },
      { z: -80, hMin: 20, hMax: 55, wMin: 14, wMax: 24, gap: [2, 7] },
    ];
    for (const row of rows) {
      let x = -130;
      while (x < 130) {
        const bw = rand(row.wMin, row.wMax);
        const bh = rand(row.hMin, row.hMax);
        const t = pickTex(bh);
        // clonar para repetir la textura según el ancho (ventanas sin estirar)
        const map = t.map.clone(); map.needsUpdate = true;
        const emis = t.emissive.clone(); emis.needsUpdate = true;
        map.wrapS = emis.wrapS = THREE.RepeatWrapping;
        map.repeat.x = emis.repeat.x = Math.max(1, Math.round(bw / 7));
        const sideMat = new THREE.MeshStandardMaterial({
          map, emissiveMap: emis, emissive: 0xffffff,
          emissiveIntensity: 0.62, roughness: 0.9,
        });
        const topMat = new THREE.MeshStandardMaterial({ color: 0x141b33, roughness: 1 });
        const b = new THREE.Mesh(boxGeo, [sideMat, sideMat, topMat, topMat, sideMat, sideMat]);
        b.position.set(x + bw / 2, 0, row.z + rand(-3, 3));
        b.scale.set(bw, bh, rand(row.wMin, row.wMax));
        cityGroup.add(b);
        x += bw + rand(row.gap[0], row.gap[1]);
      }
    }
    scene.add(cityGroup);
  }

  // ------------------------------------------------ gorila
  const furMat  = new THREE.MeshStandardMaterial({ color: 0x23272e, roughness: 0.85 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x171a1f, roughness: 0.9 });
  const skinMat = new THREE.MeshStandardMaterial({ color: 0x7d7263, roughness: 0.7 });
  const eyeMat  = new THREE.MeshStandardMaterial({ color: 0x14161a, roughness: 0.3 });

  function sphere(r, mat, sx = 1, sy = 1, sz = 1) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 18), mat);
    m.scale.set(sx, sy, sz);
    m.castShadow = true;
    return m;
  }

  const gorilla = new THREE.Group();
  gorilla.position.set(CFG.gorillaX, 0, 0);
  {
    // piernas
    const l1 = sphere(1.5, darkMat, 1.15, 1.25, 1.2); l1.position.set(-1.6, 1.5, 0); gorilla.add(l1);
    const l2 = l1.clone(); l2.position.x = 1.6; gorilla.add(l2);
    // torso
    const torso = sphere(2.9, furMat, 1, 1.18, 0.85); torso.position.set(0, 4.4, 0); gorilla.add(torso);
    const chest = sphere(1.9, skinMat, 1, 1.15, 0.55); chest.position.set(0, 4.4, 1.55); gorilla.add(chest);
    // cabeza
    const head = sphere(1.65, furMat, 1, 0.95, 0.95); head.position.set(0, 8.35, 0.25); gorilla.add(head);
    const crest = sphere(0.85, furMat, 1.1, 0.75, 1); crest.position.set(0, 9.55, 0.1); gorilla.add(crest);
    const face = sphere(1.15, skinMat, 1, 0.85, 0.6); face.position.set(0, 8.1, 1.25); gorilla.add(face);
    const e1 = sphere(0.16, eyeMat); e1.position.set(-0.42, 8.55, 1.85); gorilla.add(e1);
    const e2 = e1.clone(); e2.position.x = 0.42; gorilla.add(e2);
    const n1 = sphere(0.09, eyeMat); n1.position.set(-0.2, 8.0, 1.95); gorilla.add(n1);
    const n2 = n1.clone(); n2.position.x = 0.2; gorilla.add(n2);
    // brazo izquierdo (fijo, apoyado)
    const armL = new THREE.Mesh(new THREE.CapsuleGeometry(0.72, 4.2, 6, 14), furMat);
    armL.castShadow = true;
    armL.position.set(-2.35, 6.3, 0.3);
    armL.geometry.translate(0, -2.4, 0);
    armL.rotation.z = -0.5;
    gorilla.add(armL);
    const handL = sphere(0.95, darkMat); handL.position.set(-4.6, 1.1, 0.3); gorilla.add(handL);
  }
  // brazo derecho (lanzador, animado)
  const armGroup = new THREE.Group();
  armGroup.position.set(2.35, 6.4, 0.3);
  const armR = new THREE.Mesh(new THREE.CapsuleGeometry(0.72, 4.2, 6, 14), furMat);
  armR.castShadow = true;
  armR.geometry.translate(0, -2.4, 0);
  armGroup.add(armR);
  const handR = sphere(0.95, darkMat);
  handR.position.set(0, -4.7, 0);
  armGroup.add(handR);
  gorilla.add(armGroup);
  scene.add(gorilla);

  // ------------------------------------------------ banana
  function makeBanana(scale = 1) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.TorusGeometry(1.15, 0.44, 12, 20, 2.3),
      new THREE.MeshStandardMaterial({ color: 0xffd23e, roughness: 0.5, emissive: 0x4a3300 })
    );
    body.castShadow = true;
    g.add(body);
    const tipMat = new THREE.MeshStandardMaterial({ color: 0x7a5c10, roughness: 0.8 });
    const t1 = new THREE.Mesh(new THREE.SphereGeometry(0.34, 10, 8), tipMat);
    t1.position.set(1.15, 0, 0);
    g.add(t1);
    const t2 = t1.clone();
    t2.position.set(1.15 * Math.cos(2.3), 1.15 * Math.sin(2.3), 0);
    g.add(t2);
    g.scale.setScalar(scale);
    return g;
  }
  const bananaFly = makeBanana(1.35);
  bananaFly.rotation.order = "YZX";   // primero el rumbo (y), después el giro propio (z)
  bananaFly.visible = false;
  scene.add(bananaFly);
  const bananaHand = makeBanana(0.7);
  bananaHand.position.set(0, -0.4, 0.9);
  handR.add(bananaHand);

  // ------------------------------------------------ canasto
  function wickerTexture() {
    const c = document.createElement("canvas");
    c.width = c.height = 128;
    const g = c.getContext("2d");
    g.fillStyle = "#8a5a22"; g.fillRect(0, 0, 128, 128);
    for (let y = 0; y < 128; y += 16) {
      for (let x = 0; x < 128; x += 32) {
        const off = (y / 16) % 2 ? 16 : 0;
        g.fillStyle = ((x / 32) % 2 ? "#a06a2c" : "#754a1a");
        g.fillRect(x + off - 16, y, 30, 14);
        g.strokeStyle = "rgba(60,32,6,.6)";
        g.strokeRect(x + off - 16, y, 30, 14);
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(3, 1.4);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }
  const basketGroup = new THREE.Group();
  {
    const pts = [];
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      pts.push(new THREE.Vector2(lerp(1.9, CFG.rimR, Math.pow(t, 0.8)), t * CFG.basketH));
    }
    const wick = wickerTexture();
    const cup = new THREE.Mesh(
      new THREE.LatheGeometry(pts, 26),
      new THREE.MeshStandardMaterial({ map: wick, bumpMap: wick, bumpScale: 0.06, roughness: 0.85, side: THREE.DoubleSide })
    );
    cup.castShadow = true;
    basketGroup.add(cup);
    const rim = new THREE.Mesh(
      new THREE.TorusGeometry(CFG.rimR, 0.26, 10, 30),
      new THREE.MeshStandardMaterial({ color: 0xc98d3e, roughness: 0.7 })
    );
    rim.rotation.x = Math.PI / 2;
    rim.position.y = CFG.basketH;
    rim.castShadow = true;
    basketGroup.add(rim);
    // interior oscuro
    const inner = new THREE.Mesh(
      new THREE.CircleGeometry(CFG.rimR - 0.2, 24),
      new THREE.MeshBasicMaterial({ color: 0x241202 })
    );
    inner.rotation.x = -Math.PI / 2;
    inner.position.y = CFG.basketH - 0.4;
    basketGroup.add(inner);
  }
  const arrow = new THREE.Mesh(
    new THREE.ConeGeometry(1.1, 2.1, 4),
    new THREE.MeshBasicMaterial({ color: 0xffd54a, toneMapped: false })
  );
  arrow.rotation.x = Math.PI;
  basketGroup.add(arrow);
  scene.add(basketGroup);

  const pedestal = new THREE.Mesh(
    new THREE.BoxGeometry(4.6, 1, 4.6),
    new THREE.MeshStandardMaterial({ color: 0x554668, roughness: 0.8 })
  );
  pedestal.castShadow = true;
  pedestal.receiveShadow = true;
  scene.add(pedestal);
  const pedestalCap = new THREE.Mesh(
    new THREE.BoxGeometry(5.4, 0.5, 5.4),
    new THREE.MeshStandardMaterial({ color: 0x6f5c86, roughness: 0.7 })
  );
  pedestalCap.castShadow = true;
  scene.add(pedestalCap);

  // ------------------------------------------------ estelas
  const TRAIL_N = 320;
  function makeTrailLine(color, opacity) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(TRAIL_N * 3), 3));
    geo.setDrawRange(0, 0);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
      color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
    }));
    line.frustumCulled = false;
    scene.add(line);
    return line;
  }
  const trailLine = makeTrailLine(0xffd23e, 0.75);
  const lastTrailLine = makeTrailLine(0xbfa970, 0.16);
  let trailCount = 0;

  function pushTrail(x, y, z) {
    if (trailCount >= TRAIL_N) return;
    const arr = trailLine.geometry.attributes.position.array;
    arr[trailCount * 3] = x;
    arr[trailCount * 3 + 1] = y;
    arr[trailCount * 3 + 2] = z;
    trailCount++;
    trailLine.geometry.setDrawRange(0, trailCount);
    trailLine.geometry.attributes.position.needsUpdate = true;
  }
  function commitTrailToLast() {
    const src = trailLine.geometry.attributes.position.array;
    const dst = lastTrailLine.geometry.attributes.position.array;
    dst.set(src);
    lastTrailLine.geometry.setDrawRange(0, trailCount);
    lastTrailLine.geometry.attributes.position.needsUpdate = true;
    trailCount = 0;
    trailLine.geometry.setDrawRange(0, 0);
  }
  function clearTrails() {
    trailCount = 0;
    trailLine.geometry.setDrawRange(0, 0);
    lastTrailLine.geometry.setDrawRange(0, 0);
  }

  // ------------------------------------------------ puntitos de puntería
  const AIM_N = 13;
  const aimDots = [];
  for (let i = 0; i < AIM_N; i++) {
    const d = new THREE.Mesh(
      new THREE.SphereGeometry(0.34, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xfff2c0, transparent: true, opacity: 0.55 * (1 - i / AIM_N), toneMapped: false })
    );
    scene.add(d);
    aimDots.push(d);
  }
  function updateAim() {
    const show = !state.banana && !state.celebrating;
    const angle = (+ui.angle.value) * Math.PI / 180;
    const yaw = (+ui.yaw.value) * Math.PI / 180;
    const v0 = (+ui.power.value) * CFG.powerToV;
    let x = CFG.gorillaX + CFG.handOffset.x * Math.cos(yaw);
    let z = -CFG.handOffset.x * Math.sin(yaw);
    let y = CFG.handOffset.y;
    const h = Math.cos(angle) * v0;
    let vx = h * Math.cos(yaw), vz = -h * Math.sin(yaw), vy = Math.sin(angle) * v0;
    const step = 0.07;
    for (let i = 0; i < AIM_N; i++) {
      vx += state.wind * step;
      vy -= CFG.gravity * step;
      x += vx * step;
      y += vy * step;
      z += vz * step;
      aimDots[i].visible = show;
      aimDots[i].position.set(x, y, z);
    }
  }

  // ------------------------------------------------ partículas
  const P_N = 700;
  const pGeo = new THREE.BufferGeometry();
  const pPos = new Float32Array(P_N * 3);
  const pCol = new Float32Array(P_N * 3);
  pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
  pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3));
  const particles = [];
  for (let i = 0; i < P_N; i++) {
    particles.push({ active: false, vx: 0, vy: 0, vz: 0, t: 0, life: 1, r: 0, g: 0, b: 0 });
    pPos[i * 3 + 1] = -9999;
  }
  const pointsMesh = new THREE.Points(pGeo, new THREE.PointsMaterial({
    size: 0.85, vertexColors: true, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  pointsMesh.frustumCulled = false;
  scene.add(pointsMesh);

  function spawnParticles(x, y, z, colorList, n, speed = [8, 60], up = 0) {
    for (let k = 0; k < n; k++) {
      const i = particles.findIndex(p => !p.active);
      if (i < 0) return;
      const p = particles[i];
      const col = new THREE.Color(colorList[(Math.random() * colorList.length) | 0]);
      const a = Math.random() * Math.PI * 2;
      const sp = rand(speed[0], speed[1]);
      p.active = true;
      p.t = 0;
      p.life = rand(0.5, 1.4);
      p.vx = Math.cos(a) * sp;
      p.vy = Math.abs(Math.sin(a)) * sp * 0.8 + up;
      p.vz = rand(-sp * 0.5, sp * 0.5);
      p.r = col.r; p.g = col.g; p.b = col.b;
      pPos[i * 3] = x + rand(-0.5, 0.5);
      pPos[i * 3 + 1] = y + rand(-0.5, 0.5);
      pPos[i * 3 + 2] = z + rand(-0.5, 0.5);
    }
  }
  function updateParticles(dt) {
    let any = false;
    for (let i = 0; i < P_N; i++) {
      const p = particles[i];
      if (!p.active) continue;
      any = true;
      p.t += dt;
      if (p.t > p.life || pPos[i * 3 + 1] < -1) {
        p.active = false;
        pPos[i * 3 + 1] = -9999;
        continue;
      }
      p.vy -= CFG.gravity * 0.55 * dt;
      pPos[i * 3] += p.vx * dt;
      pPos[i * 3 + 1] += p.vy * dt;
      pPos[i * 3 + 2] += p.vz * dt;
      const f = 1 - p.t / p.life;
      pCol[i * 3] = p.r * f;
      pCol[i * 3 + 1] = p.g * f;
      pCol[i * 3 + 2] = p.b * f;
    }
    if (any) {
      pGeo.attributes.position.needsUpdate = true;
      pGeo.attributes.color.needsUpdate = true;
    }
  }

  // ==================================================================
  // Niveles
  // ==================================================================
  function placeBasket() {
    const k = state.basket;
    k.x = rand(CFG.basketMinX, CFG.basketMaxX);
    // profundidad: nivel 1 casi de frente, después cada vez más desplazado en z
    const zAmp = Math.min(26, 2 + state.level * 4);
    k.z = rand(-zAmp, Math.min(zAmp, 15));
    const maxPed = Math.min(16, 3 + state.level * 2.5);
    k.pedestalH = state.level === 1 ? 0 : (Math.random() < 0.35 ? 0 : rand(4, maxPed));
    k.baseY = k.pedestalH;
    k.rimY = k.baseY + CFG.basketH;
    basketGroup.position.set(k.x, k.baseY, k.z);
    const hasPed = k.pedestalH > 0;
    pedestal.visible = pedestalCap.visible = hasPed;
    if (hasPed) {
      pedestal.scale.y = k.pedestalH;
      pedestal.position.set(k.x, k.pedestalH / 2, k.z);
      pedestalCap.position.set(k.x, k.pedestalH - 0.25, k.z);
    }
  }

  function setWind() {
    if (state.level < 3) { state.wind = 0; ui.windChip.style.display = "none"; return; }
    const max = Math.min(6, 1 + state.level * 0.7);
    state.wind = rand(-max, max);
    if (Math.abs(state.wind) < 0.8) state.wind = 0;
    ui.windChip.style.display = state.wind === 0 ? "none" : "flex";
    ui.windTxt.textContent = Math.round(Math.abs(state.wind) * 10);
    ui.windArrow.textContent = state.wind > 0 ? "→" : "←";
  }

  function newLevel(first = false) {
    makeCity();
    placeBasket();
    setWind();
    clearTrails();
    state.banana = null;
    bananaFly.visible = false;
    bananaHand.visible = true;
    state.celebrating = false;
    ui.levelTxt.textContent = state.level;
    ui.throwBtn.disabled = false;
    if (!first) showBanner(`¡NIVEL ${state.level}!`, "El canasto se movió… encontralo de nuevo 🧺");
  }

  function showBanner(title, sub, ms = 1900) {
    ui.bannerTitle.textContent = title;
    ui.bannerSub.textContent = sub;
    ui.banner.classList.add("show");
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(() => ui.banner.classList.remove("show"), ms);
  }

  // ==================================================================
  // Lanzamiento y física
  // ==================================================================
  function throwBanana() {
    if (state.banana || state.celebrating) return;
    const angle = (+ui.angle.value) * Math.PI / 180;
    const yaw = (+ui.yaw.value) * Math.PI / 180;        // giro: 0 = derecho, + hacia el fondo
    const v0 = (+ui.power.value) * CFG.powerToV;
    // la mano acompaña el giro del cuerpo
    const x = CFG.gorillaX + CFG.handOffset.x * Math.cos(yaw);
    const z = -CFG.handOffset.x * Math.sin(yaw);
    const y = CFG.handOffset.y;
    const h = Math.cos(angle) * v0;
    state.banana = {
      x, y, z, py: y,
      vx: h * Math.cos(yaw),
      vz: -h * Math.sin(yaw),
      vy: Math.sin(angle) * v0,
      yaw,
    };
    state.tries++;
    ui.triesTxt.textContent = state.tries;
    ui.throwBtn.disabled = true;
    state.armUp = 1;
    bananaHand.visible = false;
    bananaFly.visible = true;
    sndThrow();
  }

  function endThrow(hit) {
    commitTrailToLast();
    state.banana = null;
    bananaFly.visible = false;
    if (hit) {
      state.celebrating = true;
      sndScore();
      const k = state.basket;
      spawnParticles(k.x, k.rimY + 1, k.z, [0xffd54a, 0xff9d2e, 0x7cf29c, 0x7cc4ff, 0xff7ce0, 0xffffff], 130, [15, 55], 20);
      showBanner("🎯 ¡EMBOCASTE!", `Nivel ${state.level} superado`, 1600);
      setTimeout(() => { state.level++; newLevel(); }, 1900);
    } else {
      sndMiss();
      bananaHand.visible = true;
      ui.throwBtn.disabled = false;
    }
  }

  function updateBanana(dt) {
    const b = state.banana;
    if (!b) return;
    b.py = b.y;
    b.vx += state.wind * dt;
    b.vy -= CFG.gravity * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.z += b.vz * dt;
    pushTrail(b.x, b.y, b.z);

    bananaFly.position.set(b.x, b.y, b.z);
    bananaFly.rotation.y = Math.atan2(-b.vz, b.vx);   // el plano de giro sigue la dirección de vuelo
    bananaFly.rotation.z -= dt * 9;

    const k = state.basket;
    const dh = Math.hypot(b.x - k.x, b.z - k.z);      // distancia horizontal al eje del canasto

    // ¿entró por la boca? (cayendo y cruzando el plano del aro dentro del radio)
    if (b.vy < 0 && dh < CFG.rimR * 0.78 && b.py >= k.rimY && b.y < k.rimY + 0.3) {
      spawnParticles(k.x, k.rimY, k.z, [0xffd54a, 0xfff2c0], 30, [6, 25], 10);
      endThrow(true);
      return;
    }
    // golpe al cuerpo del canasto
    if (b.y < k.rimY && b.y > k.baseY - 0.3 && dh < CFG.rimR * 1.15) {
      spawnParticles(b.x, b.y, b.z, [0xc9d4ff, 0x8892b8], 16, [5, 22], 6);
      state.shake = 1.4;
      endThrow(false);
      return;
    }
    // golpe al pedestal
    if (k.pedestalH > 0 && b.y < k.baseY && b.y > 0 && dh < 2.7) {
      spawnParticles(b.x, b.y, b.z, [0xb0a0c8, 0x8892b8], 14, [5, 20], 5);
      state.shake = 1.2;
      endThrow(false);
      return;
    }
    // piso
    if (b.y < 0.45) {
      spawnParticles(b.x, 0.4, b.z, [0x9a8360, 0x6d5c40], 18, [5, 24], 8);
      state.shake = 1.1;
      endThrow(false);
      return;
    }
    // fuera de límites
    if (Math.abs(b.x) > CFG.boundsX || Math.abs(b.z) > CFG.boundsX) endThrow(false);
  }

  // ==================================================================
  // Bucle principal
  // ==================================================================
  const clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(0.033, clock.getDelta());
    state.time += dt;

    updateBanana(dt);
    updateParticles(dt);
    updateAim();

    // animaciones
    if (state.armUp > 0 && !state.banana) state.armUp = Math.max(0, state.armUp - dt * 3);
    armGroup.rotation.z = lerp(0.5, 2.55, state.armUp);
    arrow.position.set(0, CFG.basketH + 3.4 + Math.sin(state.time * 3) * 0.7, 0);
    arrow.rotation.y = state.time * 1.2;
    gorilla.position.y = state.celebrating ? Math.abs(Math.sin(state.time * 9)) * 1.3 : 0;
    starMat.opacity = 0.7 + 0.25 * Math.sin(state.time * 1.7);

    // el gorila rota suavemente hacia el giro elegido
    const targetYaw = (+ui.yaw.value) * Math.PI / 180;
    state.gorillaYaw += (targetYaw - state.gorillaYaw) * Math.min(1, dt * 10);
    gorilla.rotation.y = state.gorillaYaw;

    // cámara orbital + shake al fallar
    controls.update();
    if (state.shake > 0) {
      state.shake = Math.max(0, state.shake - dt * 4);
      camera.position.x += rand(-state.shake, state.shake) * 0.3;
      camera.position.y += rand(-state.shake, state.shake) * 0.3;
    }

    renderer.render(scene, camera);
  }

  // ==================================================================
  // Controles
  // ==================================================================
  function syncSlider(input, out, suffix) {
    const pct = (input.value - input.min) / (input.max - input.min) * 100;
    input.style.setProperty("--fill", pct + "%");
    out.textContent = input.value + suffix;
  }
  ui.angle.addEventListener("input", () => syncSlider(ui.angle, ui.angleOut, "°"));
  ui.yaw.addEventListener("input", () => syncSlider(ui.yaw, ui.yawOut, "°"));
  ui.power.addEventListener("input", () => syncSlider(ui.power, ui.powerOut, ""));
  ui.throwBtn.addEventListener("click", throwBanana);
  ui.viewBtn.addEventListener("click", resetView);

  window.addEventListener("keydown", (e) => {
    const bump = (input, delta, out, suffix) => {
      input.value = Math.min(+input.max, Math.max(+input.min, +input.value + delta));
      syncSlider(input, out, suffix);
    };
    switch (e.key) {
      case "ArrowUp":    bump(ui.angle,  1, ui.angleOut, "°"); e.preventDefault(); break;
      case "ArrowDown":  bump(ui.angle, -1, ui.angleOut, "°"); e.preventDefault(); break;
      case "ArrowRight": bump(ui.power,  1, ui.powerOut, "");  e.preventDefault(); break;
      case "ArrowLeft":  bump(ui.power, -1, ui.powerOut, "");  e.preventDefault(); break;
      case "q": case "Q": bump(ui.yaw,  1, ui.yawOut, "°"); e.preventDefault(); break;
      case "e": case "E": bump(ui.yaw, -1, ui.yawOut, "°"); e.preventDefault(); break;
      case " ":          throwBanana(); e.preventDefault(); break;
    }
  });

  // hint de rotación en celus verticales
  function checkOrientation() {
    const portrait = window.innerHeight > window.innerWidth * 1.2;
    const touch = "ontouchstart" in window;
    if (portrait && touch && !checkOrientation._shown) {
      checkOrientation._shown = true;
      ui.rotateHint.classList.add("show");
      setTimeout(() => ui.rotateHint.classList.remove("show"), 3500);
    }
  }

  // ==================================================================
  // Arranque
  // ==================================================================
  window.__game = { state, CFG, camera, controls };   // útil para depurar / testear
  onResize();
  resetView();
  newLevel(true);
  syncSlider(ui.angle, ui.angleOut, "°");
  syncSlider(ui.yaw, ui.yawOut, "°");
  syncSlider(ui.power, ui.powerOut, "");
  showBanner("🦍 GORILLA BANANA 3D", "Elegí ángulo y fuerza… ¡y embocá la banana! 🍌", 2600);
  checkOrientation();
  frame();
})();
</script>
</body>
