<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gorilla">
<title>🦍 Gorilla Banana 3D — homenaje a GORILLA.BAS</title>
<style>
  :root {
    --panel-bg: rgba(13, 17, 36, 0.66);
    --panel-border: rgba(255, 255, 255, 0.14);
    --accent: #ffd54a;
    --accent-2: #ff9d2e;
    --text: #eef2ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #0b0f24;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    display: flex;
    justify-content: space-between;
    gap: 8px;
    pointer-events: none;
    z-index: 5;
  }
  .hudGroup { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .3px;
    display: flex;
    align-items: center;
    gap: 7px;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
    white-space: nowrap;
  }
  .chip b { color: var(--accent); font-size: 15px; }
  button.chip {
    pointer-events: auto;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    touch-action: manipulation;
  }
  button.chip:active { transform: scale(.94); }
  #windArrow { display: inline-block; font-size: 14px; }

  /* ---------- banner de nivel ---------- */
  #banner {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .35s;
    z-index: 6;
    text-align: center;
    padding: 0 16px;
  }
  #banner.show { opacity: 1; }
  #banner h1 {
    font-size: clamp(30px, 9vw, 72px);
    font-weight: 800;
    background: linear-gradient(180deg, #fff, var(--accent) 55%, var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 6px 22px rgba(255, 170, 40, .45));
    transform: scale(.85);
    transition: transform .35s cubic-bezier(.2, 1.6, .4, 1);
  }
  #banner.show h1 { transform: scale(1); }
  #banner p { font-size: clamp(13px, 3.5vw, 17px); opacity: .9; font-weight: 600; text-shadow: 0 2px 8px rgba(0,0,0,.8); }

  /* ---------- hint de rotación ---------- */
  #rotateHint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
    z-index: 7;
    pointer-events: none;
    opacity: 0;
    transition: opacity .5s;
  }
  #rotateHint.show { opacity: 1; }

  /* ---------- controles ---------- */
  #controls {
    position: fixed;
    left: max(12px, env(safe-area-inset-left));
    right: max(12px, env(safe-area-inset-right));
    bottom: calc(10px + env(safe-area-inset-bottom));
    z-index: 5;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    align-items: center;
    gap: 10px 18px;
    background: var(--panel-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 12px 16px;
    box-shadow: 0 14px 40px rgba(0,0,0,.5);
    max-width: 1100px;
    margin: 0 auto;
  }
  .ctl { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ctl label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    opacity: .75;
    white-space: nowrap;
  }
  .ctl output {
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: 17px;
    color: var(--accent);
    min-width: 46px;
    text-align: right;
  }
  input[type="range"] {
    flex: 1;
    min-width: 0;
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent) var(--fill, 50%), rgba(255,255,255,.15) var(--fill, 50%));
    outline: none;
    cursor: pointer;
    touch-action: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--accent) 60%, var(--accent-2));
    box-shadow: 0 3px 10px rgba(0,0,0,.5), 0 0 0 3px rgba(255,213,74,.25);
  }
  input[type="range"]::-moz-range-thumb {
    width: 26px; height: 26px; border: none;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--accent) 60%, var(--accent-2));
    box-shadow: 0 3px 10px rgba(0,0,0,.5), 0 0 0 3px rgba(255,213,74,.25);
  }
  #throwBtn {
    font: inherit;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: .6px;
    padding: 13px 30px;
    border: none;
    border-radius: 14px;
    color: #2b1a00;
    background: linear-gradient(180deg, #ffe27a, var(--accent) 45%, var(--accent-2));
    box-shadow: 0 8px 22px rgba(255, 160, 30, .38), 0 1px 0 rgba(255,255,255,.6) inset;
    cursor: pointer;
    transition: transform .12s, filter .12s;
    touch-action: manipulation;
  }
  #throwBtn:active:not(:disabled) { transform: scale(.96); }
  #throwBtn:disabled { filter: grayscale(.7) brightness(.65); }

  /* móvil: sliders apilados, botón a lo ancho */
  @media (max-width: 640px) {
    #controls { grid-template-columns: 1fr; gap: 8px; padding: 10px 14px; }
    #throwBtn { width: 100%; padding: 14px; }
    .chip { font-size: 12px; padding: 6px 10px; }
  }
  /* pantallas bajas y anchas (celu apaisado): panel más compacto */
  @media (max-height: 450px) {
    #controls { padding: 8px 14px; gap: 6px 14px; }
    #throwBtn { padding: 10px 26px; font-size: 15px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div class="hudGroup">
    <div class="chip">🏆 Nivel <b id="levelTxt">1</b></div>
    <div class="chip">🎯 Intentos <b id="triesTxt">0</b></div>
    <button class="chip" id="scenBtn">🏙️ Ciudad</button>
  </div>
  <div class="hudGroup">
    <div class="chip" id="windChip" style="display:none">💨 <span id="windArrow">→</span> <b id="windTxt">0</b></div>
    <button class="chip" id="viewBtn">📷 Vista</button>
  </div>
</div>

<div id="banner"><h1 id="bannerTitle">¡GORILLA!</h1><p id="bannerSub">Emboca la banana en el canasto</p></div>
<div id="rotateHint">📱 Girá el teléfono para ver mejor</div>

<div id="controls">
  <div class="ctl">
    <label for="angle">Ángulo</label>
    <input type="range" id="angle" min="10" max="85" value="45" step="1">
    <output id="angleOut">45°</output>
  </div>
  <div class="ctl">
    <label for="yaw">Giro</label>
    <input type="range" id="yaw" min="-45" max="45" value="0" step="1">
    <output id="yawOut">0°</output>
  </div>
  <div class="ctl">
    <label for="power">Fuerza</label>
    <input type="range" id="power" min="20" max="100" value="60" step="1">
    <output id="powerOut">60</output>
  </div>
  <button id="throwBtn">🍌 ¡LANZAR!</button>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
(() => {
  "use strict";

  // ==================================================================
  // Configuración física común (unidades de mundo, suelo en y=0)
  // ==================================================================
  const CFG = {
    gravity: 38,                 // u/s²
    powerToV: 0.72,              // v0 = fuerza * powerToV
    basketH: 4.4,                // alto del canasto de mimbre
    boundsX: 80,
  };

  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;

  // ==================================================================
  // Escenarios
  // ==================================================================
  const SCENARIOS = {
    ciudad: {
      name: "Ciudad", emoji: "🏙️", next: "selva",
      fog: 0x453a75,
      skyStops: [[0, "#070a1c"], [0.26, "#1a2050"], [0.44, "#4a3a80"], [0.52, "#8a4a7d"], [1, "#8a4a7d"]],
      groundColor: 0x131b0e,
      thrower: "police", projectile: "rock", target: "basket", targetMesh: "trash",
      handOffset: { x: 3.7, y: 12.1 },
      rimR: 2.7,
      cupH: 5.5,
      pedestalColors: [0x554668, 0x6f5c86],
      randomEnv: true,
      throwLabel: "🪨 ¡LANZAR!",
      sub: "El policía practica puntería… ¡embocá la piedra en el tacho! 🗑️",
      moveMsg: "El tacho se movió… encontralo de nuevo 🗑️",
    },
    selva: {
      name: "Selva", emoji: "🌴", next: "basquet",
      fog: 0x35564a,
      skyStops: [[0, "#04120c"], [0.26, "#0a2a1e"], [0.44, "#1e5442"], [0.52, "#4a7a62"], [1, "#4a7a62"]],
      groundColor: 0x0e2410,
      thrower: "gorilla", projectile: "banana", target: "basket", targetMesh: "wicker",
      handOffset: { x: 4.3, y: 10.6 },
      rimR: 3.1,
      cupH: 4.4,
      pedestalColors: [0x5a4028, 0x74553a],   // tronco
      randomEnv: true,
      throwLabel: "🍌 ¡LANZAR!",
      sub: "El gorila en su casa… ¡embocá la banana entre los árboles! 🌴",
      moveMsg: "El canasto se movió… buscalo entre la selva 🌴",
    },
    basquet: {
      name: "Básquet", emoji: "🏀", next: "ciudad",
      fog: 0x453a75,
      skyStops: [[0, "#070a1c"], [0.26, "#1a2050"], [0.44, "#4a3a80"], [0.52, "#8a4a7d"], [1, "#8a4a7d"]],
      groundColor: 0x191b1f,
      thrower: "player", projectile: "ball", target: "hoop", targetMesh: "hoop",
      handOffset: { x: 3.7, y: 12.1 },
      rimR: 2.6,
      randomEnv: false,
      throwLabel: "🏀 ¡TIRAR!",
      sub: "Estadio lleno: el aro no se mueve… vos sí 🏀",
      moveMsg: "Cambiaste de posición en la cancha… ¡encestá! 🏀",
    },
  };

  const state = {
    scenKey: "ciudad",
    level: 1,
    tries: 0,
    wind: 0,                     // aceleración horizontal (eje x) u/s²
    banana: null,                // proyectil en vuelo {x,y,z,py,vx,vy,vz}
    celebrating: false,
    shake: 0,
    time: 0,
    armUp: 0,
    gorillaYaw: 0,               // giro animado del lanzador (radianes)
    thrower: { x: -38, z: 0 },
    basket: { x: 20, z: 0, baseY: 0, rimY: CFG.basketH, pedestalH: 0, rimR: 3.1 },
  };
  const scen = () => SCENARIOS[state.scenKey];

  const ui = {
    angle: document.getElementById("angle"),
    yaw: document.getElementById("yaw"),
    yawOut: document.getElementById("yawOut"),
    power: document.getElementById("power"),
    angleOut: document.getElementById("angleOut"),
    powerOut: document.getElementById("powerOut"),
    throwBtn: document.getElementById("throwBtn"),
    viewBtn: document.getElementById("viewBtn"),
    scenBtn: document.getElementById("scenBtn"),
    levelTxt: document.getElementById("levelTxt"),
    triesTxt: document.getElementById("triesTxt"),
    windChip: document.getElementById("windChip"),
    windTxt: document.getElementById("windTxt"),
    windArrow: document.getElementById("windArrow"),
    banner: document.getElementById("banner"),
    bannerTitle: document.getElementById("bannerTitle"),
    bannerSub: document.getElementById("bannerSub"),
    rotateHint: document.getElementById("rotateHint"),
  };

  // ==================================================================
  // Sonido y vibración
  // ==================================================================
  let audioCtx = null;
  function beep(freq, dur, type = "sine", vol = 0.15, when = 0) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const t = audioCtx.currentTime + when;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) { /* sin audio */ }
  }
  const vibrate = (p) => { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} };
  const sndThrow = () => { beep(220, .12, "triangle", .1); beep(440, .1, "triangle", .06, .04); vibrate(25); };
  const sndMiss  = () => { beep(110, .25, "sawtooth", .12); vibrate(60); };
  const sndScore = () => { [523, 659, 784, 1047].forEach((f, i) => beep(f, .18, "triangle", .14, i * .09)); vibrate([40, 60, 40, 60, 90]); };

  // ==================================================================
  // Escena three.js
  // ==================================================================
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById("app").appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x453a75, 150, 560);

  const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 1400);

  // cámara orbital estilo Google Earth
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 14;
  controls.maxDistance = 450;
  controls.maxPolarAngle = Math.PI / 2 + 0.04;

  function resetView() {
    const aspect = window.innerWidth / window.innerHeight;
    const vfov = THREE.MathUtils.degToRad(camera.fov);
    const hfov = 2 * Math.atan(Math.tan(vfov / 2) * aspect);
    const dW = 50 / Math.tan(hfov / 2);
    const dH = 17 / Math.tan(vfov / 2);
    const d = Math.max(dW, dH);
    const lookY = aspect < 0.9 ? 24 : 10.5;
    controls.target.set(1, lookY, 0);
    camera.position.set(1, lookY + 1.5, d);
    controls.update();
  }

  function onResize() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", () => setTimeout(() => { onResize(); resetView(); }, 250));

  // ------------------------------------------------ luces
  scene.add(new THREE.HemisphereLight(0x35426f, 0x0b0e16, 0.85));
  const moonLight = new THREE.DirectionalLight(0xcfdcff, 1.0);
  moonLight.position.set(30, 70, 35);
  moonLight.castShadow = true;
  moonLight.shadow.mapSize.set(1024, 1024);
  moonLight.shadow.camera.left = -70;
  moonLight.shadow.camera.right = 70;
  moonLight.shadow.camera.top = 60;
  moonLight.shadow.camera.bottom = -20;
  moonLight.shadow.camera.near = 20;
  moonLight.shadow.camera.far = 220;
  moonLight.shadow.bias = -0.002;
  scene.add(moonLight);
  const rimLight = new THREE.DirectionalLight(0x6a5aff, 0.35);
  rimLight.position.set(-40, 25, -30);
  scene.add(rimLight);

  // ------------------------------------------------ texturas utilitarias
  function gradientTexture(stops, w = 2, h = 512) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const g = c.getContext("2d");
    const grd = g.createLinearGradient(0, 0, 0, h);
    for (const [p, col] of stops) grd.addColorStop(p, col);
    g.fillStyle = grd;
    g.fillRect(0, 0, w, h);
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }
  function glowTexture(inner, outer) {
    const c = document.createElement("canvas");
    c.width = c.height = 128;
    const g = c.getContext("2d");
    const grd = g.createRadialGradient(64, 64, 4, 64, 64, 64);
    grd.addColorStop(0, inner);
    grd.addColorStop(1, outer);
    g.fillStyle = grd;
    g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }

  // ------------------------------------------------ cúpula de cielo, luna, estrellas
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(680, 32, 24),
    new THREE.MeshBasicMaterial({ fog: false, depthWrite: false, side: THREE.BackSide })
  );
  scene.add(sky);

  const starGeo = new THREE.BufferGeometry();
  {
    const n = 700, pos = new Float32Array(n * 3), R = 620;
    for (let i = 0; i < n; i++) {
      const az = rand(0, Math.PI * 2);
      const elev = rand(0.06, 1.5);
      pos[i * 3] = R * Math.cos(elev) * Math.cos(az);
      pos[i * 3 + 1] = R * Math.sin(elev);
      pos[i * 3 + 2] = R * Math.cos(elev) * Math.sin(az);
    }
    starGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  }
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0.85, fog: false });
  scene.add(new THREE.Points(starGeo, starMat));

  const moon = new THREE.Mesh(
    new THREE.CircleGeometry(13, 40),
    new THREE.MeshBasicMaterial({ color: 0xfdf6d8, fog: false })
  );
  moon.position.set(52, 105, -250);
  scene.add(moon);
  const moonGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture("rgba(255,248,214,.55)", "rgba(255,248,214,0)"),
    transparent: true, fog: false, depthWrite: false,
  }));
  moonGlow.scale.set(85, 85, 1);
  moonGlow.position.copy(moon.position).z -= 1;
  scene.add(moonGlow);

  // ------------------------------------------------ piso
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(3000, 1000),
    new THREE.MeshStandardMaterial({ color: 0x131b0e, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(0, 0, -100);
  ground.receiveShadow = true;
  scene.add(ground);

  // ==================================================================
  // Entornos
  // ==================================================================
  function disposeGroup(group) {
    group.traverse(o => {
      const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
      for (const m of mats) {
        if (m.map) m.map.dispose();
        if (m.emissiveMap) m.emissiveMap.dispose();
        m.dispose();
      }
      if (o.geometry && !sharedGeos.has(o.geometry)) o.geometry.dispose();
    });
  }
  const sharedGeos = new Set();

  // ---------- ciudad ----------
  function buildingTextures(rows) {
    const w = 64, h = rows * 16;
    const cm = document.createElement("canvas"); cm.width = w; cm.height = h;
    const ce = document.createElement("canvas"); ce.width = w; ce.height = h;
    const gm = cm.getContext("2d"), ge = ce.getContext("2d");
    const base = ["#232f57", "#1c2748", "#2a3763", "#1f2c52"][(Math.random() * 4) | 0];
    gm.fillStyle = base; gm.fillRect(0, 0, w, h);
    ge.fillStyle = "#000"; ge.fillRect(0, 0, w, h);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < 4; c++) {
        if (Math.random() < 0.42) continue;
        const x = 6 + c * 14, y = 5 + r * 16;
        const lit = Math.random() < 0.55;
        gm.fillStyle = lit ? "#ffd876" : "#0b1020";
        gm.fillRect(x, y, 8, 9);
        if (lit) { ge.fillStyle = "#ffca55"; ge.fillRect(x, y, 8, 9); }
      }
    }
    const map = new THREE.CanvasTexture(cm);
    map.encoding = THREE.sRGBEncoding;
    return { map, emissive: new THREE.CanvasTexture(ce) };
  }
  const texPool = [];
  for (const rows of [4, 4, 6, 6, 8, 8, 10, 12]) texPool.push({ rows, tex: buildingTextures(rows) });
  function pickTex(bh) {
    const want = bh / 3.2;
    let best = texPool[0];
    for (const p of texPool) if (Math.abs(p.rows - want) < Math.abs(best.rows - want)) best = p;
    return best.tex;
  }

  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  boxGeo.translate(0, 0.5, 0);
  sharedGeos.add(boxGeo);

  function buildCity(group, skipNearRow = false) {
    const rows = [
      { z: -20, hMin: 5,  hMax: 15, wMin: 7,  wMax: 13, gap: [4, 14] },
      { z: -45, hMin: 12, hMax: 34, wMin: 10, wMax: 18, gap: [3, 9] },
      { z: -80, hMin: 20, hMax: 55, wMin: 14, wMax: 24, gap: [2, 7] },
    ];
    if (skipNearRow) rows.shift();   // la cancha necesita despejada la primera línea
    for (const row of rows) {
      let x = -130;
      while (x < 130) {
        const bw = rand(row.wMin, row.wMax);
        const bh = rand(row.hMin, row.hMax);
        const t = pickTex(bh);
        const map = t.map.clone(); map.needsUpdate = true;
        const emis = t.emissive.clone(); emis.needsUpdate = true;
        map.wrapS = emis.wrapS = THREE.RepeatWrapping;
        map.repeat.x = emis.repeat.x = Math.max(1, Math.round(bw / 7));
        const sideMat = new THREE.MeshStandardMaterial({
          map, emissiveMap: emis, emissive: 0xffffff,
          emissiveIntensity: 0.62, roughness: 0.9,
        });
        const topMat = new THREE.MeshStandardMaterial({ color: 0x141b33, roughness: 1 });
        const b = new THREE.Mesh(boxGeo, [sideMat, sideMat, topMat, topMat, sideMat, sideMat]);
        b.position.set(x + bw / 2, 0, row.z + rand(-3, 3));
        b.scale.set(bw, bh, rand(row.wMin, row.wMax));
        group.add(b);
        x += bw + rand(row.gap[0], row.gap[1]);
      }
    }
  }

  // ---------- selva ----------
  function buildJungle(group) {
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a4028, roughness: 0.95 });
    const greens = [0x1c4a22, 0x2a5e2a, 0x1a3e1e, 0x35702f].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 }));
    const frondMat = new THREE.MeshStandardMaterial({ color: 0x2f6b2c, roughness: 0.9, side: THREE.DoubleSide });

    const inPlayArea = (x, z) => x > -52 && x < 54 && z > -34 && z < 22;

    for (let i = 0; i < 65; i++) {
      const x = rand(-145, 145), z = rand(-105, 55);
      if (inPlayArea(x, z)) continue;
      // adelante del plano de juego solo a los costados, y no gigantes:
      // un árbol pegado a la cámara tapa toda la escena
      if (z > -12 && Math.abs(x) < 75) continue;
      const s = z > -12 ? rand(0.7, 1.2) : rand(0.8, 2.1);
      const tree = new THREE.Group();
      if (Math.random() < 0.35) {
        // palmera: tronco curvado + frondas
        let px = 0, py = 0, tilt = rand(-0.18, 0.18);
        for (let k = 0; k < 4; k++) {
          const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.5 - k * 0.07, 0.6 - k * 0.07, 3.4, 7), trunkMat);
          px += Math.sin(tilt) * 3.2 * (k * 0.5);
          py = 1.6 + k * 3.1;
          seg.position.set(px, py, 0);
          seg.rotation.z = tilt * (k + 1) * 0.5;
          seg.castShadow = true;
          tree.add(seg);
        }
        for (let f = 0; f < 6; f++) {
          const frond = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 4), frondMat);
          frond.scale.set(2.8, 0.2, 0.8);
          const a = f / 6 * Math.PI * 2;
          frond.position.set(px + Math.cos(a) * 2.4, py + 1.6, Math.sin(a) * 2.4);
          frond.rotation.y = -a;
          frond.rotation.z = 0.35;
          tree.add(frond);
        }
      } else {
        // árbol de copa redonda
        const th = rand(4, 9);
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.8, th, 7), trunkMat);
        trunk.position.y = th / 2;
        trunk.castShadow = true;
        tree.add(trunk);
        const nBlobs = 2 + (Math.random() * 3 | 0);
        for (let b = 0; b < nBlobs; b++) {
          const r = rand(2.2, 3.6);
          const blob = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 9), greens[(Math.random() * greens.length) | 0]);
          blob.position.set(rand(-1.6, 1.6), th + rand(-0.5, 2.2), rand(-1.6, 1.6));
          blob.castShadow = true;
          tree.add(blob);
        }
      }
      tree.scale.setScalar(s);
      tree.position.set(x, 0, z);
      tree.rotation.y = rand(0, Math.PI * 2);
      group.add(tree);
    }
    // arbustos sueltos (algunos dentro del área de juego, bajitos)
    for (let i = 0; i < 30; i++) {
      const x = rand(-120, 120), z = rand(-80, 40);
      if (x > -50 && x < 52 && z > -8 && z < 8) continue;   // corredor de tiro despejado
      const bush = new THREE.Mesh(
        new THREE.SphereGeometry(rand(0.8, 1.8), 8, 6),
        greens[(Math.random() * greens.length) | 0]
      );
      bush.position.set(x, 0.6, z);
      bush.scale.y = 0.7;
      group.add(bush);
    }
    // vegetación de primer plano: helechos y plantas de hojas grandes
    // delante del gorila y a lo largo del borde inferior de la vista
    const lightGreens = [0x3f8a3f, 0x2f7a4a, 0x4a9a55].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, side: THREE.DoubleSide }));
    for (let i = 0; i < 30; i++) {
      const x = rand(-70, 70), z = rand(9, 22);
      const plant = new THREE.Group();
      const mat = lightGreens[(Math.random() * lightGreens.length) | 0];
      if (Math.random() < 0.55) {
        // helecho: frondas en abanico
        const nF = 5 + (Math.random() * 3 | 0);
        for (let f = 0; f < nF; f++) {
          const leaf = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 4), mat);
          leaf.scale.set(1.9, 0.14, 0.4);
          const a = f / nF * Math.PI * 2 + rand(0, 0.5);
          leaf.position.set(Math.cos(a) * 1.1, 0.8, Math.sin(a) * 1.1);
          leaf.rotation.y = -a;
          leaf.rotation.z = rand(0.35, 0.6);
          plant.add(leaf);
        }
      } else {
        // planta de hojas grandes y verticales
        const nL = 3 + (Math.random() * 3 | 0);
        for (let f = 0; f < nL; f++) {
          const leaf = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 6), mat);
          leaf.scale.set(0.55, 2.1, 0.14);
          const a = rand(0, Math.PI * 2);
          leaf.position.set(Math.cos(a) * 0.5, 1.7, Math.sin(a) * 0.5);
          leaf.rotation.y = -a;
          leaf.rotation.z = rand(-0.35, 0.35);
          plant.add(leaf);
        }
      }
      plant.scale.setScalar(rand(0.6, 1.25));
      plant.position.set(x, 0, z);
      plant.rotation.y = rand(0, Math.PI * 2);
      group.add(plant);
    }

    // luciérnagas
    const n = 60, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      pos[i * 3] = rand(-100, 100);
      pos[i * 3 + 1] = rand(0.8, 7);
      pos[i * 3 + 2] = rand(-70, 30);
    }
    const fg = new THREE.BufferGeometry();
    fg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    const fireflies = new THREE.Points(fg, new THREE.PointsMaterial({
      color: 0xd8ff7a, size: 0.55, transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    fireflies.name = "fireflies";
    group.add(fireflies);
  }

  // ---------- cancha de básquet ----------
  function courtTexture() {
    const W = 1024, H = 616;
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const g = c.getContext("2d");
    g.fillStyle = "#2e6b5c"; g.fillRect(0, 0, W, H);          // exterior verde
    g.fillStyle = "#31648f"; g.fillRect(38, 38, W - 76, H - 76); // interior azul
    g.strokeStyle = "rgba(255,255,255,.9)";
    g.lineWidth = 6;
    g.strokeRect(38, 38, W - 76, H - 76);
    // línea y círculo central
    g.beginPath(); g.moveTo(W / 2, 38); g.lineTo(W / 2, H - 38); g.stroke();
    g.beginPath(); g.arc(W / 2, H / 2, 78, 0, Math.PI * 2); g.stroke();
    // llaves y aros de tiro libre en ambos extremos
    for (const end of [0, 1]) {
      const dir = end === 0 ? 1 : -1;
      const bx = end === 0 ? 38 : W - 38;
      g.strokeRect(Math.min(bx, bx + dir * 210), H / 2 - 90, 210, 180);
      g.beginPath(); g.arc(bx + dir * 210, H / 2, 70, 0, Math.PI * 2); g.stroke();
      // triple
      g.beginPath();
      g.arc(bx + dir * 60, H / 2, 265, -Math.PI / 2, Math.PI / 2, end === 1);
      g.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 4;
    return tex;
  }

  // tribunas de estadio en U alrededor de la cancha, con público de colores
  function buildStands(group) {
    const stepMat = new THREE.MeshStandardMaterial({ color: 0x2a3240, roughness: 0.9 });
    const faceMat = new THREE.MeshStandardMaterial({ color: 0x39424f, roughness: 0.9 });
    const ROWS = 9, STEP_H = 2.3, STEP_D = 4.2;
    const crowdPos = [], crowdCol = [];
    const palette = [0xe04b3a, 0xffd54a, 0x4a9de0, 0x7cf29c, 0xf2f2f2, 0xff7ce0, 0xff9d2e, 0x9a7cf2];

    // cada lado: base (posición inicial), dirección de alejamiento y largo
    const sides = [
      { ox: 0,   oz: -40, dx: 0,  dz: -1, len: 170, along: "x" },   // fondo
      { ox: -60, oz: 0,   dx: -1, dz: 0,  len: 96,  along: "z" },   // detrás del lanzador
      { ox: 62,  oz: 0,   dx: 1,  dz: 0,  len: 96,  along: "z" },   // detrás del aro
    ];
    for (const s of sides) {
      for (let i = 0; i < ROWS; i++) {
        const step = new THREE.Mesh(boxGeo, i % 2 ? stepMat : faceMat);
        const cx = s.ox + s.dx * (i * STEP_D + STEP_D / 2);
        const cz = s.oz + s.dz * (i * STEP_D + STEP_D / 2);
        const topY = STEP_H * (i + 1);
        step.position.set(cx, 0, cz);
        if (s.along === "x") step.scale.set(s.len, topY, STEP_D);
        else step.scale.set(STEP_D, topY, s.len);
        group.add(step);
        // público sentado en cada fila (salteado, para que respire)
        for (let d = -s.len / 2 + 2; d < s.len / 2 - 2; d += rand(2.2, 4.2)) {
          if (Math.random() < 0.25) continue;
          const hx = s.along === "x" ? cx + d + rand(-0.4, 0.4) : cx + rand(-1, 1);
          const hz = s.along === "z" ? cz + d + rand(-0.4, 0.4) : cz + rand(-1, 1);
          crowdPos.push(hx, topY + 0.7, hz);
          const col = new THREE.Color(palette[(Math.random() * palette.length) | 0]);
          crowdCol.push(col.r, col.g, col.b);
        }
      }
    }
    const cg = new THREE.BufferGeometry();
    cg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(crowdPos), 3));
    cg.setAttribute("color", new THREE.BufferAttribute(new Float32Array(crowdCol), 3));
    const crowd = new THREE.Points(cg, new THREE.PointsMaterial({ size: 1.5, vertexColors: true, sizeAttenuation: true }));
    group.add(crowd);
  }

  function makeBanana(scale = 1) {

      new THREE.MeshStandardMaterial({ color: 0xffd23e, roughness: 0.5, emissive: 0x4a3300 })

  // ---------- aro de básquet ----------
  const HOOP = { x: 38.9, z: 0, rimY: 12, boardDX: 2.9 };   // rim center + tablero

  // ==================================================================
  // Estelas
  // ==================================================================
  const TRAIL_N = 320;
  function makeTrailLine(color, opacity) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(TRAIL_N * 3), 3));
    geo.setDrawRange(0, 0);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
      color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
    }));
    line.frustumCulled = false;
    scene.add(line);
    return line;
  }
  const trailLine = makeTrailLine(0xffd23e, 0.75);
  const lastTrailLine = makeTrailLine(0xbfa970, 0.16);
  let trailCount = 0;

  function pushTrail(x, y, z) {
    if (trailCount >= TRAIL_N) return;
    const arr = trailLine.geometry.attributes.position.array;
    arr[trailCount * 3] = x;
    arr[trailCount * 3 + 1] = y;
    arr[trailCount * 3 + 2] = z;
    trailCount++;
    trailLine.geometry.setDrawRange(0, trailCount);
    trailLine.geometry.attributes.position.needsUpdate = true;
  }
  function commitTrailToLast() {
    const src = trailLine.geometry.attributes.position.array;
    const dst = lastTrailLine.geometry.attributes.position.array;
    dst.set(src);
    lastTrailLine.geometry.setDrawRange(0, trailCount);
    lastTrailLine.geometry.attributes.position.needsUpdate = true;
    trailCount = 0;
    trailLine.geometry.setDrawRange(0, 0);
  }
  function clearTrails() {
    trailCount = 0;
    trailLine.geometry.setDrawRange(0, 0);
    lastTrailLine.geometry.setDrawRange(0, 0);
  }

  // ==================================================================
  // Puntería
  // ==================================================================
  const AIM_N = 13;
  const aimDots = [];
  for (let i = 0; i < AIM_N; i++) {
    const d = new THREE.Mesh(
      new THREE.SphereGeometry(0.34, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xfff2c0, transparent: true, opacity: 0.55 * (1 - i / AIM_N), toneMapped: false })
    );
    scene.add(d);
    aimDots.push(d);
  }
  function launchPoint(yaw) {
    const ho = scen().handOffset;
    return {
      x: state.thrower.x + ho.x * Math.cos(yaw),
      y: ho.y,
      z: state.thrower.z - ho.x * Math.sin(yaw),
    };
  }
  function updateAim() {
    const show = !state.banana && !state.celebrating;
    const angle = (+ui.angle.value) * Math.PI / 180;
    const yaw = (+ui.yaw.value) * Math.PI / 180;
    const v0 = (+ui.power.value) * CFG.powerToV;
    const p = launchPoint(yaw);
    let { x, y, z } = p;
    const h = Math.cos(angle) * v0;
    let vx = h * Math.cos(yaw), vz = -h * Math.sin(yaw), vy = Math.sin(angle) * v0;
    const step = 0.07;
    for (let i = 0; i < AIM_N; i++) {
      vx += state.wind * step;
      vy -= CFG.gravity * step;
      x += vx * step;
      y += vy * step;
      z += vz * step;
      aimDots[i].visible = show;
      aimDots[i].position.set(x, y, z);
    }
  }

  // ==================================================================
  // Partículas
  // ==================================================================
  const P_N = 700;
  const pGeo = new THREE.BufferGeometry();
  const pPos = new Float32Array(P_N * 3);
  const pCol = new Float32Array(P_N * 3);
  pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
  pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3));
  const particles = [];
  for (let i = 0; i < P_N; i++) {
    particles.push({ active: false, vx: 0, vy: 0, vz: 0, t: 0, life: 1, r: 0, g: 0, b: 0 });
    pPos[i * 3 + 1] = -9999;
  }
  const pointsMesh = new THREE.Points(pGeo, new THREE.PointsMaterial({
    size: 0.85, vertexColors: true, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  pointsMesh.frustumCulled = false;
  scene.add(pointsMesh);

  function spawnParticles(x, y, z, colorList, n, speed = [8, 60], up = 0) {
    for (let k = 0; k < n; k++) {
      const i = particles.findIndex(p => !p.active);
      if (i < 0) return;
      const p = particles[i];
      const col = new THREE.Color(colorList[(Math.random() * colorList.length) | 0]);
      const a = Math.random() * Math.PI * 2;
      const sp = rand(speed[0], speed[1]);
      p.active = true;
      p.t = 0;
      p.life = rand(0.5, 1.4);
      p.vx = Math.cos(a) * sp;
      p.vy = Math.abs(Math.sin(a)) * sp * 0.8 + up;
      p.vz = rand(-sp * 0.5, sp * 0.5);
      p.r = col.r; p.g = col.g; p.b = col.b;
      pPos[i * 3] = x + rand(-0.5, 0.5);
      pPos[i * 3 + 1] = y + rand(-0.5, 0.5);
      pPos[i * 3 + 2] = z + rand(-0.5, 0.5);
    }
  }
  function updateParticles(dt) {
    let any = false;
    for (let i = 0; i < P_N; i++) {
      const p = particles[i];
      if (!p.active) continue;
      any = true;
      p.t += dt;
      if (p.t > p.life || pPos[i * 3 + 1] < -1) {
        p.active = false;
        pPos[i * 3 + 1] = -9999;
        continue;
      }
      p.vy -= CFG.gravity * 0.55 * dt;
      pPos[i * 3] += p.vx * dt;
      pPos[i * 3 + 1] += p.vy * dt;
      pPos[i * 3 + 2] += p.vz * dt;
      const f = 1 - p.t / p.life;
      pCol[i * 3] = p.r * f;
      pCol[i * 3 + 1] = p.g * f;
      pCol[i * 3 + 2] = p.b * f;
    }
    if (any) {
      pGeo.attributes.position.needsUpdate = true;
      pGeo.attributes.color.needsUpdate = true;
    }
  }

  // ==================================================================
  // Niveles y escenarios
  // ==================================================================
  function placeLevel() {
    const sc = scen();
    const k = state.basket;
    k.rimR = sc.rimR;

    if (sc.target === "basket") {
      // el blanco se mueve, el gorila queda fijo
      state.thrower.x = -38;
      state.thrower.z = 0;
      k.x = rand(4, 44);
      const zAmp = Math.min(26, 2 + state.level * 4);
      k.z = rand(-zAmp, Math.min(zAmp, 15));
      const maxPed = Math.min(16, 3 + state.level * 2.5);
      k.pedestalH = state.level === 1 ? 0 : (Math.random() < 0.35 ? 0 : rand(4, maxPed));
      k.baseY = k.pedestalH;
      k.rimY = k.baseY + sc.cupH;
      const cupGroup = sc.targetMesh === "trash" ? trashGroup : basketGroup;
      cupGroup.position.set(k.x, k.baseY, k.z);
      const hasPed = k.pedestalH > 0;
      pedestal.visible = pedestalCap.visible = hasPed;
      if (hasPed) {
        pedestal.scale.y = k.pedestalH;
        pedestal.position.set(k.x, k.pedestalH / 2, k.z);
        pedestalCap.position.set(k.x, k.pedestalH - 0.25, k.z);
      }
    } else {
      // básquet: el aro es fijo, se mueve el jugador por la cancha
      k.x = HOOP.x; k.z = HOOP.z;
      k.rimY = HOOP.rimY;
      k.baseY = HOOP.rimY;      // el aro no tiene "cuerpo" abajo
      k.pedestalH = 0;
      pedestal.visible = pedestalCap.visible = false;
      const dist = Math.min(72, 18 + state.level * 6);
      const zAmp = Math.min(24, 3 + state.level * 4);
      state.thrower.z = rand(-zAmp, zAmp);
      state.thrower.x = Math.max(-42, HOOP.x - rand(dist * 0.7, dist));
    }
    activeThrower().position.set(state.thrower.x, 0, state.thrower.z);
  }

  function setWind() {
    if (state.level < 3) { state.wind = 0; ui.windChip.style.display = "none"; return; }
    const max = Math.min(6, 1 + state.level * 0.7);
    state.wind = rand(-max, max);
    if (Math.abs(state.wind) < 0.8) state.wind = 0;
    ui.windChip.style.display = state.wind === 0 ? "none" : "flex";
    ui.windTxt.textContent = Math.round(Math.abs(state.wind) * 10);
    ui.windArrow.textContent = state.wind > 0 ? "→" : "←";
  }

  function newLevel(first = false) {
    const sc = scen();
    if (sc.randomEnv || !envGroup || envGroup.userData.scen !== state.scenKey) {
      makeEnv();
      envGroup.userData.scen = state.scenKey;
    }
    placeLevel();
    setWind();
    clearTrails();
    state.banana = null;
    bananaFly.visible = ballFly.visible = rockFly.visible = false;
    handItem().visible = true;
    state.celebrating = false;
    ui.levelTxt.textContent = state.level;
    ui.throwBtn.disabled = false;
    if (!first) showBanner(`¡NIVEL ${state.level}!`, sc.moveMsg);
  }

  function applyScenario() {
    const sc = scen();
    scene.fog.color.setHex(sc.fog);
    if (sky.material.map) sky.material.map.dispose();
    sky.material.map = gradientTexture(sc.skyStops);
    sky.material.needsUpdate = true;
    ground.material.color.setHex(sc.groundColor);
    gorilla.visible = sc.thrower === "gorilla";
    player.visible = sc.thrower === "player";
    police.visible = sc.thrower === "police";
    basketGroup.visible = sc.targetMesh === "wicker";
    trashGroup.visible = sc.targetMesh === "trash";
    hoopGroup.visible = sc.targetMesh === "hoop";
    if (sc.pedestalColors) {
      pedestalMat.color.setHex(sc.pedestalColors[0]);
      pedestalCapMat.color.setHex(sc.pedestalColors[1]);
    }
    bananaHand.visible = sc.projectile === "banana";
    ballHand.visible = sc.projectile === "ball";
    rockHand.visible = sc.projectile === "rock";
    ui.throwBtn.textContent = sc.throwLabel;
    ui.scenBtn.textContent = `${sc.emoji} ${sc.name}`;
  }

  function switchScenario() {
    if (state.banana) return;   // no cambiar en pleno vuelo
    state.scenKey = scen().next;

    newLevel(true);

    showBanner(`${scen().emoji} ${scen().name.toUpperCase()}`, scen().sub, 2200);
  }

  function showBanner(title, sub, ms = 1900) {
    ui.bannerTitle.textContent = title;
    ui.bannerSub.textContent = sub;
    ui.banner.classList.add("show");
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(() => ui.banner.classList.remove("show"), ms);
  }

  // ==================================================================
  // Lanzamiento y física
  // ==================================================================
  function throwBanana() {
    if (state.banana || state.celebrating) return;
    const angle = (+ui.angle.value) * Math.PI / 180;
    const yaw = (+ui.yaw.value) * Math.PI / 180;
    const v0 = (+ui.power.value) * CFG.powerToV;
    const p = launchPoint(yaw);
    const h = Math.cos(angle) * v0;
    state.banana = {
      x: p.x, y: p.y, z: p.z,
      px: p.x, py: p.y, pz: p.z,
      vx: h * Math.cos(yaw),
      vz: -h * Math.sin(yaw),
      vy: Math.sin(angle) * v0,
    };
    state.tries++;
    ui.triesTxt.textContent = state.tries;
    ui.throwBtn.disabled = true;
    state.armUp = 1;
    handItem().visible = false;
    flyItem().visible = true;
    sndThrow();
  }

  function endThrow(hit) {
    commitTrailToLast();
    state.banana = null;
    bananaFly.visible = ballFly.visible = rockFly.visible = false;
    if (hit) {
      state.celebrating = true;
      sndScore();
      const k = state.basket;
      spawnParticles(k.x, k.rimY + 1, k.z, [0xffd54a, 0xff9d2e, 0x7cf29c, 0x7cc4ff, 0xff7ce0, 0xffffff], 130, [15, 55], 20);
      showBanner(scen().target === "hoop" ? "🏀 ¡ENCESTASTE!" : "🎯 ¡EMBOCASTE!", `Nivel ${state.level} superado`, 1600);
      setTimeout(() => { state.level++; newLevel(); }, 1900);
    } else {
      sndMiss();
      handItem().visible = true;
      ui.throwBtn.disabled = false;
    }
  }

  // integración con subpasos fijos: la trayectoria es idéntica a cualquier framerate
  const PHYS_H = 1 / 120;
  function updateBanana(dt) {
    if (!state.banana) return;
    let remaining = dt;
    while (remaining > 1e-6 && state.banana) {
      stepBanana(Math.min(PHYS_H, remaining));
      remaining -= PHYS_H;
    }
    const b = state.banana;
    if (!b) return;
    pushTrail(b.x, b.y, b.z);
    const item = flyItem();
    item.position.set(b.x, b.y, b.z);
    item.rotation.y = Math.atan2(-b.vz, b.vx);
    item.rotation.z -= dt * 9;
  }

  function stepBanana(dt) {
    const b = state.banana;
    b.px = b.x; b.py = b.y; b.pz = b.z;
    b.vx += state.wind * dt;
    b.vy -= CFG.gravity * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.z += b.vz * dt;

    const sc = scen();
    const k = state.basket;
    const dh = Math.hypot(b.x - k.x, b.z - k.z);

    // cruce del plano del aro (interpolado entre frames: robusto ante dt grande)
    if (b.vy < 0 && b.py >= k.rimY && b.y < k.rimY) {
      const f = (b.py - k.rimY) / (b.py - b.y);
      const cx = b.px + (b.x - b.px) * f;
      const cz = b.pz + (b.z - b.pz) * f;
      const dhc = Math.hypot(cx - k.x, cz - k.z);
      if (dhc < k.rimR * 0.78) {
        spawnParticles(k.x, k.rimY, k.z, [0xffd54a, 0xfff2c0], 30, [6, 25], 10);
        endThrow(true);
        return;
      }
      // pegó en el borde/hierro al cruzar
      const edgeR = sc.target === "hoop" ? k.rimR * 1.35 : k.rimR * 1.15;
      if (dhc < edgeR) {
        spawnParticles(cx, k.rimY, cz, sc.target === "hoop" ? [0xff9d5e, 0xffd0a8] : [0xc9d4ff, 0x8892b8], 14, [5, 22], 6);
        state.shake = 1.2;
        endThrow(false);
        return;
      }
    }

    if (sc.target === "basket") {
      // golpe al cuerpo del canasto
      if (b.y < k.rimY && b.y > k.baseY - 0.3 && dh < k.rimR * 1.15) {
        spawnParticles(b.x, b.y, b.z, [0xc9d4ff, 0x8892b8], 16, [5, 22], 6);
        state.shake = 1.4;
        endThrow(false);
        return;
      }
      // golpe al pedestal
      if (k.pedestalH > 0 && b.y < k.baseY && b.y > 0 && dh < 2.7) {
        spawnParticles(b.x, b.y, b.z, [0xb0a0c8, 0x8892b8], 14, [5, 20], 5);
        state.shake = 1.2;
        endThrow(false);
        return;
      }
    } else {
      // tablero
      const boardX = k.x + HOOP.boardDX;
      if (b.x > boardX - 0.4 && b.x < boardX + 0.8 && Math.abs(b.z - k.z) < 3.9 && b.y > 10.9 && b.y < 16.6) {
        spawnParticles(boardX, b.y, b.z, [0xdfe8f2, 0x9aa8c0], 14, [5, 22], 4);
        state.shake = 1.2;
        endThrow(false);
        return;
      }
      // poste
      if (b.y < 14 && Math.hypot(b.x - (k.x + 4.6), b.z - k.z) < 1) {
        spawnParticles(b.x, b.y, b.z, [0x9aa8c0], 10, [5, 18], 4);
        endThrow(false);
        return;
      }
    }

    // piso
    if (b.y < 0.45) {
      spawnParticles(b.x, 0.4, b.z, [0x9a8360, 0x6d5c40], 18, [5, 24], 8);
      state.shake = 1.1;
      endThrow(false);
      return;
    }
    // fuera de límites
    if (Math.abs(b.x) > CFG.boundsX || Math.abs(b.z) > CFG.boundsX) endThrow(false);
  }

  // ==================================================================
  // Bucle principal
  // ==================================================================
  const clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(0.033, clock.getDelta());
    state.time += dt;

    updateBanana(dt);
    updateParticles(dt);
    updateAim();

    // animaciones
    if (state.armUp > 0 && !state.banana) state.armUp = Math.max(0, state.armUp - dt * 3);
    gorillaArm.rotation.z = lerp(0.5, 2.55, state.armUp);
    playerArm.rotation.z = lerp(0.45, 2.6, state.armUp);
    policeArm.rotation.z = lerp(0.45, 2.6, state.armUp);
    const k = state.basket;
    const arrowBaseY = scen().target === "hoop" ? k.rimY + 4.6 : k.rimY + 3.2;
    arrow.position.set(k.x, arrowBaseY + Math.sin(state.time * 3) * 0.7, k.z);
    arrow.rotation.y = state.time * 1.2;
    const thrower = activeThrower();
    thrower.position.y = state.celebrating ? Math.abs(Math.sin(state.time * 9)) * 1.3 : 0;
    starMat.opacity = 0.7 + 0.25 * Math.sin(state.time * 1.7);
    if (envGroup) {
      const ff = envGroup.getObjectByName("fireflies");
      if (ff) ff.material.opacity = 0.55 + 0.4 * Math.sin(state.time * 2.3);
    }

    // el lanzador rota suavemente hacia el giro elegido
    const targetYaw = (+ui.yaw.value) * Math.PI / 180;
    state.gorillaYaw += (targetYaw - state.gorillaYaw) * Math.min(1, dt * 10);
    thrower.rotation.y = state.gorillaYaw;

    // cámara orbital + shake al fallar
    controls.update();
    if (state.shake > 0) {
      state.shake = Math.max(0, state.shake - dt * 4);
      camera.position.x += rand(-state.shake, state.shake) * 0.3;
      camera.position.y += rand(-state.shake, state.shake) * 0.3;
    }

    renderer.render(scene, camera);
  }

  // ==================================================================
  // Controles
  // ==================================================================
  function syncSlider(input, out, suffix) {
    const pct = (input.value - input.min) / (input.max - input.min) * 100;
    input.style.setProperty("--fill", pct + "%");
    out.textContent = input.value + suffix;
  }
  ui.angle.addEventListener("input", () => syncSlider(ui.angle, ui.angleOut, "°"));
  ui.yaw.addEventListener("input", () => syncSlider(ui.yaw, ui.yawOut, "°"));
  ui.power.addEventListener("input", () => syncSlider(ui.power, ui.powerOut, ""));
  ui.throwBtn.addEventListener("click", throwBanana);
  ui.viewBtn.addEventListener("click", resetView);
  ui.scenBtn.addEventListener("click", switchScenario);

  window.addEventListener("keydown", (e) => {
    const bump = (input, delta, out, suffix) => {
      input.value = Math.min(+input.max, Math.max(+input.min, +input.value + delta));
      syncSlider(input, out, suffix);
    };
    switch (e.key) {
      case "ArrowUp":    bump(ui.angle,  1, ui.angleOut, "°"); e.preventDefault(); break;
      case "ArrowDown":  bump(ui.angle, -1, ui.angleOut, "°"); e.preventDefault(); break;
      case "ArrowRight": bump(ui.power,  1, ui.powerOut, "");  e.preventDefault(); break;
      case "ArrowLeft":  bump(ui.power, -1, ui.powerOut, "");  e.preventDefault(); break;
      case "q": case "Q": bump(ui.yaw,  1, ui.yawOut, "°"); e.preventDefault(); break;
      case "e": case "E": bump(ui.yaw, -1, ui.yawOut, "°"); e.preventDefault(); break;
      case " ":          throwBanana(); e.preventDefault(); break;
    }
  });

  function checkOrientation() {
    const portrait = window.innerHeight > window.innerWidth * 1.2;
    const touch = "ontouchstart" in window;
    if (portrait && touch && !checkOrientation._shown) {
      checkOrientation._shown = true;
      ui.rotateHint.classList.add("show");
      setTimeout(() => ui.rotateHint.classList.remove("show"), 3500);
    }
  }

  // ==================================================================
  // Arranque
  // ==================================================================
  window.__game = { state, CFG, SCENARIOS, HOOP, camera, controls, switchScenario };
  onResize();
  resetView();
  applyScenario();
  newLevel(true);
  syncSlider(ui.angle, ui.angleOut, "°");
  syncSlider(ui.yaw, ui.yawOut, "°");
  syncSlider(ui.power, ui.powerOut, "");
  showBanner("🦍 GORILLA BANANA 3D", scen().sub, 2600);
  checkOrientation();
  frame();

  // PWA: service worker para instalar como app y jugar offline
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(() => { /* sin SW no pasa nada */ });
  }
})();
</script>
