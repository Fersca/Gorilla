<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gorilla">
<title>🦍 Gorilla Banana 3D — homenaje a GORILLA.BAS</title>
<style>
  :root {
    --panel-bg: rgba(13, 17, 36, 0.66);
    --panel-border: rgba(255, 255, 255, 0.14);
    --accent: #ffd54a;
    --accent-2: #ff9d2e;
    --text: #eef2ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #0b0f24;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    display: flex;
    justify-content: space-between;
    gap: 8px;
    pointer-events: none;
    z-index: 5;
  }
  .hudGroup { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .3px;
    display: flex;
    align-items: center;
    gap: 7px;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
    white-space: nowrap;
  }
  .chip b { color: var(--accent); font-size: 15px; }
  button.chip {
    pointer-events: auto;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    touch-action: manipulation;
  }
  button.chip:active { transform: scale(.94); }
  #windArrow { display: inline-block; font-size: 14px; }

  /* ---------- banner de nivel ---------- */
  #banner {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .35s;
    z-index: 6;
    text-align: center;
    padding: 0 16px;
  }
  #banner.show { opacity: 1; }
  #banner h1 {
    font-size: clamp(30px, 9vw, 72px);
    font-weight: 800;
    background: linear-gradient(180deg, #fff, var(--accent) 55%, var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 6px 22px rgba(255, 170, 40, .45));
    transform: scale(.85);
    transition: transform .35s cubic-bezier(.2, 1.6, .4, 1);
  }
  #banner.show h1 { transform: scale(1); }
  #banner p { font-size: clamp(13px, 3.5vw, 17px); opacity: .9; font-weight: 600; text-shadow: 0 2px 8px rgba(0,0,0,.8); }

  /* ---------- ranking ---------- */
  #rankOverlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 8;
    background: rgba(5, 8, 20, .55);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }
  #rankOverlay.show { display: flex; }
  #rankCard {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 20px 26px;
    min-width: 300px;
    max-width: 92vw;
    box-shadow: 0 24px 70px rgba(0,0,0,.6);
  }
  #rankCard h2 { font-size: 20px; margin-bottom: 14px; color: var(--accent); text-align: center; }
  #rankCard table { width: 100%; border-collapse: collapse; font-size: 14px; }
  #rankCard th, #rankCard td { padding: 7px 10px; text-align: right; white-space: nowrap; }
  #rankCard th:first-child, #rankCard td:first-child { text-align: left; }
  #rankCard th { opacity: .6; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
  #rankCard tr + tr td { border-top: 1px solid rgba(255,255,255,.08); }
  #rankCard td b { color: var(--accent); }
  .rankHint { margin-top: 12px; font-size: 11px; opacity: .5; text-align: center; }

  /* ---------- hint de rotación ---------- */
  #rotateHint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
    z-index: 7;
    pointer-events: none;
    opacity: 0;
    transition: opacity .5s;
  }
  #rotateHint.show { opacity: 1; }

  /* ---------- controles ---------- */
  #controls {
    position: fixed;
    left: max(12px, env(safe-area-inset-left));
    right: max(12px, env(safe-area-inset-right));
    bottom: calc(10px + env(safe-area-inset-bottom));
    z-index: 5;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    align-items: center;
    gap: 10px 18px;
    background: var(--panel-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 12px 16px;
    box-shadow: 0 14px 40px rgba(0,0,0,.5);
    max-width: 1100px;
    margin: 0 auto;
  }
  .ctl { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .ctlTop { display: flex; justify-content: space-between; align-items: baseline; }
  .ctlRow { display: flex; align-items: center; gap: 8px; }
  .ctl label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    opacity: .75;
    white-space: nowrap;
  }
  .stepBtn {
    flex: none;
    width: 36px;
    height: 36px;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 10px;
    background: rgba(255,255,255,.1);
    color: var(--text);
    font-size: 22px;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .stepBtn:active { background: rgba(255,213,74,.35); transform: scale(.92); }
  .ctl output {
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: 16px;
    color: var(--accent);
    text-align: right;
  }
  input[type="range"] {
    flex: 1;
    min-width: 0;
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent) var(--fill, 50%), rgba(255,255,255,.15) var(--fill, 50%));
    outline: none;
    cursor: pointer;
    touch-action: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--accent) 60%, var(--accent-2));
    box-shadow: 0 3px 10px rgba(0,0,0,.5), 0 0 0 3px rgba(255,213,74,.25);
  }
  input[type="range"]::-moz-range-thumb {
    width: 26px; height: 26px; border: none;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--accent) 60%, var(--accent-2));
    box-shadow: 0 3px 10px rgba(0,0,0,.5), 0 0 0 3px rgba(255,213,74,.25);
  }
  #throwBtn {
    font: inherit;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: .6px;
    padding: 13px 30px;
    border: none;
    border-radius: 14px;
    color: #2b1a00;
    background: linear-gradient(180deg, #ffe27a, var(--accent) 45%, var(--accent-2));
    box-shadow: 0 8px 22px rgba(255, 160, 30, .38), 0 1px 0 rgba(255,255,255,.6) inset;
    cursor: pointer;
    transition: transform .12s, filter .12s;
    touch-action: manipulation;
  }
  #throwBtn:active:not(:disabled) { transform: scale(.96); }
  #throwBtn:disabled { filter: grayscale(.7) brightness(.65); }

  /* móvil: sliders apilados, botón a lo ancho */
  @media (max-width: 640px) {
    #controls { grid-template-columns: 1fr; gap: 8px; padding: 10px 14px; }
    #throwBtn { width: 100%; padding: 14px; }
    .chip { font-size: 12px; padding: 6px 10px; }
  }
  /* pantallas bajas y anchas (celu apaisado): panel más compacto */
  @media (max-height: 450px) {
    #controls { padding: 8px 14px; gap: 6px 14px; }
    #throwBtn { padding: 10px 26px; font-size: 15px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div class="hudGroup">
    <div class="chip">🏆 Nivel <b id="levelTxt">1</b></div>
    <div class="chip">🎯 Intentos <b id="triesTxt">0</b></div>
    <button class="chip" id="scenBtn">🏙️ Ciudad</button>
    <button class="chip" id="rankBtn">🏆 Ranking</button>
  </div>
  <div class="hudGroup">
    <button class="chip" id="windBtn">💨 ON</button>
    <div class="chip" id="windChip" style="display:none"><span id="windArrow">→</span> <b id="windTxt">0</b></div>
    <button class="chip" id="viewBtn">📷 Vista</button>
  </div>
</div>

<div id="banner"><h1 id="bannerTitle">¡GORILLA!</h1><p id="bannerSub">Emboca la banana en el canasto</p></div>

<div id="rankOverlay">
  <div id="rankCard">
    <h2>🏆 Ranking</h2>
    <table id="rankTable"></table>
    <p class="rankHint">tocá en cualquier lado para cerrar</p>
  </div>
</div>
<div id="rotateHint">📱 Girá el teléfono para ver mejor</div>

<div id="controls">
  <div class="ctl">
    <div class="ctlTop"><label for="angle">Ángulo</label><output id="angleOut">45°</output></div>
    <div class="ctlRow">
      <button class="stepBtn" data-t="angle" data-d="-1">−</button>
      <input type="range" id="angle" min="10" max="85" value="45" step="1">
      <button class="stepBtn" data-t="angle" data-d="1">+</button>
    </div>
  </div>
  <div class="ctl">
    <div class="ctlTop"><label for="yaw">Giro</label><output id="yawOut">0°</output></div>
    <div class="ctlRow">
      <button class="stepBtn" data-t="yaw" data-d="-1">−</button>
      <input type="range" id="yaw" min="-45" max="45" value="0" step="1">
      <button class="stepBtn" data-t="yaw" data-d="1">+</button>
    </div>
  </div>
  <div class="ctl">
    <div class="ctlTop"><label for="power">Fuerza</label><output id="powerOut">60</output></div>
    <div class="ctlRow">
      <button class="stepBtn" data-t="power" data-d="-1">−</button>
      <input type="range" id="power" min="20" max="100" value="60" step="1">
      <button class="stepBtn" data-t="power" data-d="1">+</button>
    </div>
  </div>
  <button id="throwBtn">🍌 ¡LANZAR!</button>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
(() => {
  "use strict";

  // ==================================================================
  // Configuración física común (unidades de mundo, suelo en y=0)
  // ==================================================================
  const CFG = {
    gravity: 38,                 // u/s²
    powerToV: 0.72,              // v0 = fuerza * powerToV
    basketH: 4.4,                // alto del canasto de mimbre
    boundsX: 80,
  };

  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;

  // ==================================================================
  // Escenarios
  // ==================================================================
  const SCENARIOS = {
    ciudad: {
      name: "Ciudad", emoji: "🏙️", next: "selva",
      fog: 0x453a75,
      skyStops: [[0, "#070a1c"], [0.26, "#1a2050"], [0.44, "#4a3a80"], [0.52, "#8a4a7d"], [1, "#8a4a7d"]],
      groundColor: 0x131b0e,
      thrower: "police", projectile: "rock", target: "basket", targetMesh: "trash",
      handOffset: { x: 3.7, y: 12.1 },
      rimR: 2.7,
      cupH: 5.5,
      pedestalColors: [0x554668, 0x6f5c86],
      randomEnv: true,
      throwLabel: "🪨 ¡LANZAR!",
      sub: "El policía practica puntería… ¡embocá la piedra en el tacho! 🗑️",
      moveMsg: "El tacho se movió… encontralo de nuevo 🗑️",
    },
    selva: {
      name: "Selva", emoji: "🌴", next: "basquet",
      fog: 0x35564a,
      skyStops: [[0, "#04120c"], [0.26, "#0a2a1e"], [0.44, "#1e5442"], [0.52, "#4a7a62"], [1, "#4a7a62"]],
      groundColor: 0x0e2410,
      thrower: "gorilla", projectile: "banana", target: "basket", targetMesh: "wicker",
      handOffset: { x: 4.3, y: 10.6 },
      rimR: 3.1,
      cupH: 4.4,
      pedestalColors: [0x5a4028, 0x74553a],   // tronco
      randomEnv: true,
      throwLabel: "🍌 ¡LANZAR!",
      sub: "El gorila en su casa… ¡embocá la banana entre los árboles! 🌴",
      moveMsg: "El canasto se movió… buscalo entre la selva 🌴",
    },
    basquet: {
      name: "Básquet", emoji: "🏀", next: "arquero",
      fog: 0x453a75,
      skyStops: [[0, "#070a1c"], [0.26, "#1a2050"], [0.44, "#4a3a80"], [0.52, "#8a4a7d"], [1, "#8a4a7d"]],
      groundColor: 0x191b1f,
      thrower: "player", projectile: "ball", target: "hoop", targetMesh: "hoop",
      handOffset: { x: 3.7, y: 12.1 },
      rimR: 2.6,
      randomEnv: false,
      throwLabel: "🏀 ¡TIRAR!",
      sub: "Estadio lleno: el aro no se mueve… vos sí 🏀",
      moveMsg: "Cambiaste de posición en la cancha… ¡encestá! 🏀",
    },
    arquero: {
      name: "Arquero", emoji: "🏹", next: "ciudad",
      fog: 0x48604e,
      skyStops: [[0, "#0a1420"], [0.26, "#173442"], [0.44, "#2e5a50"], [0.52, "#5d7a55"], [1, "#5d7a55"]],
      groundColor: 0x1d3312,
      thrower: "archer", projectile: "arrow", target: "bullseye", targetMesh: "bullseye",
      handOffset: { x: 3.7, y: 12.1 },
      rimR: 2.0,                 // radio del blanco (los aros pintados)
      randomEnv: true,
      throwLabel: "🏹 ¡DISPARAR!",
      sub: "Bosque medieval: clavá la flecha en el blanco 🎯",
      moveMsg: "El blanco se movió… apuntá de nuevo 🏹",
    },
  };

  const state = {
    scenKey: "ciudad",
    level: 1,
    tries: 0,
    wind: 0,                     // aceleración horizontal (eje x) u/s²
    windEnabled: true,           // botón 💨 del HUD
    banana: null,                // proyectil en vuelo {x,y,z,py,vx,vy,vz}
    celebrating: false,
    shake: 0,
    time: 0,
    armUp: 0,
    gorillaYaw: 0,               // giro animado del lanzador (radianes)
    thrower: { x: -38, z: 0 },
    basket: { x: 20, z: 0, baseY: 0, rimY: CFG.basketH, pedestalH: 0, rimR: 3.1 },
  };
  const scen = () => SCENARIOS[state.scenKey];

  // ------------------------------------------------ récords persistentes
  let records = {};
  try { records = JSON.parse(localStorage.getItem("gorilla-records") || "{}"); } catch (e) {}
  function rec(key) {
    return records[key] || (records[key] = { best: 0, hits: 0, throws: 0 });
  }
  function saveRecords() {
    try { localStorage.setItem("gorilla-records", JSON.stringify(records)); } catch (e) {}
  }

  const ui = {
    angle: document.getElementById("angle"),
    yaw: document.getElementById("yaw"),
    yawOut: document.getElementById("yawOut"),
    power: document.getElementById("power"),
    angleOut: document.getElementById("angleOut"),
    powerOut: document.getElementById("powerOut"),
    throwBtn: document.getElementById("throwBtn"),
    viewBtn: document.getElementById("viewBtn"),
    scenBtn: document.getElementById("scenBtn"),
    windBtn: document.getElementById("windBtn"),
    rankBtn: document.getElementById("rankBtn"),
    rankOverlay: document.getElementById("rankOverlay"),
    rankTable: document.getElementById("rankTable"),
    levelTxt: document.getElementById("levelTxt"),
    triesTxt: document.getElementById("triesTxt"),
    windChip: document.getElementById("windChip"),
    windTxt: document.getElementById("windTxt"),
    windArrow: document.getElementById("windArrow"),
    banner: document.getElementById("banner"),
    bannerTitle: document.getElementById("bannerTitle"),
    bannerSub: document.getElementById("bannerSub"),
    rotateHint: document.getElementById("rotateHint"),
  };

  // ==================================================================
  // Sonido y vibración
  // ==================================================================
  let audioCtx = null, noiseBuf = null;
  function ctxA() {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, dur, type = "sine", vol = 0.15, when = 0) {
    try {
      const ac = ctxA();
      const t = ac.currentTime + when;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) { /* sin audio */ }
  }
  // "plop": tono que cae de frecuencia (gota / objeto que entra)
  function plop(f1, f2, dur, vol = 0.25, when = 0) {
    try {
      const ac = ctxA();
      const t = ac.currentTime + when;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  // ráfaga de ruido filtrado (silbidos de lanzamiento, swish de red)
  function whoosh(dur, f1, f2, vol, when = 0, type = "bandpass", q = 1.1) {
    try {
      const ac = ctxA();
      if (!noiseBuf) {
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      const t = ac.currentTime + when;
      const src = ac.createBufferSource();
      src.buffer = noiseBuf;
      src.loop = true;
      const fl = ac.createBiquadFilter();
      fl.type = type;
      fl.Q.value = q;
      fl.frequency.setValueAtTime(f1, t);
      fl.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.18);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(fl).connect(g).connect(ac.destination);
      src.start(t); src.stop(t + dur + 0.05);
    } catch (e) {}
  }
  const vibrate = (p) => { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} };

  // silbido de lanzamiento con carácter propio por proyectil
  function sndThrow(kind) {
    if (kind === "ball") {
      whoosh(0.35, 180, 750, 0.32);            // grave, pelota pesada
      beep(140, 0.08, "sine", 0.1);
    } else if (kind === "arrow") {
      plop(750, 240, 0.07, 0.22);              // ¡twang! de la cuerda
      whoosh(0.35, 1400, 2600, 0.18, 0.02, "bandpass", 3); // silbido fino
    } else if (kind === "rock") {
      whoosh(0.4, 90, 380, 0.36, 0, "lowpass"); // piedra: aire grave
      plop(90, 55, 0.12, 0.18);
    } else {
      whoosh(0.28, 500, 1700, 0.24);           // banana: silbido agudo
      beep(520, 0.07, "triangle", 0.05, 0.03);
    }
    vibrate(25);
  }
  const sndMiss = () => { beep(110, .25, "sawtooth", .12); whoosh(0.2, 300, 120, 0.2, 0, "lowpass"); vibrate(60); };
  // sonido de embocar, distinto según dónde cae
  function sndScore(targetMesh) {
    if (targetMesh === "trash") {
      // ¡clang! metálico del tacho
      [612, 1010, 1568].forEach((f, i) => beep(f * rand(0.99, 1.01), 0.45 - i * 0.09, "square", 0.06, 0.02));
      plop(150, 55, 0.14, 0.3);
    } else if (targetMesh === "hoop") {
      // swish de la red + pique
      whoosh(0.3, 2400, 700, 0.3, 0, "bandpass", 2.2);
      plop(220, 95, 0.14, 0.12, 0.1);
    } else if (targetMesh === "bullseye") {
      // ¡thock! de la flecha clavándose en la paja
      plop(240, 75, 0.08, 0.38);
      whoosh(0.12, 900, 280, 0.3, 0, "lowpass");
    } else {
      // plop en el mimbre
      plop(330, 85, 0.2, 0.32);
      whoosh(0.16, 260, 110, 0.2, 0.05, "lowpass");
    }

  function resetView() {
    const aspect = window.innerWidth / window.innerHeight;

  function gradientTexture(stops, w = 2, h = 512) {
    const c = document.createElement("canvas");

    g.fillRect(0, 0, w, h);
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }
  function glowTexture(inner, outer) {

    g.fillStyle = grd;
    g.fillRect(0, 0, 128, 128);

  function disposeGroup(group) {
    group.traverse(o => {
      const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
      for (const m of mats) {
        if (m.map) m.map.dispose();
        if (m.emissiveMap) m.emissiveMap.dispose();
        m.dispose();
      }
      if (o.geometry && !sharedGeos.has(o.geometry)) o.geometry.dispose();
    });
  }

  // ---------- ciudad ----------
  function buildingTextures(rows) {
    const w = 64, h = rows * 16;
    const cm = document.createElement("canvas"); cm.width = w; cm.height = h;
    const ce = document.createElement("canvas"); ce.width = w; ce.height = h;
    const gm = cm.getContext("2d"), ge = ce.getContext("2d");
    const base = ["#232f57", "#1c2748", "#2a3763", "#1f2c52"][(Math.random() * 4) | 0];
    gm.fillStyle = base; gm.fillRect(0, 0, w, h);
    ge.fillStyle = "#000"; ge.fillRect(0, 0, w, h);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < 4; c++) {
        if (Math.random() < 0.42) continue;
        const x = 6 + c * 14, y = 5 + r * 16;
        const lit = Math.random() < 0.55;
        gm.fillStyle = lit ? "#ffd876" : "#0b1020";
        gm.fillRect(x, y, 8, 9);
        if (lit) { ge.fillStyle = "#ffca55"; ge.fillRect(x, y, 8, 9); }
      }
    }
    const map = new THREE.CanvasTexture(cm);
    map.encoding = THREE.sRGBEncoding;
    return { map, emissive: new THREE.CanvasTexture(ce) };
  }
  const texPool = [];
  for (const rows of [4, 4, 6, 6, 8, 8, 10, 12]) texPool.push({ rows, tex: buildingTextures(rows) });
  function pickTex(bh) {
    const want = bh / 3.2;
    let best = texPool[0];
    for (const p of texPool) if (Math.abs(p.rows - want) < Math.abs(best.rows - want)) best = p;
    return best.tex;
  }

  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  boxGeo.translate(0, 0.5, 0);

  function buildCity(group, skipNearRow = false) {
    const rows = [
      { z: -20, hMin: 5,  hMax: 15, wMin: 7,  wMax: 13, gap: [4, 14] },
      { z: -45, hMin: 12, hMax: 34, wMin: 10, wMax: 18, gap: [3, 9] },
      { z: -80, hMin: 20, hMax: 55, wMin: 14, wMax: 24, gap: [2, 7] },
    ];
    if (skipNearRow) rows.shift();   // la cancha necesita despejada la primera línea
    group.userData.blinkers = [];
    const mastMat = new THREE.MeshStandardMaterial({ color: 0x2a2f3a, roughness: 0.6 });
    for (const row of rows) {
      let x = -130;
      while (x < 130) {
        const bw = rand(row.wMin, row.wMax);
        const bh = rand(row.hMin, row.hMax);
        const t = pickTex(bh);
        const map = t.map.clone(); map.needsUpdate = true;
        const emis = t.emissive.clone(); emis.needsUpdate = true;
        map.wrapS = emis.wrapS = THREE.RepeatWrapping;
        map.repeat.x = emis.repeat.x = Math.max(1, Math.round(bw / 7));
        const sideMat = new THREE.MeshStandardMaterial({
          map, emissiveMap: emis, emissive: 0xffffff,
          emissiveIntensity: 0.62, roughness: 0.9,
        });
        const topMat = new THREE.MeshStandardMaterial({ color: 0x141b33, roughness: 1 });
        const b = new THREE.Mesh(boxGeo, [sideMat, sideMat, topMat, topMat, sideMat, sideMat]);
        b.position.set(x + bw / 2, 0, row.z + rand(-3, 3));
        b.scale.set(bw, bh, rand(row.wMin, row.wMax));
        group.add(b);
        // antenas con baliza roja en los edificios más altos
        if (bh > 30 && Math.random() < 0.5) {
          const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.2, 6, 5), mastMat);
          mast.position.set(b.position.x, bh + 3, b.position.z);
          group.add(mast);
          const beacon = new THREE.Mesh(
            new THREE.SphereGeometry(0.45, 8, 6),
            new THREE.MeshBasicMaterial({ color: 0xff3b30, toneMapped: false })
          );
          beacon.position.set(b.position.x, bh + 6.2, b.position.z);
          group.add(beacon);
          group.userData.blinkers.push(beacon);
        }
        x += bw + rand(row.gap[0], row.gap[1]);
      }
    }
    if (!skipNearRow) {
      // farolas de vereda en primer plano
      const lampGlow = glowTexture("rgba(255,220,150,.85)", "rgba(255,220,150,0)");

        pole.position.set(lx, 4.75, 12);
        pole.castShadow = true;
        group.add(pole);
        const arm = new THREE.Mesh(new THREE.BoxGeometry(2, 0.25, 0.25), mastMat);
        arm.position.set(lx - 0.9, 9.4, 12);
        group.add(arm);
        const bulb = new THREE.Mesh(
          new THREE.SphereGeometry(0.42, 8, 6),
          new THREE.MeshBasicMaterial({ color: 0xffe2a8, toneMapped: false })
        );
        bulb.position.set(lx - 1.8, 9.2, 12);
        group.add(bulb);
        const gl = new THREE.Sprite(new THREE.SpriteMaterial({ map: lampGlow, transparent: true, depthWrite: false }));
        gl.scale.set(7, 7, 1);
        gl.position.copy(bulb.position);
        group.add(gl);
        const pl = new THREE.PointLight(0xffdca0, 0.4, 30, 1.8);
        pl.position.set(lx - 1.8, 8.6, 12);

  // ---------- selva ----------
  function buildJungle(group) {
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a4028, roughness: 0.95 });
    const greens = [0x1c4a22, 0x2a5e2a, 0x1a3e1e, 0x35702f].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 }));
    const frondMat = new THREE.MeshStandardMaterial({ color: 0x2f6b2c, roughness: 0.9, side: THREE.DoubleSide });

    const inPlayArea = (x, z) => x > -52 && x < 54 && z > -34 && z < 22;

    for (let i = 0; i < 65; i++) {
      const x = rand(-145, 145), z = rand(-105, 55);
      if (inPlayArea(x, z)) continue;
      // adelante del plano de juego solo a los costados, y no gigantes:
      // un árbol pegado a la cámara tapa toda la escena
      if (z > -12 && Math.abs(x) < 75) continue;
      const s = z > -12 ? rand(0.7, 1.2) : rand(0.8, 2.1);
      const tree = new THREE.Group();
      if (Math.random() < 0.35) {
        // palmera: tronco curvado + frondas
        let px = 0, py = 0, tilt = rand(-0.18, 0.18);
        for (let k = 0; k < 4; k++) {
          const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.5 - k * 0.07, 0.6 - k * 0.07, 3.4, 7), trunkMat);
          px += Math.sin(tilt) * 3.2 * (k * 0.5);
          py = 1.6 + k * 3.1;
          seg.position.set(px, py, 0);
          seg.rotation.z = tilt * (k + 1) * 0.5;
          seg.castShadow = true;
          tree.add(seg);
        }
        for (let f = 0; f < 6; f++) {
          const frond = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 4), frondMat);
          frond.scale.set(2.8, 0.2, 0.8);
          const a = f / 6 * Math.PI * 2;
          frond.position.set(px + Math.cos(a) * 2.4, py + 1.6, Math.sin(a) * 2.4);
          frond.rotation.y = -a;
          frond.rotation.z = 0.35;
          tree.add(frond);
        }
      } else {
        // árbol de copa redonda
        const th = rand(4, 9);
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.8, th, 7), trunkMat);
        trunk.position.y = th / 2;
        trunk.castShadow = true;
        tree.add(trunk);
        const nBlobs = 2 + (Math.random() * 3 | 0);
        for (let b = 0; b < nBlobs; b++) {
          const r = rand(2.2, 3.6);
          const blob = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 9), greens[(Math.random() * greens.length) | 0]);
          blob.position.set(rand(-1.6, 1.6), th + rand(-0.5, 2.2), rand(-1.6, 1.6));
          blob.castShadow = true;
          tree.add(blob);
        }
      }
      tree.scale.setScalar(s);
      tree.position.set(x, 0, z);
      tree.rotation.y = rand(0, Math.PI * 2);
      group.add(tree);
    }
    // arbustos sueltos (algunos dentro del área de juego, bajitos)
    for (let i = 0; i < 30; i++) {
      const x = rand(-120, 120), z = rand(-80, 40);
      if (x > -50 && x < 52 && z > -8 && z < 8) continue;   // corredor de tiro despejado
      const bush = new THREE.Mesh(
        new THREE.SphereGeometry(rand(0.8, 1.8), 8, 6),
        greens[(Math.random() * greens.length) | 0]
      );
      bush.position.set(x, 0.6, z);
      bush.scale.y = 0.7;
      group.add(bush);
    }
    // vegetación de primer plano: helechos y plantas de hojas grandes
    // delante del gorila y a lo largo del borde inferior de la vista
    const lightGreens = [0x3f8a3f, 0x2f7a4a, 0x4a9a55].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, side: THREE.DoubleSide }));
    for (let i = 0; i < 30; i++) {
      const x = rand(-70, 70), z = rand(9, 22);
      const plant = new THREE.Group();
      const mat = lightGreens[(Math.random() * lightGreens.length) | 0];
      if (Math.random() < 0.55) {
        // helecho: frondas en abanico
        const nF = 5 + (Math.random() * 3 | 0);
        for (let f = 0; f < nF; f++) {
          const leaf = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 4), mat);
          leaf.scale.set(1.9, 0.14, 0.4);
          const a = f / nF * Math.PI * 2 + rand(0, 0.5);
          leaf.position.set(Math.cos(a) * 1.1, 0.8, Math.sin(a) * 1.1);
          leaf.rotation.y = -a;
          leaf.rotation.z = rand(0.35, 0.6);
          plant.add(leaf);
        }
      } else {
        // planta de hojas grandes y verticales
        const nL = 3 + (Math.random() * 3 | 0);
        for (let f = 0; f < nL; f++) {
          const leaf = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 6), mat);
          leaf.scale.set(0.55, 2.1, 0.14);
          const a = rand(0, Math.PI * 2);
          leaf.position.set(Math.cos(a) * 0.5, 1.7, Math.sin(a) * 0.5);
          leaf.rotation.y = -a;
          leaf.rotation.z = rand(-0.35, 0.35);
          plant.add(leaf);
        }
      }
      plant.scale.setScalar(rand(0.6, 1.25));
      plant.position.set(x, 0, z);
      plant.rotation.y = rand(0, Math.PI * 2);
      group.add(plant);
    }

    // laguna espejada a un costado
    const lagoon = new THREE.Mesh(
      new THREE.CircleGeometry(13, 26),
      new THREE.MeshStandardMaterial({ color: 0x1d4a5e, roughness: 0.12, metalness: 0.7 })
    );
    lagoon.rotation.x = -Math.PI / 2;
    lagoon.scale.set(1.5, 0.75, 1);
    lagoon.position.set(-76, 0.05, 10);
    group.add(lagoon);
    // rocas
    const rockMat = new THREE.MeshStandardMaterial({ color: 0x6d7178, roughness: 0.95, flatShading: true });
    for (let i = 0; i < 7; i++) {
      const x = rand(-120, 120), z = rand(-60, 24);
      if (inPlayArea(x, z)) continue;
      const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(rand(0.9, 2.4), 0), rockMat);
      rock.position.set(x, 0.5, z);
      rock.rotation.set(rand(0, 3), rand(0, 3), 0);
      rock.castShadow = true;
      group.add(rock);

    // luciérnagas
    const n = 60, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      pos[i * 3] = rand(-100, 100);
      pos[i * 3 + 1] = rand(0.8, 7);
      pos[i * 3 + 2] = rand(-70, 30);
    }
    const fg = new THREE.BufferGeometry();
    fg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    const fireflies = new THREE.Points(fg, new THREE.PointsMaterial({
      color: 0xd8ff7a, size: 0.55, transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending, depthWrite: false,
    }));

    group.add(fireflies);

  // ---------- cancha de básquet ----------
  function courtTexture() {
    const W = 1024, H = 616;
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const g = c.getContext("2d");
    g.fillStyle = "#2e6b5c"; g.fillRect(0, 0, W, H);          // exterior verde
    g.fillStyle = "#31648f"; g.fillRect(38, 38, W - 76, H - 76); // interior azul
    g.strokeStyle = "rgba(255,255,255,.9)";
    g.lineWidth = 6;
    g.strokeRect(38, 38, W - 76, H - 76);
    // línea y círculo central
    g.beginPath(); g.moveTo(W / 2, 38); g.lineTo(W / 2, H - 38); g.stroke();
    g.beginPath(); g.arc(W / 2, H / 2, 78, 0, Math.PI * 2); g.stroke();
    // llaves y aros de tiro libre en ambos extremos
    for (const end of [0, 1]) {
      const dir = end === 0 ? 1 : -1;
      const bx = end === 0 ? 38 : W - 38;
      g.strokeRect(Math.min(bx, bx + dir * 210), H / 2 - 90, 210, 180);
      g.beginPath(); g.arc(bx + dir * 210, H / 2, 70, 0, Math.PI * 2); g.stroke();
      // triple
      g.beginPath();
      g.arc(bx + dir * 60, H / 2, 265, -Math.PI / 2, Math.PI / 2, end === 1);
      g.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 4;
    return tex;
  }

  // tribunas de estadio en U alrededor de la cancha, con público de colores
  function buildStands(group) {
    const stepMat = new THREE.MeshStandardMaterial({ color: 0x2a3240, roughness: 0.9 });
    const faceMat = new THREE.MeshStandardMaterial({ color: 0x39424f, roughness: 0.9 });
    const ROWS = 9, STEP_H = 2.3, STEP_D = 4.2;
    const crowdPos = [], crowdCol = [];
    const palette = [0xe04b3a, 0xffd54a, 0x4a9de0, 0x7cf29c, 0xf2f2f2, 0xff7ce0, 0xff9d2e, 0x9a7cf2];

    // cada lado: base (posición inicial), dirección de alejamiento y largo
    const sides = [
      { ox: 0,   oz: -40, dx: 0,  dz: -1, len: 170, along: "x" },   // fondo
      { ox: -60, oz: 0,   dx: -1, dz: 0,  len: 96,  along: "z" },   // detrás del lanzador
      { ox: 62,  oz: 0,   dx: 1,  dz: 0,  len: 96,  along: "z" },   // detrás del aro
    ];
    for (const s of sides) {
      for (let i = 0; i < ROWS; i++) {
        const step = new THREE.Mesh(boxGeo, i % 2 ? stepMat : faceMat);
        const cx = s.ox + s.dx * (i * STEP_D + STEP_D / 2);
        const cz = s.oz + s.dz * (i * STEP_D + STEP_D / 2);
        const topY = STEP_H * (i + 1);
        step.position.set(cx, 0, cz);
        if (s.along === "x") step.scale.set(s.len, topY, STEP_D);
        else step.scale.set(STEP_D, topY, s.len);
        group.add(step);
        // público sentado en cada fila (salteado, para que respire)
        for (let d = -s.len / 2 + 2; d < s.len / 2 - 2; d += rand(2.2, 4.2)) {
          if (Math.random() < 0.25) continue;
          const hx = s.along === "x" ? cx + d + rand(-0.4, 0.4) : cx + rand(-1, 1);
          const hz = s.along === "z" ? cz + d + rand(-0.4, 0.4) : cz + rand(-1, 1);
          crowdPos.push(hx, topY + 0.7, hz);
          const col = new THREE.Color(palette[(Math.random() * palette.length) | 0]);
          crowdCol.push(col.r, col.g, col.b);
        }
      }
    }
    const cg = new THREE.BufferGeometry();
    cg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(crowdPos), 3));
    cg.setAttribute("color", new THREE.BufferAttribute(new Float32Array(crowdCol), 3));
    const crowd = new THREE.Points(cg, new THREE.PointsMaterial({ size: 1.5, vertexColors: true, sizeAttenuation: true }));
    group.add(crowd);

    // marcador sobre la tribuna del fondo
    const sb = document.createElement("canvas");
    sb.width = 512; sb.height = 160;
    const sg = sb.getContext("2d");
    sg.fillStyle = "#10141c"; sg.fillRect(0, 0, 512, 160);
    sg.strokeStyle = "#ffd54a"; sg.lineWidth = 8; sg.strokeRect(8, 8, 496, 144);
    sg.fillStyle = "#ffd54a";
    sg.font = "bold 56px sans-serif";
    sg.textAlign = "center";
    sg.fillText("GORILLA ARENA", 256, 74);
    sg.fillStyle = "#f2f2f2";
    sg.font = "bold 40px sans-serif";
    sg.fillText("★ ★ ★", 256, 128);
    const sbTex = new THREE.CanvasTexture(sb);
    sbTex.encoding = THREE.sRGBEncoding;

  // ---------- bosque medieval ----------
  function buildForest(group) {
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a4028, roughness: 0.95 });
    const pineMat = new THREE.MeshStandardMaterial({ color: 0x1e4d2b, roughness: 0.9 });
    const oakMats = [0x2a5e2a, 0x35702f, 0x3f7a35].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 }));
    const inPlayArea = (x, z) => x > -52 && x < 54 && z > -34 && z < 22;

    // árboles: pinos y robles
    for (let i = 0; i < 55; i++) {
      const x = rand(-145, 145), z = rand(-100, 50);
      if (inPlayArea(x, z)) continue;
      if (z > -12 && Math.abs(x) < 75) continue;
      const s = z > -12 ? rand(0.7, 1.1) : rand(0.8, 1.9);
      const tree = new THREE.Group();
      if (Math.random() < 0.5) {
        // pino: conos apilados
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 3, 7), trunkMat);
        trunk.position.y = 1.5;
        trunk.castShadow = true;
        tree.add(trunk);
        for (let k = 0; k < 3; k++) {
          const cone = new THREE.Mesh(new THREE.ConeGeometry(3.4 - k * 0.9, 3.4, 9), pineMat);
          cone.position.y = 4 + k * 2.4;
          cone.castShadow = true;
          tree.add(cone);
        }
      } else {
        // roble de copa redonda
        const th = rand(3.5, 7);
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.85, th, 7), trunkMat);
        trunk.position.y = th / 2;
        trunk.castShadow = true;
        tree.add(trunk);
        for (let b = 0; b < 3; b++) {
          const r = rand(2.2, 3.4);
          const blob = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 9), oakMats[(Math.random() * oakMats.length) | 0]);
          blob.position.set(rand(-1.4, 1.4), th + rand(-0.4, 2), rand(-1.4, 1.4));
          blob.castShadow = true;
          tree.add(blob);
        }
      }
      tree.scale.setScalar(s);
      tree.position.set(x, 0, z);
      tree.rotation.y = rand(0, Math.PI * 2);
      group.add(tree);
    }

    // casitas medievales al fondo
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xe8dcc0, roughness: 0.9 });
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x7a3b2a, roughness: 0.85 });
    const doorMat = new THREE.MeshStandardMaterial({ color: 0x4a3016, roughness: 0.9 });
    const winMat = new THREE.MeshStandardMaterial({ color: 0xffd876, emissive: 0xffca55, emissiveIntensity: 0.8 });
    for (let i = 0; i < 6; i++) {
      const hx = rand(-110, 110), hz = rand(-75, -32);
      if (Math.abs(hx) < 20 && hz > -45) continue;
      const w = rand(9, 13), h = rand(5.5, 7.5), d = rand(8, 11);
      const house = new THREE.Group();
      const body = new THREE.Mesh(boxGeo, wallMat);
      body.scale.set(w, h, d);
      body.castShadow = true;
      house.add(body);
      const roof = new THREE.Mesh(new THREE.ConeGeometry(w * 0.85, h * 0.7, 4), roofMat);
      roof.position.y = h + h * 0.35;
      roof.rotation.y = Math.PI / 4;
      roof.castShadow = true;
      house.add(roof);
      const door = new THREE.Mesh(new THREE.BoxGeometry(1.8, 3, 0.3), doorMat);
      door.position.set(rand(-w / 4, w / 4), 1.5, d / 2 + 0.1);
      house.add(door);
      for (let wnd = 0; wnd < 2; wnd++) {
        const win = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.3, 0.25), winMat);
        win.position.set((wnd ? 1 : -1) * w / 3.2, h * 0.6, d / 2 + 0.1);
        house.add(win);
      }
      // chimenea
      const chim = new THREE.Mesh(new THREE.BoxGeometry(1, 2.4, 1), doorMat);
      chim.position.set(w / 4, h + 1.6, -d / 5);
      house.add(chim);
      house.position.set(hx, 0, hz);
      house.rotation.y = rand(-0.4, 0.4);
      group.add(house);
    }

    // flores en el prado
    const flowerMats = [0xfff2f2, 0xffd54a, 0xff9dc8].map(c => new THREE.MeshBasicMaterial({ color: c }));
    for (let i = 0; i < 70; i++) {
      const x = rand(-90, 90), z = rand(-40, 26);
      if (x > -48 && x < 50 && Math.abs(z) < 5) continue;   // corredor de tiro
      const f = new THREE.Mesh(new THREE.SphereGeometry(rand(0.14, 0.26), 6, 5), flowerMats[i % 3]);
      f.position.set(x, 0.35, z);
      group.add(f);
    }
    // arbustos bajos en primer plano
    for (let i = 0; i < 14; i++) {
      const bush = new THREE.Mesh(
        new THREE.SphereGeometry(rand(0.9, 1.7), 8, 6),
        oakMats[(Math.random() * oakMats.length) | 0]
      );
      bush.position.set(rand(-70, 70), 0.55, rand(10, 22));
      bush.scale.y = 0.65;
      group.add(bush);
    }

    // fogata cerca del campamento del arquero
    const fireX = -22, fireZ = 13;
    for (let i = 0; i < 3; i++) {
      const log = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 3, 7), trunkMat);
      log.position.set(fireX, 0.35, fireZ);
      log.rotation.set(Math.PI / 2, 0, i * Math.PI / 3);
      group.add(log);
    }
    const fireCone = new THREE.Mesh(
      new THREE.ConeGeometry(0.9, 2.4, 8),
      new THREE.MeshBasicMaterial({ color: 0xff7a1f, toneMapped: false })
    );
    fireCone.position.set(fireX, 1.5, fireZ);
    group.add(fireCone);
    const fireCore = new THREE.Mesh(
      new THREE.ConeGeometry(0.45, 1.4, 8),
      new THREE.MeshBasicMaterial({ color: 0xffd54a, toneMapped: false })
    );
    fireCore.position.set(fireX, 1.2, fireZ);
    group.add(fireCore);
    const fireGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture("rgba(255,150,50,.7)", "rgba(255,150,50,0)"),
      transparent: true, depthWrite: false,
    }));
    fireGlow.scale.set(9, 9, 1);
    fireGlow.position.set(fireX, 2, fireZ);
    group.add(fireGlow);
    const fireLight = new THREE.PointLight(0xff9a3a, 1, 42, 1.8);
    fireLight.position.set(fireX, 2.6, fireZ);
    group.add(fireLight);
    group.userData.fireLight = fireLight;
    group.userData.fireCone = fireCone;

    // estandartes medievales
    for (const [bx, bz, colA, colB] of [[-8, -26, "#a03030", "#e8dcc0"], [32, -30, "#2e4a8a", "#e8dcc0"]]) {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.24, 13, 7), trunkMat);
      pole.position.set(bx, 6.5, bz);
      pole.castShadow = true;
      group.add(pole);
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3.4, 6), trunkMat);
      bar.rotation.z = Math.PI / 2;
      bar.position.set(bx + 1.5, 12.6, bz);
      group.add(bar);
      const bc = document.createElement("canvas");
      bc.width = 64; bc.height = 96;
      const bg = bc.getContext("2d");
      bg.fillStyle = colA; bg.fillRect(0, 0, 32, 96);
      bg.fillStyle = colB; bg.fillRect(32, 0, 32, 96);
      bg.fillStyle = "#e8c34a";
      bg.beginPath(); bg.arc(32, 40, 13, 0, Math.PI * 2); bg.fill();
      const bTex = new THREE.CanvasTexture(bc);
      bTex.encoding = THREE.sRGBEncoding;
      const banner = new THREE.Mesh(
        new THREE.PlaneGeometry(3, 4.6),
        new THREE.MeshStandardMaterial({ map: bTex, side: THREE.DoubleSide, roughness: 0.9 })
      );
      banner.position.set(bx + 1.5, 10.2, bz);
      banner.castShadow = true;
      group.add(banner);
    }
  }

  const TRAIL_N = 320;
  function makeTrailLine(color, opacity) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(TRAIL_N * 3), 3));
    geo.setDrawRange(0, 0);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
      color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
    }));
    line.frustumCulled = false;
    scene.add(line);
    return line;
  }
  const trailLine = makeTrailLine(0xffd23e, 0.75);
  const lastTrailLine = makeTrailLine(0xbfa970, 0.16);
  let trailCount = 0;

  function pushTrail(x, y, z) {
    if (trailCount >= TRAIL_N) return;
    const arr = trailLine.geometry.attributes.position.array;
    arr[trailCount * 3] = x;
    arr[trailCount * 3 + 1] = y;
    arr[trailCount * 3 + 2] = z;
    trailCount++;
    trailLine.geometry.setDrawRange(0, trailCount);
    trailLine.geometry.attributes.position.needsUpdate = true;
  }
  function commitTrailToLast() {
    const src = trailLine.geometry.attributes.position.array;
    const dst = lastTrailLine.geometry.attributes.position.array;
    dst.set(src);
    lastTrailLine.geometry.setDrawRange(0, trailCount);
    lastTrailLine.geometry.attributes.position.needsUpdate = true;
    trailCount = 0;
    trailLine.geometry.setDrawRange(0, 0);
  }
  function clearTrails() {
    trailCount = 0;
    trailLine.geometry.setDrawRange(0, 0);
    lastTrailLine.geometry.setDrawRange(0, 0);
  }

  function launchPoint(yaw) {
    const ho = scen().handOffset;
    return {
      x: state.thrower.x + ho.x * Math.cos(yaw),
      y: ho.y,
      z: state.thrower.z - ho.x * Math.sin(yaw),
    };
  }
  function updateAim() {
    const show = !state.banana && !state.celebrating;
    const angle = (+ui.angle.value) * Math.PI / 180;
    const yaw = (+ui.yaw.value) * Math.PI / 180;
    const v0 = (+ui.power.value) * CFG.powerToV;
    const p = launchPoint(yaw);
    let { x, y, z } = p;
    const h = Math.cos(angle) * v0;
    let vx = h * Math.cos(yaw), vz = -h * Math.sin(yaw), vy = Math.sin(angle) * v0;
    const step = 0.07;
    for (let i = 0; i < AIM_N; i++) {
      vx += state.wind * step;
      vy -= CFG.gravity * step;
      x += vx * step;
      y += vy * step;
      z += vz * step;
      aimDots[i].visible = show;
      aimDots[i].position.set(x, y, z);
    }
  }

  // ==================================================================
  // Partículas
  // ==================================================================
  const P_N = 700;
  const pGeo = new THREE.BufferGeometry();
  const pPos = new Float32Array(P_N * 3);
  const pCol = new Float32Array(P_N * 3);
  pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
  pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3));
  const particles = [];
  for (let i = 0; i < P_N; i++) {
    particles.push({ active: false, vx: 0, vy: 0, vz: 0, t: 0, life: 1, r: 0, g: 0, b: 0 });
    pPos[i * 3 + 1] = -9999;
  }
  const pointsMesh = new THREE.Points(pGeo, new THREE.PointsMaterial({
    size: 0.85, vertexColors: true, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  pointsMesh.frustumCulled = false;
  scene.add(pointsMesh);

  function spawnParticles(x, y, z, colorList, n, speed = [8, 60], up = 0) {
    for (let k = 0; k < n; k++) {
      const i = particles.findIndex(p => !p.active);
      if (i < 0) return;
      const p = particles[i];
      const col = new THREE.Color(colorList[(Math.random() * colorList.length) | 0]);
      const a = Math.random() * Math.PI * 2;
      const sp = rand(speed[0], speed[1]);
      p.active = true;
      p.t = 0;
      p.life = rand(0.5, 1.4);
      p.vx = Math.cos(a) * sp;
      p.vy = Math.abs(Math.sin(a)) * sp * 0.8 + up;
      p.vz = rand(-sp * 0.5, sp * 0.5);
      p.r = col.r; p.g = col.g; p.b = col.b;
      pPos[i * 3] = x + rand(-0.5, 0.5);
      pPos[i * 3 + 1] = y + rand(-0.5, 0.5);
      pPos[i * 3 + 2] = z + rand(-0.5, 0.5);
    }
  }
  function updateParticles(dt) {
    let any = false;
    for (let i = 0; i < P_N; i++) {
      const p = particles[i];
      if (!p.active) continue;
      any = true;
      p.t += dt;
      if (p.t > p.life || pPos[i * 3 + 1] < -1) {
        p.active = false;
        pPos[i * 3 + 1] = -9999;
        continue;
      }
      p.vy -= CFG.gravity * 0.55 * dt;
      pPos[i * 3] += p.vx * dt;
      pPos[i * 3 + 1] += p.vy * dt;
      pPos[i * 3 + 2] += p.vz * dt;
      const f = 1 - p.t / p.life;
      pCol[i * 3] = p.r * f;
      pCol[i * 3 + 1] = p.g * f;
      pCol[i * 3 + 2] = p.b * f;
    }
    if (any) {
      pGeo.attributes.position.needsUpdate = true;
      pGeo.attributes.color.needsUpdate = true;
    }
  }

  // ==================================================================
  // Niveles y escenarios
  // ==================================================================
  function placeLevel() {
    const sc = scen();
    const k = state.basket;
    k.rimR = sc.rimR;

    // el lanzador retrocede a medida que sube el nivel
    const back = Math.min(12, (state.level - 1) * 2);

    if (sc.target === "basket") {
      // el blanco se mueve, el lanzador se aleja
      state.thrower.x = -34 - back;
      state.thrower.z = 0;
      k.rot = 0;
      k.x = rand(4, 44);
      const zAmp = Math.min(28, 2 + state.level * 4.5);
      k.z = rand(-zAmp, Math.min(zAmp, 16));
      const maxPed = Math.min(16, 3 + state.level * 2.5);
      k.pedestalH = state.level === 1 ? 0 : (Math.random() < 0.35 ? 0 : rand(4, maxPed));
      k.baseY = k.pedestalH;
      k.rimY = k.baseY + sc.cupH;
      const cupGroup = sc.targetMesh === "trash" ? trashGroup : basketGroup;
      cupGroup.position.set(k.x, k.baseY, k.z);
      const hasPed = k.pedestalH > 0;
      pedestal.visible = pedestalCap.visible = hasPed;
      if (hasPed) {
        pedestal.scale.y = k.pedestalH;
        pedestal.position.set(k.x, k.pedestalH / 2, k.z);
        pedestalCap.position.set(k.x, k.pedestalH - 0.25, k.z);
      }
    } else if (sc.target === "bullseye") {
      // el montículo con el blanco se mueve, el arquero se aleja
      state.thrower.x = -34 - back;
      state.thrower.z = 0;
      k.x = rand(4, 44);
      const zAmp = Math.min(26, 2 + state.level * 4.5);
      k.z = rand(-zAmp, Math.min(zAmp, 16));
      k.pedestalH = 0;
      k.baseY = 0;
      k.cy = BULL.cy;
      k.rimY = BULL.moundH;          // para la flecha indicadora
      // inclinación base hacia la cámara (se ve el disco) + giro extra por nivel
      k.rot = 0.3 + (state.level === 1 ? 0
            : (Math.random() < 0.5 ? -1 : 1) * rand(0.12, Math.min(0.65, 0.08 + state.level * 0.09)));
      pedestal.visible = pedestalCap.visible = false;
      bullseyeGroup.position.set(k.x, 0, k.z);
      bullseyeGroup.rotation.y = k.rot;
    } else {
      // básquet: el aro es fijo, se mueve el jugador por la cancha
      k.x = HOOP.x; k.z = HOOP.z;
      k.rot = 0;
      k.rimY = HOOP.rimY;
      k.baseY = HOOP.rimY;      // el aro no tiene "cuerpo" abajo
      k.pedestalH = 0;
      pedestal.visible = pedestalCap.visible = false;
      const dist = Math.min(78, 16 + state.level * 7);
      const zAmp = Math.min(26, 3 + state.level * 4.5);
      state.thrower.z = rand(-zAmp, zAmp);
      state.thrower.x = Math.max(-42, HOOP.x - rand(dist * 0.7, dist));
    }
    activeThrower().position.set(state.thrower.x, 0, state.thrower.z);
  }

  // ON = sopla siempre (se nota y se ven las hojas); OFF = tiro limpio
  function setWind() {
    if (!state.windEnabled) {
      state.wind = 0;
      ui.windChip.style.display = "none";
      return;
    }
    // el viento crece con el nivel: más fuerte y con piso más alto
    const max = Math.min(8, 1 + state.level * 0.9);
    const minMag = Math.min(0.8 + state.level * 0.3, max * 0.7);
    state.wind = (Math.random() < 0.5 ? -1 : 1) * rand(minMag, max);
    ui.windChip.style.display = "flex";
    ui.windTxt.textContent = Math.round(Math.abs(state.wind) * 10);
    ui.windArrow.textContent = state.wind > 0 ? "→" : "←";
  }

  function newLevel(first = false) {
    const sc = scen();
    if (sc.randomEnv || !envGroup || envGroup.userData.scen !== state.scenKey) {
      makeEnv();
      envGroup.userData.scen = state.scenKey;
    }
    placeLevel();
    setWind();
    clearTrails();
    state.banana = null;
    bananaFly.visible = ballFly.visible = rockFly.visible = arrowFly.visible = false;
    handItem().visible = true;
    state.celebrating = false;
    ui.levelTxt.textContent = state.level;
    ui.throwBtn.disabled = false;
    if (!first) showBanner(`¡NIVEL ${state.level}!`, sc.moveMsg);
  }

  function applyScenario() {
    const sc = scen();
    scene.fog.color.setHex(sc.fog);
    if (sky.material.map) sky.material.map.dispose();
    sky.material.map = gradientTexture(sc.skyStops);
    sky.material.needsUpdate = true;
    ground.material.color.setHex(sc.groundColor);
    gorilla.visible = sc.thrower === "gorilla";
    player.visible = sc.thrower === "player";
    police.visible = sc.thrower === "police";
    archer.visible = sc.thrower === "archer";
    basketGroup.visible = sc.targetMesh === "wicker";
    trashGroup.visible = sc.targetMesh === "trash";
    hoopGroup.visible = sc.targetMesh === "hoop";
    bullseyeGroup.visible = sc.targetMesh === "bullseye";
    if (sc.pedestalColors) {
      pedestalMat.color.setHex(sc.pedestalColors[0]);
      pedestalCapMat.color.setHex(sc.pedestalColors[1]);
    }
    bananaHand.visible = sc.projectile === "banana";
    ballHand.visible = sc.projectile === "ball";
    rockHand.visible = sc.projectile === "rock";
    arrowHand.visible = sc.projectile === "arrow";
    ui.throwBtn.textContent = sc.throwLabel;
    ui.scenBtn.textContent = `${sc.emoji} ${sc.name}`;
  }

  function switchScenario() {
    if (state.banana) return;   // no cambiar en pleno vuelo
    state.scenKey = scen().next;
    state.level = 1;
    state.tries = 0;
    ui.triesTxt.textContent = "0";
    state.gorillaYaw = 0;
    applyScenario();
    newLevel(true);
    ui.levelTxt.textContent = "1";
    showBanner(`${scen().emoji} ${scen().name.toUpperCase()}`, scen().sub, 2200);
  }

  function showBanner(title, sub, ms = 1900) {
    ui.bannerTitle.textContent = title;
    ui.bannerSub.textContent = sub;
    ui.banner.classList.add("show");
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(() => ui.banner.classList.remove("show"), ms);
  }

  // ==================================================================
  // Lanzamiento y física
  // ==================================================================
  function throwBanana() {
    if (state.banana || state.celebrating) return;
    const angle = (+ui.angle.value) * Math.PI / 180;
    const yaw = (+ui.yaw.value) * Math.PI / 180;
    const v0 = (+ui.power.value) * CFG.powerToV;
    const p = launchPoint(yaw);
    const h = Math.cos(angle) * v0;
    state.banana = {
      x: p.x, y: p.y, z: p.z,
      px: p.x, py: p.y, pz: p.z,
      vx: h * Math.cos(yaw),
      vz: -h * Math.sin(yaw),
      vy: Math.sin(angle) * v0,
    };
    state.tries++;
    ui.triesTxt.textContent = state.tries;
    rec(state.scenKey).throws++;
    saveRecords();
    ui.throwBtn.disabled = true;
    state.armUp = 1;
    handItem().visible = false;
    flyItem().visible = true;
    sndThrow(scen().projectile);
  }

  function endThrow(hit) {
    commitTrailToLast();
    state.banana = null;
    bananaFly.visible = ballFly.visible = rockFly.visible = arrowFly.visible = false;
    if (hit) {
      state.celebrating = true;
      const r = rec(state.scenKey);
      r.hits++;
      const isRecord = state.level > r.best;
      if (isRecord) r.best = state.level;
      saveRecords();
      sndScore(scen().targetMesh);
      const k = state.basket;
      spawnParticles(k.x, k.rimY + 1, k.z, [0xffd54a, 0xff9d2e, 0x7cf29c, 0x7cc4ff, 0xff7ce0, 0xffffff], 130, [15, 55], 20);
      const hitTitle = scen().target === "hoop" ? "🏀 ¡ENCESTASTE!"
                     : scen().target === "bullseye" ? "🏹 ¡EN EL BLANCO!"
                     : "🎯 ¡EMBOCASTE!";
      showBanner(hitTitle, isRecord ? `Nivel ${state.level} superado · 🏆 ¡récord nuevo!` : `Nivel ${state.level} superado`, 1600);
      setTimeout(() => { state.level++; newLevel(); }, 1900);
    } else {
      sndMiss();
      handItem().visible = true;
      ui.throwBtn.disabled = false;
    }
  }

  // integración con subpasos fijos: la trayectoria es idéntica a cualquier framerate
  const PHYS_H = 1 / 120;
  function updateBanana(dt) {
    if (!state.banana) return;
    let remaining = dt;
    while (remaining > 1e-6 && state.banana) {
      stepBanana(Math.min(PHYS_H, remaining));
      remaining -= PHYS_H;
    }
    const b = state.banana;
    if (!b) return;
    pushTrail(b.x, b.y, b.z);
    const item = flyItem();
    item.position.set(b.x, b.y, b.z);
    item.rotation.y = Math.atan2(-b.vz, b.vx);
    if (scen().projectile === "arrow") {
      // la flecha no gira: apunta siempre en la dirección del vuelo
      item.rotation.z = Math.atan2(b.vy, Math.hypot(b.vx, b.vz));
    } else {
      item.rotation.z -= dt * 9;
    }
  }

  function stepBanana(dt) {
    const b = state.banana;
    b.px = b.x; b.py = b.y; b.pz = b.z;
    b.vx += state.wind * dt;
    b.vy -= CFG.gravity * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.z += b.vz * dt;

    const sc = scen();
    const k = state.basket;
    const dh = Math.hypot(b.x - k.x, b.z - k.z);

    // blanco de arquería: plano vertical que puede estar girado (k.rot)
    if (sc.target === "bullseye") {
      const c = Math.cos(k.rot || 0), s = Math.sin(k.rot || 0);
      // coordenadas locales del blanco (x' = normal del disco, hacia el arquero es x'<0)
      const lx = c * (b.x - k.x) - s * (b.z - k.z);
      const lpx = c * (b.px - k.x) - s * (b.pz - k.z);
      if (lpx <= 0 && lx > 0) {
        const lz = s * (b.x - k.x) + c * (b.z - k.z);
        const lpz = s * (b.px - k.x) + c * (b.pz - k.z);
        const f = -lpx / (lx - lpx);
        const cy = b.py + (b.y - b.py) * f;
        const clz = lpz + (lz - lpz) * f;
        const dr = Math.hypot(cy - k.cy, clz);
        // punto de cruce en coordenadas de mundo
        const wx = k.x + s * clz, wz = k.z + c * clz;
        if (dr < k.rimR) {
          spawnParticles(wx, cy, wz, [0xffd54a, 0xfff2c0], 26, [5, 20], 8);
          endThrow(true);
          // la flecha queda clavada en el blanco durante el festejo
          arrowFly.visible = true;
          arrowFly.position.set(k.x - 3.4 * c + s * clz, cy, k.z + 3.4 * s + c * clz);
          arrowFly.rotation.set(0, k.rot || 0, 0);
          return;
        }
        const inMound = cy >= 0 && Math.pow(cy / BULL.moundH, 2) + Math.pow(clz / BULL.moundR, 2) < 1;
        if (inMound) {
          spawnParticles(wx, cy, wz, [0xd8b84a, 0xb89a3a], 18, [5, 22], 6);
          state.shake = 1.1;
          endThrow(false);
          return;
        }
      }
      if (b.y < 0.45) {
        spawnParticles(b.x, 0.4, b.z, [0x9a8360, 0x6d5c40], 18, [5, 24], 8);
        state.shake = 1.1;
        endThrow(false);
        return;
      }
      if (Math.abs(b.x) > CFG.boundsX || Math.abs(b.z) > CFG.boundsX) endThrow(false);
      return;
    }

    // cruce del plano del aro (interpolado entre frames: robusto ante dt grande)
    if (b.vy < 0 && b.py >= k.rimY && b.y < k.rimY) {
      const f = (b.py - k.rimY) / (b.py - b.y);
      const cx = b.px + (b.x - b.px) * f;
      const cz = b.pz + (b.z - b.pz) * f;
      const dhc = Math.hypot(cx - k.x, cz - k.z);
      if (dhc < k.rimR * 0.78) {
        spawnParticles(k.x, k.rimY, k.z, [0xffd54a, 0xfff2c0], 30, [6, 25], 10);
        endThrow(true);
        return;
      }
      // pegó en el borde/hierro al cruzar
      const edgeR = sc.target === "hoop" ? k.rimR * 1.35 : k.rimR * 1.15;
      if (dhc < edgeR) {
        spawnParticles(cx, k.rimY, cz, sc.target === "hoop" ? [0xff9d5e, 0xffd0a8] : [0xc9d4ff, 0x8892b8], 14, [5, 22], 6);
        state.shake = 1.2;
        endThrow(false);
        return;
      }
    }

    if (sc.target === "basket") {
      // golpe al cuerpo del canasto
      if (b.y < k.rimY && b.y > k.baseY - 0.3 && dh < k.rimR * 1.15) {
        spawnParticles(b.x, b.y, b.z, [0xc9d4ff, 0x8892b8], 16, [5, 22], 6);
        state.shake = 1.4;
        endThrow(false);
        return;
      }
      // golpe al pedestal
      if (k.pedestalH > 0 && b.y < k.baseY && b.y > 0 && dh < 2.7) {
        spawnParticles(b.x, b.y, b.z, [0xb0a0c8, 0x8892b8], 14, [5, 20], 5);
        state.shake = 1.2;
        endThrow(false);
        return;
      }
    } else {
      // tablero
      const boardX = k.x + HOOP.boardDX;
      if (b.x > boardX - 0.4 && b.x < boardX + 0.8 && Math.abs(b.z - k.z) < 3.9 && b.y > 10.9 && b.y < 16.6) {
        spawnParticles(boardX, b.y, b.z, [0xdfe8f2, 0x9aa8c0], 14, [5, 22], 4);
        state.shake = 1.2;
        endThrow(false);
        return;
      }
      // poste
      if (b.y < 14 && Math.hypot(b.x - (k.x + 4.6), b.z - k.z) < 1) {
        spawnParticles(b.x, b.y, b.z, [0x9aa8c0], 10, [5, 18], 4);
        endThrow(false);
        return;
      }
    }

    // piso
    if (b.y < 0.45) {
      spawnParticles(b.x, 0.4, b.z, [0x9a8360, 0x6d5c40], 18, [5, 24], 8);
      state.shake = 1.1;
      endThrow(false);
      return;
    }
    // fuera de límites
    if (Math.abs(b.x) > CFG.boundsX || Math.abs(b.z) > CFG.boundsX) endThrow(false);
  }

  // ==================================================================
  // Bucle principal
  // ==================================================================
  const clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(0.033, clock.getDelta());
    state.time += dt;

    updateBanana(dt);
    updateParticles(dt);
    updateLeaves(dt);
    updateAim();

    // animaciones
    if (state.armUp > 0 && !state.banana) state.armUp = Math.max(0, state.armUp - dt * 3);
    gorillaArm.rotation.z = lerp(0.5, 2.55, state.armUp);
    playerArm.rotation.z = lerp(0.45, 2.6, state.armUp);
    policeArm.rotation.z = lerp(0.45, 2.6, state.armUp);
    archerArm.rotation.z = lerp(0.45, 2.6, state.armUp);
    const k = state.basket;
    const arrowBaseY = scen().target === "hoop" ? k.rimY + 4.6 : k.rimY + 3.2;
    arrow.position.set(k.x, arrowBaseY + Math.sin(state.time * 3) * 0.7, k.z);
    arrow.rotation.y = state.time * 1.2;
    const thrower = activeThrower();
    thrower.position.y = state.celebrating ? Math.abs(Math.sin(state.time * 9)) * 1.3 : 0;
    starMat.opacity = 0.7 + 0.25 * Math.sin(state.time * 1.7);
    if (envGroup) {
      const ff = envGroup.getObjectByName("fireflies");
      if (ff) ff.material.opacity = 0.55 + 0.4 * Math.sin(state.time * 2.3);
      // balizas rojas de las antenas
      const bl = envGroup.userData.blinkers;
      if (bl) for (let i = 0; i < bl.length; i++) bl[i].visible = Math.sin(state.time * 2.4 + i * 1.9) > -0.15;
      // fuego de la fogata
      const fl = envGroup.userData.fireLight;
      if (fl) fl.intensity = 0.8 + 0.35 * Math.sin(state.time * 9) + Math.random() * 0.25;
      const fc = envGroup.userData.fireCone;
      if (fc) {
        const s = 0.9 + 0.16 * Math.sin(state.time * 11) + 0.06 * Math.random();
        fc.scale.set(s, 1 + 0.22 * Math.random(), s);
      }
    }

    // el lanzador rota suavemente hacia el giro elegido
    const targetYaw = (+ui.yaw.value) * Math.PI / 180;
    state.gorillaYaw += (targetYaw - state.gorillaYaw) * Math.min(1, dt * 10);
    thrower.rotation.y = state.gorillaYaw;

    // cámara orbital + shake al fallar
    controls.update();
    if (state.shake > 0) {
      state.shake = Math.max(0, state.shake - dt * 4);
      camera.position.x += rand(-state.shake, state.shake) * 0.3;
      camera.position.y += rand(-state.shake, state.shake) * 0.3;
    }

    renderer.render(scene, camera);
  }

  // ==================================================================
  // Controles
  // ==================================================================
  function syncSlider(input, out, suffix) {
    const pct = (input.value - input.min) / (input.max - input.min) * 100;
    input.style.setProperty("--fill", pct + "%");
    out.textContent = input.value + suffix;
  }
  ui.angle.addEventListener("input", () => syncSlider(ui.angle, ui.angleOut, "°"));
  ui.yaw.addEventListener("input", () => syncSlider(ui.yaw, ui.yawOut, "°"));
  ui.power.addEventListener("input", () => syncSlider(ui.power, ui.powerOut, ""));
  ui.throwBtn.addEventListener("click", throwBanana);
  ui.viewBtn.addEventListener("click", resetView);
  ui.scenBtn.addEventListener("click", switchScenario);
  ui.windBtn.addEventListener("click", () => {
    state.windEnabled = !state.windEnabled;
    ui.windBtn.textContent = state.windEnabled ? "💨 ON" : "💨 OFF";
    setWind();
  });

  // ------------------------------------------------ ranking
  function showRanking() {
    const rows = Object.keys(SCENARIOS).map(key => {
      const sc = SCENARIOS[key], r = rec(key);
      const pct = r.throws ? Math.round(r.hits / r.throws * 100) : 0;
      return { sc, r, pct };
    }).sort((a, b) => b.r.best - a.r.best);
    ui.rankTable.innerHTML =
      "<tr><th>Escenario</th><th>Mejor nivel</th><th>Emboques</th><th>Intentos</th><th>Efect.</th></tr>" +
      rows.map(({ sc, r, pct }) =>
        `<tr><td>${sc.emoji} ${sc.name}</td><td><b>${r.best || "—"}</b></td><td>${r.hits}</td><td>${r.throws}</td><td>${r.throws ? pct + "%" : "—"}</td></tr>`
      ).join("");
    ui.rankOverlay.classList.add("show");
  }
  ui.rankBtn.addEventListener("click", showRanking);
  ui.rankOverlay.addEventListener("click", () => ui.rankOverlay.classList.remove("show"));

  // ------------------------------------------------ botones −/+ de cada slider
  const SLIDER_META = {
    angle: [ui.angle, ui.angleOut, "°"],
    yaw: [ui.yaw, ui.yawOut, "°"],
    power: [ui.power, ui.powerOut, ""],
  };
  function bumpSlider(name, delta) {
    const [input, out, suffix] = SLIDER_META[name];
    input.value = Math.min(+input.max, Math.max(+input.min, +input.value + delta));
    syncSlider(input, out, suffix);
  }
  document.querySelectorAll(".stepBtn").forEach((btn) => {
    const t = btn.dataset.t, d = +btn.dataset.d;
    let holdTO = null, holdIV = null;
    const stop = () => { clearTimeout(holdTO); clearInterval(holdIV); holdTO = holdIV = null; };
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      bumpSlider(t, d);
      // mantener apretado repite
      holdTO = setTimeout(() => { holdIV = setInterval(() => bumpSlider(t, d), 100); }, 380);
    });
    btn.addEventListener("pointerup", stop);
    btn.addEventListener("pointercancel", stop);
    btn.addEventListener("pointerleave", stop);
  });

  window.addEventListener("keydown", (e) => {
    const bump = (input, delta, out, suffix) => {
      input.value = Math.min(+input.max, Math.max(+input.min, +input.value + delta));
      syncSlider(input, out, suffix);
    };
    switch (e.key) {
      case "ArrowUp":    bump(ui.angle,  1, ui.angleOut, "°"); e.preventDefault(); break;
      case "ArrowDown":  bump(ui.angle, -1, ui.angleOut, "°"); e.preventDefault(); break;
      case "ArrowRight": bump(ui.power,  1, ui.powerOut, "");  e.preventDefault(); break;
      case "ArrowLeft":  bump(ui.power, -1, ui.powerOut, "");  e.preventDefault(); break;
      case "q": case "Q": bump(ui.yaw,  1, ui.yawOut, "°"); e.preventDefault(); break;
      case "e": case "E": bump(ui.yaw, -1, ui.yawOut, "°"); e.preventDefault(); break;
      case " ":          throwBanana(); e.preventDefault(); break;
    }
  });

  function checkOrientation() {
    const portrait = window.innerHeight > window.innerWidth * 1.2;
    const touch = "ontouchstart" in window;
    if (portrait && touch && !checkOrientation._shown) {
      checkOrientation._shown = true;
      ui.rotateHint.classList.add("show");
      setTimeout(() => ui.rotateHint.classList.remove("show"), 3500);
    }
  }

  // ==================================================================
  // Arranque
  // ==================================================================
  window.__game = { state, CFG, SCENARIOS, HOOP, camera, controls, switchScenario, newLevel };
  onResize();
  resetView();
  applyScenario();
  newLevel(true);
  syncSlider(ui.angle, ui.angleOut, "°");
  syncSlider(ui.yaw, ui.yawOut, "°");
  syncSlider(ui.power, ui.powerOut, "");
  showBanner("🦍 GORILLA BANANA 3D", scen().sub, 2600);
  checkOrientation();
  frame();

  // PWA: service worker para instalar como app y jugar offline
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(() => { /* sin SW no pasa nada */ });
  }
})();
</script>
</body>
</html>
