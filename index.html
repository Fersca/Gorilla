  function updateLeaves(dt) {
    const show = state.wind !== 0 || state.windZ !== 0;
    leafGroup.visible = show;
    if (!show) return;
    for (const l of leaves) {
      l.m.position.x += state.wind * 2.4 * l.fac * dt;
      l.m.position.z += state.windZ * 2.4 * l.fac * dt;
      l.m.position.y = l.baseY + Math.sin(state.time * 1.7 + l.ph) * 1.2;
      l.m.rotation.x += dt * l.spin;
      l.m.rotation.y += dt * l.spin * 0.7;
      if (l.m.position.x > 80) l.m.position.x = -80;
      if (l.m.position.x < -80) l.m.position.x = 80;
      if (l.m.position.z > 30) l.m.position.z = -36;
      if (l.m.position.z < -36) l.m.position.z = 30;
    }
  }

  // flecha indicadora sobre el blanco
  const arrow = new THREE.Mesh(
    new THREE.ConeGeometry(1.1, 2.1, 4),
    new THREE.MeshBasicMaterial({ color: 0xffd54a, toneMapped: false })
  );
  arrow.rotation.x = Math.PI;
  scene.add(arrow);

  // ==================================================================
  // Estelas
  // ==================================================================
  const TRAIL_N = 320;
  function makeTrailLine(color, opacity) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(TRAIL_N * 3), 3));
    geo.setDrawRange(0, 0);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
      color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
    }));
    line.frustumCulled = false;
    scene.add(line);
    return line;
  }
  const trailLine = makeTrailLine(0xffd23e, 0.75);
  const lastTrailLine = makeTrailLine(0xbfa970, 0.16);
  let trailCount = 0;

  function pushTrail(x, y, z) {
    if (trailCount >= TRAIL_N) return;
    const arr = trailLine.geometry.attributes.position.array;
    arr[trailCount * 3] = x;
    arr[trailCount * 3 + 1] = y;
    arr[trailCount * 3 + 2] = z;
    trailCount++;
    trailLine.geometry.setDrawRange(0, trailCount);
    trailLine.geometry.attributes.position.needsUpdate = true;
  }
  function commitTrailToLast() {
    const src = trailLine.geometry.attributes.position.array;
    const dst = lastTrailLine.geometry.attributes.position.array;
    dst.set(src);
    lastTrailLine.geometry.setDrawRange(0, trailCount);
    lastTrailLine.geometry.attributes.position.needsUpdate = true;
    trailCount = 0;
    trailLine.geometry.setDrawRange(0, 0);
  }
  function clearTrails() {
    trailCount = 0;
    trailLine.geometry.setDrawRange(0, 0);
    lastTrailLine.geometry.setDrawRange(0, 0);
  }

  // ==================================================================
  // Puntería
  // ==================================================================
  const AIM_N = 13;
  const aimDots = [];
  for (let i = 0; i < AIM_N; i++) {
    const d = new THREE.Mesh(
      new THREE.SphereGeometry(0.34, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xfff2c0, transparent: true, opacity: 0.55 * (1 - i / AIM_N), toneMapped: false })
    );
    scene.add(d);
    aimDots.push(d);
  }
  function launchPoint(yaw) {
    const ho = scen().handOffset;
    return {
      x: state.thrower.x + ho.x * Math.cos(yaw),
      y: ho.y,
      z: state.thrower.z - ho.x * Math.sin(yaw),
    };
  }
  function updateAim() {
    const show = !state.banana && !state.celebrating;
    const angle = (+ui.angle.value) * Math.PI / 180;
    const yaw = (+ui.yaw.value) * Math.PI / 180;
    const v0 = (+ui.power.value) * CFG.powerToV;
    const p = launchPoint(yaw);
    let { x, y, z } = p;
    const h = Math.cos(angle) * v0;
    let vx = h * Math.cos(yaw), vz = -h * Math.sin(yaw), vy = Math.sin(angle) * v0;
    const step = 0.07;
    for (let i = 0; i < AIM_N; i++) {
      vx += state.wind * step;
      vz += state.windZ * step;
      vy -= CFG.gravity * step;
      x += vx * step;
      y += vy * step;
      z += vz * step;
      aimDots[i].visible = show;
      aimDots[i].position.set(x, y, z);
    }
  }

  // ==================================================================
  // Partículas
  // ==================================================================
  const P_N = 700;
  const pGeo = new THREE.BufferGeometry();
  const pPos = new Float32Array(P_N * 3);
  const pCol = new Float32Array(P_N * 3);
  pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
  pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3));
  const particles = [];
  for (let i = 0; i < P_N; i++) {
    particles.push({ active: false, vx: 0, vy: 0, vz: 0, t: 0, life: 1, r: 0, g: 0, b: 0 });
    pPos[i * 3 + 1] = -9999;
  }
  const pointsMesh = new THREE.Points(pGeo, new THREE.PointsMaterial({
    size: 0.85, vertexColors: true, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  pointsMesh.frustumCulled = false;
  scene.add(pointsMesh);

  function spawnParticles(x, y, z, colorList, n, speed = [8, 60], up = 0) {
    for (let k = 0; k < n; k++) {
      const i = particles.findIndex(p => !p.active);
      if (i < 0) return;
      const p = particles[i];
      const col = new THREE.Color(colorList[(Math.random() * colorList.length) | 0]);
      const a = Math.random() * Math.PI * 2;
      const sp = rand(speed[0], speed[1]);
      p.active = true;
      p.t = 0;
      p.life = rand(0.5, 1.4);
      p.vx = Math.cos(a) * sp;
      p.vy = Math.abs(Math.sin(a)) * sp * 0.8 + up;
      p.vz = rand(-sp * 0.5, sp * 0.5);
      p.r = col.r; p.g = col.g; p.b = col.b;
      pPos[i * 3] = x + rand(-0.5, 0.5);
      pPos[i * 3 + 1] = y + rand(-0.5, 0.5);
      pPos[i * 3 + 2] = z + rand(-0.5, 0.5);
    }
  }
  function updateParticles(dt) {
    let any = false;
    for (let i = 0; i < P_N; i++) {
      const p = particles[i];
      if (!p.active) continue;
      any = true;
      p.t += dt;
      if (p.t > p.life || pPos[i * 3 + 1] < -1) {
        p.active = false;
        pPos[i * 3 + 1] = -9999;
        continue;
      }
      p.vy -= CFG.gravity * 0.55 * dt;
      pPos[i * 3] += p.vx * dt;
      pPos[i * 3 + 1] += p.vy * dt;
      pPos[i * 3 + 2] += p.vz * dt;
      const f = 1 - p.t / p.life;
      pCol[i * 3] = p.r * f;
      pCol[i * 3 + 1] = p.g * f;
      pCol[i * 3 + 2] = p.b * f;
    }
    if (any) {
      pGeo.attributes.position.needsUpdate = true;
      pGeo.attributes.color.needsUpdate = true;
    }
  }

  // ==================================================================
  // Niveles y escenarios
  // ==================================================================
  function placeLevel() {
    const sc = scen();
    const k = state.basket;
    k.rimR = sc.rimR;

    // el lanzador retrocede a medida que sube el nivel
    const back = Math.min(12, (state.level - 1) * 2);

    if (sc.target === "basket") {
      // el blanco se mueve, el lanzador se aleja
      state.thrower.x = -34 - back;
      state.thrower.z = 0;
      k.rot = 0;
      k.x = rand(4, 44);
      const zAmp = Math.min(28, 2 + state.level * 4.5);
      k.z = rand(-zAmp, Math.min(zAmp, 16));
      const maxPed = Math.min(16, 3 + state.level * 2.5);
      k.pedestalH = state.level === 1 ? 0 : (Math.random() < 0.35 ? 0 : rand(4, maxPed));
      k.baseY = k.pedestalH;
      k.rimY = k.baseY + sc.cupH;
      const cupGroup = sc.targetMesh === "trash" ? trashGroup : basketGroup;
      cupGroup.position.set(k.x, k.baseY, k.z);
      const hasPed = k.pedestalH > 0;
      pedestal.visible = pedestalCap.visible = hasPed;
      if (hasPed) {
        pedestal.scale.y = k.pedestalH;
        pedestal.position.set(k.x, k.pedestalH / 2, k.z);
        pedestalCap.position.set(k.x, k.pedestalH - 0.25, k.z);
      }
    } else if (sc.target === "bullseye") {
      // el blanco se mueve, el lanzador se aleja
      state.thrower.x = -34 - back;
      state.thrower.z = 0;
      k.x = rand(4, 44);
      const zAmp = Math.min(26, 2 + state.level * 4.5);
      k.z = rand(-zAmp, Math.min(zAmp, 16));
      k.pedestalH = 0;
      k.baseY = 0;
      // inclinación base hacia la cámara + giro extra por nivel
      k.rot = 0.3 + (state.level === 1 ? 0
            : (Math.random() < 0.5 ? -1 : 1) * rand(0.12, Math.min(0.65, 0.08 + state.level * 0.09)));
      pedestal.visible = pedestalCap.visible = false;
      if (sc.targetMesh === "ring") {
        // el aro del salto: cada vez más alto y más girado
        k.cy = 6.5 + rand(0, Math.min(8, state.level * 1.1));
        k.rimY = k.cy + 3.5;           // flecha indicadora sobre el aro
        ringGroup.position.set(k.x, 0, k.z);
        ringGroup.rotation.y = k.rot;
        ringTorus.position.y = k.cy;
        ringTorus.userData.marks.position.y = k.cy;
        ringPole.scale.y = Math.max(0.5, k.cy - 2.9);
      } else {
        k.cy = BULL.cy;
        k.rimY = BULL.moundH;          // para la flecha indicadora
        bullseyeGroup.position.set(k.x, 0, k.z);
        bullseyeGroup.rotation.y = k.rot;
      }
    } else if (sc.target === "goal") {
      // fútbol: el arco es fijo pero se achica; el pateador se aleja
      // y aparece una barrera cada vez más larga
      k.x = 42; k.z = 0;
      k.rot = 0;
      k.pedestalH = 0;
      pedestal.visible = pedestalCap.visible = false;
      k.gw = Math.max(5.5, 11.5 - state.level * 0.8);   // medio ancho del arco
      k.gh = Math.max(6, 9.5 - state.level * 0.4);      // altura
      k.rimY = k.gh;                                    // para la flecha indicadora
      buildGoal(k.gw, k.gh);
      goalGroup.position.set(k.x, 0, k.z);
      // pateador
      const dist = Math.min(72, 22 + state.level * 6);
      const zAmp = Math.min(24, 3 + state.level * 4);
      state.thrower.z = rand(-zAmp, zAmp);
      state.thrower.x = Math.max(-42, k.x - rand(dist * 0.75, dist));
      // arquero: tapa una zona distinta del arco en cada nivel
      const gkScale = k.gh / 9.5;
      gkGroup.scale.setScalar(gkScale);
      state.gk.z = k.z + rand(-(k.gw - 2.2), k.gw - 2.2);
      state.gk.half = 1.9 * gkScale + 0.5;
      state.gk.h = 7.6 * gkScale;
      gkGroup.position.set(k.x - 1, 0, state.gk.z);
      // barrera desde el nivel 2, más larga con el nivel
      const w = state.wall;
      w.n = state.level < 2 ? 0 : Math.min(6, 1 + ((state.level / 2) | 0));
      if (w.n > 0) {
        w.x = Math.min(state.thrower.x + 13, k.x - 8);
        const t = (w.x - state.thrower.x) / (k.x - state.thrower.x);
        w.z = state.thrower.z + (k.z - state.thrower.z) * t;   // se paran en la línea del tiro
        w.half = w.n * 1.05;
        for (let i = 0; i < wallDummies.length; i++) {
          const d = wallDummies[i];
          d.visible = i < w.n;
          if (d.visible) {
            d.position.set(w.x, 0, w.z - w.half + 1.05 + i * 2.1);
            d.rotation.y = Math.PI / 2;   // miran al pateador
          }
        }
      } else {
        w.half = 0;
        wallDummies.forEach(d => d.visible = false);
      }
    } else {
      // básquet: el aro es fijo, se mueve el jugador por la cancha
      k.x = HOOP.x; k.z = HOOP.z;
      k.rot = 0;
      k.rimY = HOOP.rimY;
      k.baseY = HOOP.rimY;      // el aro no tiene "cuerpo" abajo
      k.pedestalH = 0;
      pedestal.visible = pedestalCap.visible = false;
      const dist = Math.min(78, 16 + state.level * 7);
      const zAmp = Math.min(26, 3 + state.level * 4.5);
      state.thrower.z = rand(-zAmp, zAmp);
      state.thrower.x = Math.max(-42, HOOP.x - rand(dist * 0.7, dist));
    }
    activeThrower().position.set(state.thrower.x, 0, state.thrower.z);
  }

  // ON = sopla siempre (se nota y se ven las hojas); OFF = tiro limpio.
  // El viento es un vector: empuja adelante/atrás (x) Y hacia los costados (z).
  function setWind() {
    if (!state.windEnabled) {
      state.wind = 0;
      state.windZ = 0;
      ui.windChip.style.display = "none";
      return;
    }
    // el viento crece con el nivel: más fuerte y con piso más alto
    const max = Math.min(8, 1 + state.level * 0.9);
    const minMag = Math.min(0.8 + state.level * 0.3, max * 0.7);
    const mag = rand(minMag, max);
    const dir = rand(0, Math.PI * 2);
    state.wind = Math.cos(dir) * mag;
    state.windZ = Math.sin(dir) * mag;
    ui.windChip.style.display = "flex";
    ui.windTxt.textContent = Math.round(mag * 10);
    // flecha de 8 rumbos en coordenadas de pantalla (+x derecha, -z arriba/fondo)
    const a = Math.atan2(-state.windZ, state.wind);
    const dirs = ["→", "↗", "↑", "↖", "←", "↙", "↓", "↘"];
    ui.windArrow.textContent = dirs[((Math.round(a / (Math.PI / 4)) % 8) + 8) % 8];
  }

  function newLevel(first = false) {
    const sc = scen();
    if (sc.randomEnv || !envGroup || envGroup.userData.scen !== state.scenKey) {
      makeEnv();
      envGroup.userData.scen = state.scenKey;
    }
    placeLevel();
    setWind();
    clearTrails();
    state.banana = null;
    bananaFly.visible = ballFly.visible = rockFly.visible = arrowFly.visible = soccerFly.visible = carFly.visible = false;
    handItem().visible = true;
    state.celebrating = false;
    ui.levelTxt.textContent = state.level;
    ui.throwBtn.disabled = false;
    if (!first) showBanner(`¡NIVEL ${state.level}!`, sc.moveMsg);
  }

  function applyScenario() {
    const sc = scen();
    scene.fog.color.setHex(sc.fog);
    if (sky.material.map) sky.material.map.dispose();
    sky.material.map = gradientTexture(sc.skyStops);
    sky.material.needsUpdate = true;
    ground.material.color.setHex(sc.groundColor);
    gorilla.visible = sc.thrower === "gorilla";
    player.visible = sc.thrower === "player";
    police.visible = sc.thrower === "police";
    archer.visible = sc.thrower === "archer";
    futbol.visible = sc.thrower === "futbol";
    carBase.visible = sc.thrower === "car";
    basketGroup.visible = sc.targetMesh === "wicker";
    trashGroup.visible = sc.targetMesh === "trash";
    hoopGroup.visible = sc.targetMesh === "hoop";
    bullseyeGroup.visible = sc.targetMesh === "bullseye";
    ringGroup.visible = sc.targetMesh === "ring";
    goalGroup.visible = gkGroup.visible = sc.targetMesh === "goal";
    if (sc.targetMesh !== "goal") wallDummies.forEach(d => d.visible = false);
    if (sc.pedestalColors) {
      pedestalMat.color.setHex(sc.pedestalColors[0]);
      pedestalCapMat.color.setHex(sc.pedestalColors[1]);
    }
    bananaHand.visible = sc.projectile === "banana";
    ballHand.visible = sc.projectile === "ball";
    rockHand.visible = sc.projectile === "rock";
    arrowHand.visible = sc.projectile === "arrow";
    carRest.visible = sc.projectile === "car";
    ui.throwBtn.textContent = sc.throwLabel;
    ui.scenBtn.textContent = `${sc.emoji} ${sc.name}`;
  }

  function switchScenario(key) {
    if (state.banana) return;   // no cambiar en pleno vuelo
    const target = key && SCENARIOS[key] ? key : scen().next;
    if (target === state.scenKey) return;
    state.scenKey = target;
    state.level = 1;
    state.tries = 0;
    ui.triesTxt.textContent = "0";
    state.gorillaYaw = 0;
    applyScenario();
    newLevel(true);
    ui.levelTxt.textContent = "1";
    showBanner(`${scen().emoji} ${scen().name.toUpperCase()}`, scen().sub, 2200);
  }

  function showBanner(title, sub, ms = 1900) {
    ui.bannerTitle.textContent = title;
    ui.bannerSub.textContent = sub;
    ui.banner.classList.add("show");
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(() => ui.banner.classList.remove("show"), ms);
  }

  // ==================================================================
  // Lanzamiento y física
  // ==================================================================
  function throwBanana() {
    if (state.banana || state.celebrating) return;
    const angle = (+ui.angle.value) * Math.PI / 180;
    const yaw = (+ui.yaw.value) * Math.PI / 180;
    const v0 = (+ui.power.value) * CFG.powerToV;
    const p = launchPoint(yaw);
    const h = Math.cos(angle) * v0;
    state.banana = {
      x: p.x, y: p.y, z: p.z,
      px: p.x, py: p.y, pz: p.z,
      vx: h * Math.cos(yaw),
      vz: -h * Math.sin(yaw),
      vy: Math.sin(angle) * v0,
    };
    state.tries++;
    ui.triesTxt.textContent = state.tries;
    rec(state.scenKey).throws++;
    saveRecords();
    ui.throwBtn.disabled = true;
    state.armUp = 1;
    handItem().visible = false;
    flyItem().visible = true;
    if (scen().projectile === "car") {
      // polvo de la aceleración en la base de la rampa
      spawnParticles(state.thrower.x, 1, state.thrower.z, [0x9a7a4a, 0x6b4e26], 22, [4, 18], 5);
    }
    sndThrow(scen().projectile);
  }

  function endThrow(hit) {
    commitTrailToLast();
    state.banana = null;
    bananaFly.visible = ballFly.visible = rockFly.visible = arrowFly.visible = soccerFly.visible = carFly.visible = false;
    if (hit) {
      state.celebrating = true;
      const r = rec(state.scenKey);
      r.hits++;
      const isRecord = state.level > r.best;
      if (isRecord) r.best = state.level;
      saveRecords();
      sndScore(scen().targetMesh);
      const k = state.basket;
      spawnParticles(k.x, k.rimY + 1, k.z, [0xffd54a, 0xff9d2e, 0x7cf29c, 0x7cc4ff, 0xff7ce0, 0xffffff], 130, [15, 55], 20);
      const hitTitle = scen().target === "hoop" ? "🏀 ¡ENCESTASTE!"
                     : scen().targetMesh === "ring" ? "🚗 ¡SALTO PERFECTO!"
                     : scen().target === "bullseye" ? "🏹 ¡EN EL BLANCO!"
                     : scen().target === "goal" ? "⚽ ¡GOOOOL!"
                     : "🎯 ¡EMBOCASTE!";
      showBanner(hitTitle, isRecord ? `Nivel ${state.level} superado · 🏆 ¡récord nuevo!` : `Nivel ${state.level} superado`, 1600);
      setTimeout(() => { state.level++; newLevel(); }, 1900);
    } else {
      sndMiss();
      handItem().visible = true;
      ui.throwBtn.disabled = false;
    }
  }

  // integración con subpasos fijos: la trayectoria es idéntica a cualquier framerate
  const PHYS_H = 1 / 120;
  function updateBanana(dt) {
    if (!state.banana) return;
    let remaining = dt;
    while (remaining > 1e-6 && state.banana) {
      stepBanana(Math.min(PHYS_H, remaining));
      remaining -= PHYS_H;
    }
    const b = state.banana;
    if (!b) return;
    pushTrail(b.x, b.y, b.z);
    const item = flyItem();
    item.position.set(b.x, b.y, b.z);
    item.rotation.y = Math.atan2(-b.vz, b.vx);
    const pj = scen().projectile;
    if (pj === "arrow" || pj === "car") {
      // flecha y auto no giran: la trompa sigue la dirección del vuelo
      item.rotation.z = Math.atan2(b.vy, Math.hypot(b.vx, b.vz));
    } else {
      item.rotation.z -= dt * 9;
    }
  }

  function stepBanana(dt) {
    const b = state.banana;
    b.px = b.x; b.py = b.y; b.pz = b.z;
    b.vx += state.wind * dt;
    b.vz += state.windZ * dt;
    b.vy -= CFG.gravity * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.z += b.vz * dt;

    const sc = scen();
    const k = state.basket;
    const dh = Math.hypot(b.x - k.x, b.z - k.z);

    // fútbol: barrera, arquero y plano del arco
    if (sc.target === "goal") {
      const w = state.wall;
      // barrera
      if (w.n > 0 && b.px <= w.x && b.x > w.x) {
        const f = (w.x - b.px) / (b.x - b.px);
        const cy = b.py + (b.y - b.py) * f;
        const cz = b.pz + (b.z - b.pz) * f;
        if (cy < 7.4 && Math.abs(cz - w.z) < w.half + 0.5) {
          spawnParticles(w.x, cy, cz, [0xe04b3a, 0xffd0a8], 16, [5, 22], 6);
          state.shake = 1.2;
          endThrow(false);
          return;
        }
      }
      // línea de gol
      if (b.px <= k.x && b.x > k.x) {
        const f = (k.x - b.px) / (b.x - b.px);
        const cy = b.py + (b.y - b.py) * f;
        const cz = b.pz + (b.z - b.pz) * f;
        // ataja el arquero
        if (cy < state.gk.h && Math.abs(cz - state.gk.z) < state.gk.half) {
          spawnParticles(k.x - 1, cy, cz, [0xff9d2e, 0xf2f2f2], 20, [6, 26], 8);
          state.shake = 1.3;
          endThrow(false);
          return;
        }
        // adentro del arco: ¡gol!
        if (cy < k.gh - 0.5 && Math.abs(cz - k.z) < k.gw - 0.5) {
          spawnParticles(k.x, cy, cz, [0xf2f6ff, 0x7cc4ff], 30, [6, 25], 10);
          endThrow(true);
          return;
        }
        // poste o travesaño
        if (cy < k.gh + 0.6 && Math.abs(cz - k.z) < k.gw + 0.6) {
          spawnParticles(k.x, cy, cz, [0xf2f6ff, 0x9aa8c0], 14, [5, 22], 6);
          state.shake = 1.2;
          endThrow(false);
          return;
        }
      }
      if (b.y < 0.45) {
        spawnParticles(b.x, 0.4, b.z, [0x3f7a35, 0x2a5e2a], 16, [5, 22], 7);
        state.shake = 1;
        endThrow(false);
        return;
      }
      if (Math.abs(b.x) > CFG.boundsX || Math.abs(b.z) > CFG.boundsX) endThrow(false);
      return;
    }

    // blanco de arquería: plano vertical que puede estar girado (k.rot)
    if (sc.target === "bullseye") {
      const c = Math.cos(k.rot || 0), s = Math.sin(k.rot || 0);
      // coordenadas locales del blanco (x' = normal del disco, hacia el arquero es x'<0)
      const lx = c * (b.x - k.x) - s * (b.z - k.z);
      const lpx = c * (b.px - k.x) - s * (b.pz - k.z);
      if (lpx <= 0 && lx > 0) {
        const lz = s * (b.x - k.x) + c * (b.z - k.z);
        const lpz = s * (b.px - k.x) + c * (b.pz - k.z);
        const f = -lpx / (lx - lpx);
        const cy = b.py + (b.y - b.py) * f;
        const clz = lpz + (lz - lpz) * f;
        const dr = Math.hypot(cy - k.cy, clz);
        // punto de cruce en coordenadas de mundo
        const wx = k.x + s * clz, wz = k.z + c * clz;
        if (dr < k.rimR) {
          spawnParticles(wx, cy, wz, [0xffd54a, 0xfff2c0], 26, [5, 20], 8);
          endThrow(true);
          if (sc.projectile === "arrow") {
            // la flecha queda clavada en el blanco durante el festejo
            arrowFly.visible = true;
            arrowFly.position.set(k.x - 3.4 * c + s * clz, cy, k.z + 3.4 * s + c * clz);
            arrowFly.rotation.set(0, k.rot || 0, 0);
          }
          return;
        }
        if (sc.targetMesh === "ring") {
          // golpe contra el borde del aro
          if (dr < k.rimR + 1.2) {
            spawnParticles(wx, cy, wz, [0xff9d5e, 0xf2f6ff], 16, [5, 24], 6);
            state.shake = 1.3;
            endThrow(false);
            return;
          }
        } else {
          const inMound = cy >= 0 && Math.pow(cy / BULL.moundH, 2) + Math.pow(clz / BULL.moundR, 2) < 1;
          if (inMound) {
            spawnParticles(wx, cy, wz, [0xd8b84a, 0xb89a3a], 18, [5, 22], 6);
            state.shake = 1.1;
            endThrow(false);
            return;
          }
        }
      }
      if (b.y < 0.45) {
        spawnParticles(b.x, 0.4, b.z, [0x9a8360, 0x6d5c40], 18, [5, 24], 8);
        state.shake = 1.1;
        endThrow(false);
        return;
      }
      if (Math.abs(b.x) > CFG.boundsX || Math.abs(b.z) > CFG.boundsX) endThrow(false);
      return;
    }

    // cruce del plano del aro (interpolado entre frames: robusto ante dt grande)
    if (b.vy < 0 && b.py >= k.rimY && b.y < k.rimY) {
      const f = (b.py - k.rimY) / (b.py - b.y);
      const cx = b.px + (b.x - b.px) * f;
      const cz = b.pz + (b.z - b.pz) * f;
      const dhc = Math.hypot(cx - k.x, cz - k.z);
      if (dhc < k.rimR * 0.78) {
        spawnParticles(k.x, k.rimY, k.z, [0xffd54a, 0xfff2c0], 30, [6, 25], 10);
        endThrow(true);
        return;
      }
      // pegó en el borde/hierro al cruzar
      const edgeR = sc.target === "hoop" ? k.rimR * 1.35 : k.rimR * 1.15;
      if (dhc < edgeR) {
        spawnParticles(cx, k.rimY, cz, sc.target === "hoop" ? [0xff9d5e, 0xffd0a8] : [0xc9d4ff, 0x8892b8], 14, [5, 22], 6);
        state.shake = 1.2;
        endThrow(false);
        return;
      }
    }

    if (sc.target === "basket") {
      // golpe al cuerpo del canasto
      if (b.y < k.rimY && b.y > k.baseY - 0.3 && dh < k.rimR * 1.15) {
        spawnParticles(b.x, b.y, b.z, [0xc9d4ff, 0x8892b8], 16, [5, 22], 6);
        state.shake = 1.4;
        endThrow(false);
        return;
      }
      // golpe al pedestal
      if (k.pedestalH > 0 && b.y < k.baseY && b.y > 0 && dh < 2.7) {
        spawnParticles(b.x, b.y, b.z, [0xb0a0c8, 0x8892b8], 14, [5, 20], 5);
        state.shake = 1.2;
        endThrow(false);
        return;
      }
    } else {
      // tablero
      const boardX = k.x + HOOP.boardDX;
      if (b.x > boardX - 0.4 && b.x < boardX + 0.8 && Math.abs(b.z - k.z) < 3.9 && b.y > 10.9 && b.y < 16.6) {
        spawnParticles(boardX, b.y, b.z, [0xdfe8f2, 0x9aa8c0], 14, [5, 22], 4);
        state.shake = 1.2;
        endThrow(false);
        return;
      }
      // poste
      if (b.y < 14 && Math.hypot(b.x - (k.x + 4.6), b.z - k.z) < 1) {
        spawnParticles(b.x, b.y, b.z, [0x9aa8c0], 10, [5, 18], 4);
        endThrow(false);
        return;
      }
    }

    // piso
    if (b.y < 0.45) {
      spawnParticles(b.x, 0.4, b.z, [0x9a8360, 0x6d5c40], 18, [5, 24], 8);
      state.shake = 1.1;
      endThrow(false);
      return;
    }
    // fuera de límites
    if (Math.abs(b.x) > CFG.boundsX || Math.abs(b.z) > CFG.boundsX) endThrow(false);
  }

  // ==================================================================
  // Bucle principal
  // ==================================================================
  const clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(0.033, clock.getDelta());
    state.time += dt;

    updateBanana(dt);
    updateParticles(dt);
    updateLeaves(dt);
    updateClouds(dt);
    updateShootingStar(dt);
    updateAim();

    // animaciones
    if (state.armUp > 0 && !state.banana) state.armUp = Math.max(0, state.armUp - dt * 3);
    gorillaArm.rotation.z = lerp(0.5, 2.55, state.armUp);
    playerArm.rotation.z = lerp(0.45, 2.6, state.armUp);
    policeArm.rotation.z = lerp(0.45, 2.6, state.armUp);
    archerArm.rotation.z = lerp(0.45, 2.6, state.armUp);
    futbolLeg.rotation.z = lerp(0, 1.5, state.armUp);   // patada
    // la rampa se inclina en vivo con el slider de ángulo
    carRamp.rotation.z = (+ui.angle.value) * Math.PI / 180 * 0.55;
    const k = state.basket;
    const arrowBaseY = scen().target === "hoop" ? k.rimY + 4.6 : k.rimY + 3.2;
    arrow.position.set(k.x, arrowBaseY + Math.sin(state.time * 3) * 0.7, k.z);
    arrow.rotation.y = state.time * 1.2;
    const thrower = activeThrower();
    thrower.position.y = state.celebrating ? Math.abs(Math.sin(state.time * 9)) * 1.3 : 0;
    starMat.opacity = 0.7 + 0.25 * Math.sin(state.time * 1.7);
    if (envGroup) {
      const ff = envGroup.getObjectByName("fireflies");
      if (ff) ff.material.opacity = 0.55 + 0.4 * Math.sin(state.time * 2.3);
      // balizas rojas de las antenas
      const bl = envGroup.userData.blinkers;
      if (bl) for (let i = 0; i < bl.length; i++) bl[i].visible = Math.sin(state.time * 2.4 + i * 1.9) > -0.15;
      // fuego de la fogata
      const fl = envGroup.userData.fireLight;
      if (fl) fl.intensity = 0.8 + 0.35 * Math.sin(state.time * 9) + Math.random() * 0.25;
      const fc = envGroup.userData.fireCone;
      if (fc) {
        const s = 0.9 + 0.16 * Math.sin(state.time * 11) + 0.06 * Math.random();
        fc.scale.set(s, 1 + 0.22 * Math.random(), s);
      }
      // mariposas de la selva
      const bfs = envGroup.userData.butterflies;
      if (bfs) for (const { bf, ph, bx, by, bz } of bfs) {
        bf.position.set(
          bx + Math.sin(state.time * 0.6 + ph) * 5,
          by + Math.sin(state.time * 1.4 + ph * 2) * 1.6,
          bz + Math.cos(state.time * 0.45 + ph) * 3.5
        );
        bf.rotation.y = state.time * 0.6 + ph;
        const flap = Math.sin(state.time * 14 + ph) * 0.75;
        bf.userData.w1.rotation.y = flap;
        bf.userData.w2.rotation.y = -flap;
      }
      // humo de chimeneas
      const smoke = envGroup.userData.smoke;
      if (smoke) for (const { s, spot, off } of smoke) {
        const t01 = (state.time * 0.16 + off) % 1;
        s.position.set(spot.x + Math.sin((state.time + off * 9) * 0.8) * 0.6, spot.y + t01 * 7, spot.z);
        const sc2 = 1.2 + t01 * 3.2;
        s.scale.set(sc2, sc2, 1);
        s.material.opacity = Math.sin(t01 * Math.PI) * 0.4;
      }
      // flashes de cámaras en la tribuna
      const fls = envGroup.userData.flashes;
      const pts = envGroup.userData.crowdPts;
      if (fls && pts && pts.length) {
        for (const f of fls) {
          if (f.life > 0) {
            f.life = Math.max(0, f.life - dt * 3.5);
            f.s.material.opacity = f.life;
          } else if (Math.random() < 0.012) {
            const idx = (Math.random() * (pts.length / 3) | 0) * 3;
            f.s.position.set(pts[idx], pts[idx + 1] + 0.5, pts[idx + 2]);
            f.life = 1;
          }
        }
      }
      // helicóptero patrullando la ciudad
      const heli = envGroup.userData.heli;
      if (heli) {
        const a = state.time * 0.09;
        heli.g.position.set(Math.cos(a) * 85, 52 + Math.sin(state.time * 0.5) * 3, -60 + Math.sin(a) * 45);
        heli.g.rotation.y = -a;
        heli.rotor.rotation.y += dt * 28;
        heli.light.visible = Math.sin(state.time * 6) > 0;
      }
      // cascada
      const wt = envGroup.userData.waterTex;
      if (wt) wt.offset.y -= dt * 0.9;
      // bruma
      const mists = envGroup.userData.mists;
      if (mists) for (const { m, v } of mists) {
        m.position.x += v * dt;
        if (m.position.x > 110) m.position.x = -110;
      }
      // bandada de pájaros
      const birds = envGroup.userData.birds;
      if (birds) for (const { bird, ph, r, cy } of birds) {
        const a = state.time * 0.25 + ph;
        bird.position.set(Math.cos(a) * r, cy + Math.sin(state.time * 1.1 + ph) * 2, -55 + Math.sin(a) * r * 0.6);
        bird.rotation.y = -a + Math.PI / 2;
        const flap = Math.sin(state.time * 9 + ph) * 0.55;
        bird.userData.wl.rotation.y = flap;
        bird.userData.wr.rotation.y = -flap;
      }
      // marcador en vivo del estadio
      const sb = envGroup.userData.sb;
      if (sb) {
        const txt = `NIVEL ${state.level}  ·  TIROS ${state.tries}`;
        if (txt !== sb.last) {
          sb.last = txt;
          const sg = sb.g;
          sg.fillStyle = "#10141c"; sg.fillRect(0, 0, 512, 160);
          sg.strokeStyle = "#ffd54a"; sg.lineWidth = 8; sg.strokeRect(8, 8, 496, 144);
          sg.fillStyle = "#ffd54a";
          sg.font = "bold 52px sans-serif";
          sg.textAlign = "center";
          sg.fillText("APUNTO Y TIRO", 256, 70);
          sg.fillStyle = "#f2f2f2";
          sg.font = "bold 38px sans-serif";
          sg.fillText(txt, 256, 126);
          sb.tex.needsUpdate = true;
        }
      }
      // banderas flameando
      const flags = envGroup.userData.flags;
      if (flags) flags.forEach((f, i) => { f.rotation.y = Math.sin(state.time * 1.8 + i * 2) * 0.45; });
      // aspas del molino
      const mill = envGroup.userData.mill;
      if (mill) mill.rotation.z += dt * 0.5;
      // rodadoras del desierto
      const tws = envGroup.userData.tumbleweeds;
      if (tws) for (const { m, fac } of tws) {
        const push = (state.wind || 1.4) * 2.2 * fac;
        m.position.x += push * dt;
        m.rotation.z -= push * dt * 0.9;
        if (m.position.x > 110) m.position.x = -110;
        if (m.position.x < -110) m.position.x = 110;
      }
    }

    // el lanzador rota suavemente hacia el giro elegido
    const targetYaw = (+ui.yaw.value) * Math.PI / 180;
    state.gorillaYaw += (targetYaw - state.gorillaYaw) * Math.min(1, dt * 10);
    thrower.rotation.y = state.gorillaYaw;

    // cámara orbital + shake al fallar
    controls.update();
    if (state.shake > 0) {
      state.shake = Math.max(0, state.shake - dt * 4);
      camera.position.x += rand(-state.shake, state.shake) * 0.3;
      camera.position.y += rand(-state.shake, state.shake) * 0.3;
    }

    renderer.render(scene, camera);
  }

  // ==================================================================
  // Controles
  // ==================================================================
  function syncSlider(input, out, suffix) {
    const pct = (input.value - input.min) / (input.max - input.min) * 100;
    input.style.setProperty("--fill", pct + "%");
    out.textContent = input.value + suffix;
  }
  ui.angle.addEventListener("input", () => syncSlider(ui.angle, ui.angleOut, "°"));
  ui.yaw.addEventListener("input", () => syncSlider(ui.yaw, ui.yawOut, "°"));
  ui.power.addEventListener("input", () => syncSlider(ui.power, ui.powerOut, ""));
  ui.throwBtn.addEventListener("click", throwBanana);
  ui.viewBtn.addEventListener("click", resetView);
  // selector de escenarios: lista para elegir directo
  const scenOverlay = document.getElementById("scenOverlay");
  const scenList = document.getElementById("scenList");
  ui.scenBtn.addEventListener("click", () => {
    scenList.innerHTML = "";
    for (const key of Object.keys(SCENARIOS)) {
      const sc = SCENARIOS[key];
      const btn = document.createElement("button");
      btn.dataset.scen = key;
      btn.textContent = `${sc.emoji}  ${sc.name}`;
      if (key === state.scenKey) btn.classList.add("current");
      btn.addEventListener("click", () => {
        scenOverlay.classList.remove("show");
        switchScenario(key);
      });
      scenList.appendChild(btn);
    }
    scenOverlay.classList.add("show");
  });
  scenOverlay.addEventListener("click", (e) => {
    if (e.target === scenOverlay) scenOverlay.classList.remove("show");
  });
  ui.windBtn.addEventListener("click", () => {
    state.windEnabled = !state.windEnabled;
    ui.windBtn.textContent = state.windEnabled ? "💨 ON" : "💨 OFF";
    setWind();
  });

  // ------------------------------------------------ ranking
  function showRanking() {
    const rows = Object.keys(SCENARIOS).map(key => {
      const sc = SCENARIOS[key], r = rec(key);
      const pct = r.throws ? Math.round(r.hits / r.throws * 100) : 0;
      return { sc, r, pct };
    }).sort((a, b) => b.r.best - a.r.best);
    ui.rankTable.innerHTML =
      "<tr><th>Escenario</th><th>Mejor nivel</th><th>Emboques</th><th>Intentos</th><th>Efect.</th></tr>" +
      rows.map(({ sc, r, pct }) =>
        `<tr><td>${sc.emoji} ${sc.name}</td><td><b>${r.best || "—"}</b></td><td>${r.hits}</td><td>${r.throws}</td><td>${r.throws ? pct + "%" : "—"}</td></tr>`
      ).join("");
    ui.rankOverlay.classList.add("show");
  }
  ui.rankBtn.addEventListener("click", showRanking);
  ui.rankOverlay.addEventListener("click", () => ui.rankOverlay.classList.remove("show"));

  // ------------------------------------------------ pantalla completa
  const fsEl = document.documentElement;
  const fsSupported = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
  if (!fsSupported) ui.fsBtn.style.display = "none";
  function updateFsBtn() {
    const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    ui.fsBtn.textContent = on ? "⛶ Salir" : "⛶ Pantalla";
  }
  ui.fsBtn.addEventListener("click", () => {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        const r = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl, { navigationUI: "hide" });
        if (r && r.catch) r.catch(() => {});
      }
    } catch (e) { /* algunos navegadores lo bloquean */ }
    setTimeout(updateFsBtn, 350);   // por si el evento no llega
  });
  document.addEventListener("fullscreenchange", () => { updateFsBtn(); onResize(); });
  document.addEventListener("webkitfullscreenchange", () => { updateFsBtn(); onResize(); });

  // ------------------------------------------------ instalar como app
  // Chrome/Android exponen el prompt nativo; en el resto mostramos
  // las instrucciones del navegador correspondiente.
  let installPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    installPrompt = e;
  });
  const isStandalone = navigator.standalone === true
    || window.matchMedia("(display-mode: standalone)").matches
    || window.matchMedia("(display-mode: fullscreen)").matches;
  if (isStandalone) ui.installBtn.style.display = "none";   // ya está instalada
  window.addEventListener("appinstalled", () => { ui.installBtn.style.display = "none"; });
  ui.installBtn.addEventListener("click", async () => {
    if (installPrompt) {
      installPrompt.prompt();
      try { await installPrompt.userChoice; } catch (e) {}
      installPrompt = null;
      return;
    }
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    ui.installMsg.innerHTML = isIOS
      ? "En iPhone/iPad: tocá el botón <b>Compartir</b> de Safari (el cuadradito con la flecha ↑) y elegí <b>“Agregar a pantalla de inicio”</b>. Te queda el ícono del gorila 🦍 y abre en pantalla completa."
      : "Abrí el menú <b>⋮</b> (o <b>≡</b>) de tu navegador y elegí <b>“Instalar app”</b> o <b>“Agregar a pantalla principal”</b>. Te queda el ícono del gorila 🦍 y abre en pantalla completa.";
    ui.installOverlay.classList.add("show");
  });
  ui.installOverlay.addEventListener("click", () => ui.installOverlay.classList.remove("show"));

  // ------------------------------------------------ botones −/+ de cada slider
  const SLIDER_META = {
    angle: [ui.angle, ui.angleOut, "°"],
    yaw: [ui.yaw, ui.yawOut, "°"],
    power: [ui.power, ui.powerOut, ""],
  };
  function bumpSlider(name, delta) {
    const [input, out, suffix] = SLIDER_META[name];
    input.value = Math.min(+input.max, Math.max(+input.min, +input.value + delta));
    syncSlider(input, out, suffix);
  }
  document.querySelectorAll(".stepBtn").forEach((btn) => {
    const t = btn.dataset.t, d = +btn.dataset.d;
    let holdTO = null, holdIV = null;
    const stop = () => { clearTimeout(holdTO); clearInterval(holdIV); holdTO = holdIV = null; };
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      bumpSlider(t, d);
      // mantener apretado repite
      holdTO = setTimeout(() => { holdIV = setInterval(() => bumpSlider(t, d), 100); }, 380);
    });
    btn.addEventListener("pointerup", stop);
    btn.addEventListener("pointercancel", stop);
    btn.addEventListener("pointerleave", stop);
  });

  window.addEventListener("keydown", (e) => {
    const bump = (input, delta, out, suffix) => {
      input.value = Math.min(+input.max, Math.max(+input.min, +input.value + delta));
      syncSlider(input, out, suffix);
    };
    switch (e.key) {
      case "ArrowUp":    bump(ui.angle,  1, ui.angleOut, "°"); e.preventDefault(); break;
      case "ArrowDown":  bump(ui.angle, -1, ui.angleOut, "°"); e.preventDefault(); break;
      case "ArrowRight": bump(ui.power,  1, ui.powerOut, "");  e.preventDefault(); break;
      case "ArrowLeft":  bump(ui.power, -1, ui.powerOut, "");  e.preventDefault(); break;
      case "q": case "Q": bump(ui.yaw,  1, ui.yawOut, "°"); e.preventDefault(); break;
      case "e": case "E": bump(ui.yaw, -1, ui.yawOut, "°"); e.preventDefault(); break;
      case " ":          throwBanana(); e.preventDefault(); break;
    }
  });

  function checkOrientation() {
    const portrait = window.innerHeight > window.innerWidth * 1.2;
    const touch = "ontouchstart" in window;
    if (portrait && touch && !checkOrientation._shown) {
      checkOrientation._shown = true;
      ui.rotateHint.classList.add("show");
      setTimeout(() => ui.rotateHint.classList.remove("show"), 3500);
    }
  }

  // ==================================================================
  // Arranque
  // ==================================================================
  window.__game = { state, CFG, SCENARIOS, HOOP, camera, controls, switchScenario, newLevel };
  onResize();
  resetView();
  applyScenario();
  newLevel(true);
  syncSlider(ui.angle, ui.angleOut, "°");
  syncSlider(ui.yaw, ui.yawOut, "°");
  syncSlider(ui.power, ui.powerOut, "");
  showBanner("🎯 APUNTO Y TIRO", scen().sub, 2600);
  checkOrientation();
  frame();

  // PWA: service worker para instalar como app y jugar offline
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(() => { /* sin SW no pasa nada */ });
  }
})();
</script>
</body>
