<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Apunto y Tiro">
<title>🎯 Apunto y Tiro — homenaje a GORILLA.BAS</title>
<style>
  :root {
    --panel-bg: rgba(13, 17, 36, 0.66);
    --panel-border: rgba(255, 255, 255, 0.14);
    --accent: #ffd54a;
    --accent-2: #ff9d2e;
    --text: #eef2ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #0b0f24;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  /* viñeta sutil para darle profundidad cinematográfica */
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background: radial-gradient(ellipse at center, transparent 58%, rgba(2, 4, 14, .38) 100%);
  }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    display: flex;
    justify-content: space-between;
    gap: 8px;
    pointer-events: none;
    z-index: 5;
  }
  .hudGroup { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .3px;
    display: flex;
    align-items: center;
    gap: 7px;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
    white-space: nowrap;
  }
  .chip b { color: var(--accent); font-size: 15px; }
  button.chip {
    pointer-events: auto;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    touch-action: manipulation;
  }
  button.chip:active { transform: scale(.94); }
  #windArrow { display: inline-block; font-size: 14px; }

  /* ---------- banner de nivel ---------- */
  #banner {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .35s;
    z-index: 6;
    text-align: center;
    padding: 0 16px;
  }
  #banner.show { opacity: 1; }
  #banner h1 {
    font-size: clamp(30px, 9vw, 72px);
    font-weight: 800;
    background: linear-gradient(180deg, #fff, var(--accent) 55%, var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 6px 22px rgba(255, 170, 40, .45));
    transform: scale(.85);
    transition: transform .35s cubic-bezier(.2, 1.6, .4, 1);
  }
  #banner.show h1 { transform: scale(1); }
  #banner p { font-size: clamp(13px, 3.5vw, 17px); opacity: .9; font-weight: 600; text-shadow: 0 2px 8px rgba(0,0,0,.8); }

  /* ---------- ranking ---------- */
  #scenCard { min-width: 260px; }
  #scenList { display: flex; flex-direction: column; gap: 8px; }
  #scenList button {
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 12px;
    padding: 11px 18px;
    text-align: left;
    cursor: pointer;
    touch-action: manipulation;
  }
  #scenList button:active { transform: scale(.97); }
  #scenList button.current {
    background: rgba(255,213,74,.18);
    border-color: rgba(255,213,74,.5);
    color: var(--accent);
  }
  #rankOverlay, #installOverlay, #scenOverlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 8;
    background: rgba(5, 8, 20, .55);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }
  #rankOverlay.show, #installOverlay.show, #scenOverlay.show { display: flex; }
  #installCard p { font-size: 14px; line-height: 1.55; max-width: 300px; }
  #installCard b { color: var(--accent); }
  #installCard, #rankCard, #scenCard {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 20px 26px;
    min-width: 300px;
    max-width: 92vw;
    box-shadow: 0 24px 70px rgba(0,0,0,.6);
  }
  #rankCard h2, #installCard h2, #scenCard h2 { font-size: 20px; margin-bottom: 14px; color: var(--accent); text-align: center; }
  #rankCard table { width: 100%; border-collapse: collapse; font-size: 14px; }
  #rankCard th, #rankCard td { padding: 7px 10px; text-align: right; white-space: nowrap; }
  #rankCard th:first-child, #rankCard td:first-child { text-align: left; }
  #rankCard th { opacity: .6; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
  #rankCard tr + tr td { border-top: 1px solid rgba(255,255,255,.08); }
  #rankCard td b { color: var(--accent); }
  .rankHint { margin-top: 12px; font-size: 11px; opacity: .5; text-align: center; }

  /* ---------- hint de rotación ---------- */
  #rotateHint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
    z-index: 7;
    pointer-events: none;
    opacity: 0;
    transition: opacity .5s;
  }
  #rotateHint.show { opacity: 1; }

  /* ---------- controles ---------- */
  #controls {
    position: fixed;
    left: max(12px, env(safe-area-inset-left));
    right: max(12px, env(safe-area-inset-right));
    bottom: calc(10px + env(safe-area-inset-bottom));
    z-index: 5;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    align-items: center;
    gap: 10px 18px;
    background: var(--panel-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 12px 16px;
    box-shadow: 0 14px 40px rgba(0,0,0,.5);
    max-width: 1100px;
    margin: 0 auto;
  }
  .ctl { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .ctlTop { display: flex; justify-content: space-between; align-items: baseline; }
  .ctlRow { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .ctl label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    opacity: .75;
    white-space: nowrap;
  }
  .stepBtn {
    flex: none;
    width: 36px;
    height: 36px;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 10px;
    background: rgba(255,255,255,.1);
    color: var(--text);
    font-size: 22px;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .stepBtn:active { background: rgba(255,213,74,.35); transform: scale(.92); }
  .ctl output {
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: 16px;
    color: var(--accent);
    text-align: right;
  }
  input[type="range"] {
    flex: 1;
    min-width: 0;
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent) var(--fill, 50%), rgba(255,255,255,.15) var(--fill, 50%));
    outline: none;
    cursor: pointer;
    touch-action: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--accent) 60%, var(--accent-2));
    box-shadow: 0 3px 10px rgba(0,0,0,.5), 0 0 0 3px rgba(255,213,74,.25);
  }
  input[type="range"]::-moz-range-thumb {
    width: 26px; height: 26px; border: none;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--accent) 60%, var(--accent-2));
    box-shadow: 0 3px 10px rgba(0,0,0,.5), 0 0 0 3px rgba(255,213,74,.25);
  }
  #throwBtn {
    font: inherit;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: .6px;
    padding: 13px 30px;
    border: none;
    border-radius: 14px;
    color: #2b1a00;
    background: linear-gradient(180deg, #ffe27a, var(--accent) 45%, var(--accent-2));
    box-shadow: 0 8px 22px rgba(255, 160, 30, .38), 0 1px 0 rgba(255,255,255,.6) inset;
    cursor: pointer;
    transition: transform .12s, filter .12s;
    touch-action: manipulation;
  }
  #throwBtn:active:not(:disabled) { transform: scale(.96); }
  #throwBtn:disabled { filter: grayscale(.7) brightness(.65); }

  /* móvil: panel compacto — cada control en una línea y el botón como
     columna a la derecha (no suma altura) */
  @media (max-width: 640px) {
    #controls {
      grid-template-columns: 1fr auto;
      gap: 4px 10px;
      padding: 8px 10px;
    }
    .ctl { flex-direction: row; align-items: center; gap: 8px; }
    .ctlTop {
      flex: none;
      width: 52px;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
    }
    .ctl label { font-size: 9px; letter-spacing: .7px; }
    .ctl output { font-size: 13px; }
    .ctlRow { flex: 1; gap: 6px; }
    .stepBtn { width: 28px; height: 28px; font-size: 17px; border-radius: 8px; }
    input[type="range"] { height: 6px; }
    input[type="range"]::-webkit-slider-thumb { width: 20px; height: 20px; }
    input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; }
    #throwBtn {
      grid-column: 2;
      grid-row: 1 / 4;
      height: 100%;
      padding: 0 13px;
      font-size: 14px;
      border-radius: 12px;
    }
    .chip { font-size: 12px; padding: 6px 10px; }
  }
  /* pantallas bajas y anchas (celu apaisado): panel más compacto */
  @media (max-height: 450px) {
    #controls { padding: 8px 14px; gap: 6px 14px; }
    #throwBtn { padding: 10px 26px; font-size: 15px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>

<div id="hud">
  <div class="hudGroup">
    <div class="chip">🏆 Nivel <b id="levelTxt">1</b></div>
    <div class="chip">🎯 Intentos <b id="triesTxt">0</b></div>
    <button class="chip" id="scenBtn">🏙️ Ciudad</button>
    <button class="chip" id="rankBtn">🏆 Ranking</button>
  </div>
  <div class="hudGroup">
    <button class="chip" id="windBtn">💨 ON</button>
    <div class="chip" id="windChip" style="display:none"><span id="windArrow">→</span> <b id="windTxt">0</b></div>
    <button class="chip" id="viewBtn">📷 Vista</button>
    <button class="chip" id="fsBtn">⛶ Pantalla</button>
    <button class="chip" id="installBtn">📲 Instalar</button>
  </div>
</div>

<div id="banner"><h1 id="bannerTitle">¡GORILLA!</h1><p id="bannerSub">Emboca la banana en el canasto</p></div>

<div id="rankOverlay">
  <div id="rankCard">
    <h2>🏆 Ranking</h2>
    <table id="rankTable"></table>
    <p class="rankHint">tocá en cualquier lado para cerrar</p>
  </div>
</div>

<div id="installOverlay">
  <div id="installCard">
    <h2>📲 Instalar la app</h2>
    <p id="installMsg"></p>
    <p class="rankHint">tocá en cualquier lado para cerrar</p>
  </div>
</div>

<div id="scenOverlay">
  <div id="scenCard">
    <h2>Elegí escenario</h2>
    <div id="scenList"></div>
  </div>
</div>
<div id="rotateHint">📱 Girá el teléfono para ver mejor</div>

<div id="controls">
  <div class="ctl">
    <div class="ctlTop"><label for="angle">Ángulo</label><output id="angleOut">45°</output></div>
    <div class="ctlRow">
      <button class="stepBtn" data-t="angle" data-d="-1">−</button>
      <input type="range" id="angle" min="10" max="85" value="45" step="1">
      <button class="stepBtn" data-t="angle" data-d="1">+</button>
    </div>
  </div>
  <div class="ctl">
    <div class="ctlTop"><label for="yaw">Giro</label><output id="yawOut">0°</output></div>
    <div class="ctlRow">
      <button class="stepBtn" data-t="yaw" data-d="-1">−</button>
      <input type="range" id="yaw" min="-45" max="45" value="0" step="1">
      <button class="stepBtn" data-t="yaw" data-d="1">+</button>
    </div>
  </div>
  <div class="ctl">
    <div class="ctlTop"><label for="power">Fuerza</label><output id="powerOut">60</output></div>
    <div class="ctlRow">
      <button class="stepBtn" data-t="power" data-d="-1">−</button>
      <input type="range" id="power" min="20" max="100" value="60" step="1">
      <button class="stepBtn" data-t="power" data-d="1">+</button>
    </div>
  </div>
  <button id="throwBtn">🍌 ¡LANZAR!</button>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
(() => {
  "use strict";

  // ==================================================================
  // Configuración física común (unidades de mundo, suelo en y=0)
  // ==================================================================
  const CFG = {
    gravity: 38,                 // u/s²
    powerToV: 0.72,              // v0 = fuerza * powerToV
    basketH: 4.4,                // alto del canasto de mimbre
    boundsX: 80,
  };

  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;

  // ==================================================================
  // Escenarios
  // ==================================================================
  const SCENARIOS = {
    ciudad: {
      name: "Ciudad", emoji: "🏙️", next: "selva",
      fog: 0x453a75,
      skyStops: [[0, "#070a1c"], [0.26, "#1a2050"], [0.44, "#4a3a80"], [0.52, "#8a4a7d"], [1, "#8a4a7d"]],
      groundColor: 0x131b0e,
      thrower: "police", projectile: "rock", target: "basket", targetMesh: "trash",
      handOffset: { x: 3.7, y: 12.1 },
      rimR: 2.7,
      cupH: 5.5,
      pedestalColors: [0x554668, 0x6f5c86],
      randomEnv: true,
      throwLabel: "🪨 ¡LANZAR!",
      sub: "El policía practica puntería… ¡embocá la piedra en el tacho! 🗑️",
      moveMsg: "El tacho se movió… encontralo de nuevo 🗑️",
    },
    selva: {
      name: "Selva", emoji: "🌴", next: "basquet",
      fog: 0x35564a,
      skyStops: [[0, "#04120c"], [0.26, "#0a2a1e"], [0.44, "#1e5442"], [0.52, "#4a7a62"], [1, "#4a7a62"]],
      groundColor: 0x0e2410,
      thrower: "gorilla", projectile: "banana", target: "basket", targetMesh: "wicker",
      handOffset: { x: 4.3, y: 10.6 },
      rimR: 3.1,
      cupH: 4.4,
      pedestalColors: [0x5a4028, 0x74553a],   // tronco
      randomEnv: true,
      throwLabel: "🍌 ¡LANZAR!",
      sub: "El gorila en su casa… ¡embocá la banana entre los árboles! 🌴",
      moveMsg: "El canasto se movió… buscalo entre la selva 🌴",
    },
    basquet: {
      name: "Básquet", emoji: "🏀", next: "arquero",
      fog: 0x453a75,
      skyStops: [[0, "#070a1c"], [0.26, "#1a2050"], [0.44, "#4a3a80"], [0.52, "#8a4a7d"], [1, "#8a4a7d"]],
      groundColor: 0x191b1f,
      thrower: "player", projectile: "ball", target: "hoop", targetMesh: "hoop",
      handOffset: { x: 3.7, y: 12.1 },
      rimR: 2.6,
      randomEnv: false,
      throwLabel: "🏀 ¡TIRAR!",
      sub: "Estadio lleno: el aro no se mueve… vos sí 🏀",
      moveMsg: "Cambiaste de posición en la cancha… ¡encestá! 🏀",
    },
    futbol: {
      name: "Fútbol", emoji: "⚽", next: "auto",
      fog: 0x453a75,
      skyStops: [[0, "#070a1c"], [0.26, "#1a2050"], [0.44, "#4a3a80"], [0.52, "#8a4a7d"], [1, "#8a4a7d"]],
      groundColor: 0x14260f,
      thrower: "futbol", projectile: "soccer", target: "goal", targetMesh: "goal",
      handOffset: { x: 2.2, y: 1.3 },   // patea desde el piso
      rimR: 0,
      randomEnv: false,
      throwLabel: "⚽ ¡PATEAR!",
      sub: "Tiro libre: esquivá la barrera y al arquero ⚽",
      moveMsg: "Más lejos, más barrera y arco más chico 😅 ⚽",
    },
    auto: {
      name: "Auto", emoji: "🚗", next: "ciudad",
      fog: 0x8a5038,
      skyStops: [[0, "#140812"], [0.26, "#3a1430"], [0.44, "#8a3a34"], [0.52, "#c9703a"], [1, "#c9703a"]],
      groundColor: 0x5d3f22,
      thrower: "car", projectile: "car", target: "bullseye", targetMesh: "ring",
      handOffset: { x: 8, y: 4.5 },     // punta de la rampa
      rimR: 2.8,
      randomEnv: true,
      throwLabel: "🚗 ¡ACELERAR!",
      sub: "Viejo oeste: tomá la rampa y pasá por el aro 🛞",
      moveMsg: "El aro se movió… acomodá la rampa 🚗",
    },
    arquero: {
      name: "Arquero", emoji: "🏹", next: "futbol",
      fog: 0x48604e,
      skyStops: [[0, "#0a1420"], [0.26, "#173442"], [0.44, "#2e5a50"], [0.52, "#5d7a55"], [1, "#5d7a55"]],
      groundColor: 0x1d3312,
      thrower: "archer", projectile: "arrow", target: "bullseye", targetMesh: "bullseye",
      handOffset: { x: 3.7, y: 12.1 },
      rimR: 2.0,                 // radio del blanco (los aros pintados)
      randomEnv: true,
      throwLabel: "🏹 ¡DISPARAR!",
      sub: "Bosque medieval: clavá la flecha en el blanco 🎯",
      moveMsg: "El blanco se movió… apuntá de nuevo 🏹",
    },
  };

  const state = {
    scenKey: "ciudad",
    level: 1,
    tries: 0,
    wind: 0,                     // componente adelante/atrás (eje x) u/s²
    windZ: 0,                    // componente lateral (eje z) u/s²
    windEnabled: true,           // botón 💨 del HUD
    banana: null,                // proyectil en vuelo {x,y,z,py,vx,vy,vz}
    celebrating: false,
    shake: 0,
    time: 0,
    armUp: 0,
    gorillaYaw: 0,               // giro animado del lanzador (radianes)
    thrower: { x: -38, z: 0 },
    basket: { x: 20, z: 0, baseY: 0, rimY: CFG.basketH, pedestalH: 0, rimR: 3.1 },
    gk: { z: 0, half: 1.8, h: 7 },       // arquero de fútbol
    wall: { n: 0, x: 0, z: 0, half: 0 }, // barrera
  };
  const scen = () => SCENARIOS[state.scenKey];

  // ------------------------------------------------ récords persistentes
  let records = {};
  try { records = JSON.parse(localStorage.getItem("gorilla-records") || "{}"); } catch (e) {}
  function rec(key) {
    return records[key] || (records[key] = { best: 0, hits: 0, throws: 0 });
  }
  function saveRecords() {
    try { localStorage.setItem("gorilla-records", JSON.stringify(records)); } catch (e) {}
  }

  const ui = {
    angle: document.getElementById("angle"),
    yaw: document.getElementById("yaw"),
    yawOut: document.getElementById("yawOut"),
    power: document.getElementById("power"),
    angleOut: document.getElementById("angleOut"),
    powerOut: document.getElementById("powerOut"),
    throwBtn: document.getElementById("throwBtn"),
    viewBtn: document.getElementById("viewBtn"),
    scenBtn: document.getElementById("scenBtn"),
    windBtn: document.getElementById("windBtn"),
    rankBtn: document.getElementById("rankBtn"),
    rankOverlay: document.getElementById("rankOverlay"),
    rankTable: document.getElementById("rankTable"),
    fsBtn: document.getElementById("fsBtn"),
    installBtn: document.getElementById("installBtn"),
    installOverlay: document.getElementById("installOverlay"),
    installMsg: document.getElementById("installMsg"),
    levelTxt: document.getElementById("levelTxt"),
    triesTxt: document.getElementById("triesTxt"),
    windChip: document.getElementById("windChip"),
    windTxt: document.getElementById("windTxt"),
    windArrow: document.getElementById("windArrow"),
    banner: document.getElementById("banner"),
    bannerTitle: document.getElementById("bannerTitle"),
    bannerSub: document.getElementById("bannerSub"),
    rotateHint: document.getElementById("rotateHint"),
  };

  // ==================================================================
  // Sonido y vibración
  // ==================================================================
  let audioCtx = null, noiseBuf = null;
  function ctxA() {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();

  function beep(freq, dur, type = "sine", vol = 0.15, when = 0) {
    try {
      const ac = ctxA();
      const t = ac.currentTime + when;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) { /* sin audio */ }
  }
  // "plop": tono que cae de frecuencia (gota / objeto que entra)
  function plop(f1, f2, dur, vol = 0.25, when = 0) {
    try {
      const ac = ctxA();
      const t = ac.currentTime + when;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  // ráfaga de ruido filtrado (silbidos de lanzamiento, swish de red)
  function whoosh(dur, f1, f2, vol, when = 0, type = "bandpass", q = 1.1) {
    try {
      const ac = ctxA();
      if (!noiseBuf) {
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      const t = ac.currentTime + when;
      const src = ac.createBufferSource();
      src.buffer = noiseBuf;
      src.loop = true;
      const fl = ac.createBiquadFilter();
      fl.type = type;
      fl.Q.value = q;
      fl.frequency.setValueAtTime(f1, t);
      fl.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.18);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(fl).connect(g).connect(ac.destination);
      src.start(t); src.stop(t + dur + 0.05);
    } catch (e) {}
  }

        car.position.set(cx + rand(-2, 2), 0, 18.6);
        car.rotation.y = rand(-0.04, 0.04);
        group.add(car);
      }

      // hidrante
      const hyMat = new THREE.MeshStandardMaterial({ color: 0xc23b2e, roughness: 0.5 });
      const hydrant = new THREE.Group();
      const hyBody = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.5, 1.6, 10), hyMat);
      hyBody.position.y = 1.1;
      hyBody.castShadow = true;
      hydrant.add(hyBody);
      const hyCap = new THREE.Mesh(new THREE.SphereGeometry(0.42, 10, 8), hyMat);
      hyCap.position.y = 1.95;
      hydrant.add(hyCap);
      for (const sz of [-0.5, 0.5]) {
        const nub = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.4, 8), hyMat);
        nub.rotation.x = Math.PI / 2;
        nub.position.set(0, 1.2, sz);
        hydrant.add(nub);
      }
      hydrant.position.set(-30, 0.4, 13);
      group.add(hydrant);

      // semáforo en la esquina
      const tl = new THREE.Group();
      const tlPole = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 7.5, 8), mastMat);
      tlPole.position.y = 3.75;
      tl.add(tlPole);
      const tlBox = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2.2, 0.7), new THREE.MeshStandardMaterial({ color: 0x1c1f26, roughness: 0.7 }));
      tlBox.position.y = 8.2;
      tl.add(tlBox);
      const tlCols = [0xff4436, 0xffc73a, 0x35d05a];
      tlCols.forEach((c, i) => {
        const lamp = new THREE.Mesh(
          new THREE.SphereGeometry(0.22, 8, 6),
          new THREE.MeshBasicMaterial({ color: c, toneMapped: false })
        );
        lamp.material.opacity = 1;
        lamp.position.set(0, 8.85 - i * 0.65, 0.4);
        if (i !== 0) { lamp.material.transparent = true; lamp.material.opacity = 0.18; }  // rojo encendido
        tl.add(lamp);
      });
      tl.position.set(56, 0, 14.5);
      group.add(tl);

      // cartel de neón sobre un edificio cercano
      const nc = document.createElement("canvas");
      nc.width = 256; nc.height = 96;
      const ng = nc.getContext("2d");
      ng.fillStyle = "#12040f"; ng.fillRect(0, 0, 256, 96);
      ng.strokeStyle = "#ff44aa"; ng.lineWidth = 5; ng.strokeRect(6, 6, 244, 84);
      ng.fillStyle = "#ff77c8";
      ng.font = "bold 44px sans-serif";
      ng.textAlign = "center";
      ng.fillText("HOTEL", 128, 62);
      const neonTex = new THREE.CanvasTexture(nc);
      neonTex.encoding = THREE.sRGBEncoding;
      const neon = new THREE.Mesh(
        new THREE.PlaneGeometry(10, 3.8),
        new THREE.MeshBasicMaterial({ map: neonTex, toneMapped: false })
      );
      neon.position.set(-58, 12.5, -16.8);
      group.add(neon);

      // grúa de construcción en el fondo
      const crane = new THREE.Group();
      const craneMat = new THREE.MeshStandardMaterial({ color: 0xc9a13a, roughness: 0.7 });
      const mast = new THREE.Mesh(new THREE.BoxGeometry(1.6, 42, 1.6), craneMat);
      mast.position.y = 21;
      crane.add(mast);
      const jib = new THREE.Mesh(new THREE.BoxGeometry(30, 1.3, 1.3), craneMat);
      jib.position.set(11, 42, 0);
      crane.add(jib);
      const counter = new THREE.Mesh(new THREE.BoxGeometry(3.5, 2.4, 2.4), new THREE.MeshStandardMaterial({ color: 0x5a5f6a, roughness: 0.8 }));
      counter.position.set(-6.5, 41.6, 0);
      crane.add(counter);
      const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 14, 4), new THREE.MeshBasicMaterial({ color: 0x9aa0aa }));
      cable.position.set(20, 34.5, 0);
      crane.add(cable);
      const hook = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), craneMat);
      hook.position.set(20, 26.8, 0);
      crane.add(hook);
      const craneBeacon = new THREE.Mesh(
        new THREE.SphereGeometry(0.5, 8, 6),
        new THREE.MeshBasicMaterial({ color: 0xff3b30, toneMapped: false })
      );
      craneBeacon.position.set(0, 43.4, 0);
      crane.add(craneBeacon);
      group.userData.blinkers.push(craneBeacon);
      crane.position.set(-96, 0, -58);
      group.add(crane);

      // pasarela entre dos edificios
      const bridge = new THREE.Mesh(boxGeo, new THREE.MeshStandardMaterial({ color: 0x1f2c52, roughness: 0.9 }));
      bridge.position.set(-2, 16, -46);
      bridge.scale.set(26, 3.2, 5);
      group.add(bridge);
      for (let i = 0; i < 6; i++) {
        const win = new THREE.Mesh(
          new THREE.PlaneGeometry(1.6, 1.4),
          new THREE.MeshBasicMaterial({ color: 0xffd876, toneMapped: false })
        );
        win.position.set(-12.5 + i * 4.2, 17.6, -43.4);
        group.add(win);
      }

      // helicóptero patrullando (animado)
      const heli = new THREE.Group();
      const hBodyMat = new THREE.MeshStandardMaterial({ color: 0x2a3240, roughness: 0.6 });
      const hBody = sphere(1.4, hBodyMat, 1.5, 0.9, 0.9);
      heli.add(hBody);
      const hTail = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.5, 0.5), hBodyMat);
      hTail.position.set(-3, 0.3, 0);
      heli.add(hTail);
      const rotor = new THREE.Mesh(new THREE.BoxGeometry(7, 0.12, 0.5), new THREE.MeshStandardMaterial({ color: 0x9aa0aa, roughness: 0.4 }));
      rotor.position.y = 1.5;
      heli.add(rotor);
      const hLight = new THREE.Mesh(
        new THREE.SphereGeometry(0.32, 8, 6),
        new THREE.MeshBasicMaterial({ color: 0xff3b30, toneMapped: false })
      );
      hLight.position.y = -1.1;
      heli.add(hLight);
      group.add(heli);
      group.userData.heli = { g: heli, rotor, light: hLight };

      // vapor saliendo de una alcantarilla
      const steamTex = glowTexture("rgba(200,205,215,.4)", "rgba(200,205,215,0)");
      if (!group.userData.smoke) group.userData.smoke = [];
      const grate = new THREE.Vector3(-12, 0.4, 20.2);
      for (let i = 0; i < 3; i++) {
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: steamTex, transparent: true, depthWrite: false, opacity: 0 }));
        group.add(s);
        group.userData.smoke.push({ s, spot: grate, off: i / 3 });
      }

      // papeles tirados cerca del tacho
      const paperMat = new THREE.MeshStandardMaterial({ color: 0xe8e8e2, roughness: 0.9, side: THREE.DoubleSide });
      for (let i = 0; i < 8; i++) {
        const paper = new THREE.Mesh(new THREE.PlaneGeometry(rand(0.5, 0.9), rand(0.4, 0.7)), paperMat);
        paper.rotation.set(-Math.PI / 2 + rand(-0.3, 0.3), 0, rand(0, Math.PI * 2));
        paper.position.set(rand(5, 45), 0.12, rand(-14, 10));
        group.add(paper);
      }
    }
  }

  // ---------- selva ----------
  function buildJungle(group) {
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a4028, roughness: 0.95 });
    const greens = [0x1c4a22, 0x2a5e2a, 0x1a3e1e, 0x35702f].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 }));
    const frondMat = new THREE.MeshStandardMaterial({ color: 0x2f6b2c, roughness: 0.9, side: THREE.DoubleSide });

    const inPlayArea = (x, z) => x > -52 && x < 54 && z > -34 && z < 22;

    for (let i = 0; i < 65; i++) {
      const x = rand(-145, 145), z = rand(-105, 55);
      if (inPlayArea(x, z)) continue;
      // adelante del plano de juego solo a los costados, y no gigantes:
      // un árbol pegado a la cámara tapa toda la escena
      if (z > -12 && Math.abs(x) < 75) continue;
      const s = z > -12 ? rand(0.7, 1.2) : rand(0.8, 2.1);
      const tree = new THREE.Group();
      if (Math.random() < 0.35) {
        // palmera: tronco curvado + frondas
        let px = 0, py = 0, tilt = rand(-0.18, 0.18);
        for (let k = 0; k < 4; k++) {
          const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.5 - k * 0.07, 0.6 - k * 0.07, 3.4, 7), trunkMat);
          px += Math.sin(tilt) * 3.2 * (k * 0.5);
          py = 1.6 + k * 3.1;
          seg.position.set(px, py, 0);
          seg.rotation.z = tilt * (k + 1) * 0.5;
          seg.castShadow = true;
          tree.add(seg);
        }
        for (let f = 0; f < 6; f++) {
          const frond = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 4), frondMat);
          frond.scale.set(2.8, 0.2, 0.8);
          const a = f / 6 * Math.PI * 2;
          frond.position.set(px + Math.cos(a) * 2.4, py + 1.6, Math.sin(a) * 2.4);
          frond.rotation.y = -a;
          frond.rotation.z = 0.35;
          tree.add(frond);
        }
      } else {
        // árbol de copa redonda
        const th = rand(4, 9);
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.8, th, 7), trunkMat);
        trunk.position.y = th / 2;
        trunk.castShadow = true;
        tree.add(trunk);
        const nBlobs = 2 + (Math.random() * 3 | 0);
        for (let b = 0; b < nBlobs; b++) {
          const r = rand(2.2, 3.6);
          const blob = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 9), greens[(Math.random() * greens.length) | 0]);
          blob.position.set(rand(-1.6, 1.6), th + rand(-0.5, 2.2), rand(-1.6, 1.6));
          blob.castShadow = true;
          tree.add(blob);
        }
      }
      tree.scale.setScalar(s);
      tree.position.set(x, 0, z);
      tree.rotation.y = rand(0, Math.PI * 2);
      group.add(tree);
    }
    // arbustos sueltos (algunos dentro del área de juego, bajitos)
    for (let i = 0; i < 30; i++) {
      const x = rand(-120, 120), z = rand(-80, 40);
      if (x > -50 && x < 52 && z > -8 && z < 8) continue;   // corredor de tiro despejado
      const bush = new THREE.Mesh(
        new THREE.SphereGeometry(rand(0.8, 1.8), 8, 6),
        greens[(Math.random() * greens.length) | 0]
      );
      bush.position.set(x, 0.6, z);
      bush.scale.y = 0.7;
      group.add(bush);
    }
    // vegetación de primer plano: helechos y plantas de hojas grandes
    // delante del gorila y a lo largo del borde inferior de la vista
    const lightGreens = [0x3f8a3f, 0x2f7a4a, 0x4a9a55].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, side: THREE.DoubleSide }));
    for (let i = 0; i < 30; i++) {
      const x = rand(-70, 70), z = rand(9, 22);
      const plant = new THREE.Group();
      const mat = lightGreens[(Math.random() * lightGreens.length) | 0];
      if (Math.random() < 0.55) {
        // helecho: frondas en abanico
        const nF = 5 + (Math.random() * 3 | 0);
        for (let f = 0; f < nF; f++) {
          const leaf = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 4), mat);
          leaf.scale.set(1.9, 0.14, 0.4);
          const a = f / nF * Math.PI * 2 + rand(0, 0.5);
          leaf.position.set(Math.cos(a) * 1.1, 0.8, Math.sin(a) * 1.1);
          leaf.rotation.y = -a;
          leaf.rotation.z = rand(0.35, 0.6);
          plant.add(leaf);
        }
      } else {
        // planta de hojas grandes y verticales
        const nL = 3 + (Math.random() * 3 | 0);
        for (let f = 0; f < nL; f++) {
          const leaf = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 6), mat);
          leaf.scale.set(0.55, 2.1, 0.14);
          const a = rand(0, Math.PI * 2);
          leaf.position.set(Math.cos(a) * 0.5, 1.7, Math.sin(a) * 0.5);
          leaf.rotation.y = -a;
          leaf.rotation.z = rand(-0.35, 0.35);
          plant.add(leaf);
        }
      }
      plant.scale.setScalar(rand(0.6, 1.25));
      plant.position.set(x, 0, z);
      plant.rotation.y = rand(0, Math.PI * 2);
      group.add(plant);
    }

    // laguna espejada a un costado
    const lagoon = new THREE.Mesh(
      new THREE.CircleGeometry(13, 26),
      new THREE.MeshStandardMaterial({ color: 0x1d4a5e, roughness: 0.12, metalness: 0.7 })
    );
    lagoon.rotation.x = -Math.PI / 2;
    lagoon.scale.set(1.5, 0.75, 1);
    lagoon.position.set(-76, 0.05, 10);
    group.add(lagoon);
    // rocas
    const rockMat = new THREE.MeshStandardMaterial({ color: 0x6d7178, roughness: 0.95, flatShading: true });
    for (let i = 0; i < 7; i++) {
      const x = rand(-120, 120), z = rand(-60, 24);
      if (inPlayArea(x, z)) continue;
      const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(rand(0.9, 2.4), 0), rockMat);
      rock.position.set(x, 0.5, z);
      rock.rotation.set(rand(0, 3), rand(0, 3), 0);
      rock.castShadow = true;
      group.add(rock);
    }

    // nenúfares y juncos en la laguna
    const padMat = new THREE.MeshStandardMaterial({ color: 0x3f8a4a, roughness: 0.8, side: THREE.DoubleSide });
    for (let i = 0; i < 7; i++) {
      const pad = new THREE.Mesh(new THREE.CircleGeometry(rand(0.8, 1.6), 10), padMat);
      pad.rotation.x = -Math.PI / 2;
      const a = rand(0, Math.PI * 2), r = rand(3, 14);
      pad.position.set(-76 + Math.cos(a) * r * 1.4, 0.12, 10 + Math.sin(a) * r * 0.7);
      group.add(pad);
    }
    for (let i = 0; i < 12; i++) {
      const reed = new THREE.Mesh(
        new THREE.CylinderGeometry(0.06, 0.09, rand(1.6, 3.2), 5),
        new THREE.MeshStandardMaterial({ color: 0x4a7a35, roughness: 0.9 })
      );
      const a = rand(0, Math.PI * 2);
      reed.position.set(-76 + Math.cos(a) * 19, 1.2, 10 + Math.sin(a) * 9.5);
      reed.rotation.z = rand(-0.15, 0.15);
      group.add(reed);
    }

    // lianas colgando de los árboles altos del fondo
    const vineMat = new THREE.MeshStandardMaterial({ color: 0x35702f, roughness: 0.9 });
    for (let i = 0; i < 10; i++) {
      const x = rand(-120, 120), z = rand(-90, -30);
      const top = rand(9, 16), len = rand(4, top - 2);
      const vine = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.11, len, 5), vineMat);
      vine.position.set(x, top - len / 2, z);
      vine.rotation.z = rand(-0.12, 0.12);
      group.add(vine);
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.5, 6, 5), vineMat);
      leaf.scale.set(1, 0.4, 0.6);
      leaf.position.set(x, top - len, z);
      group.add(leaf);
    }

    // hongos rojos
    const stemMat = new THREE.MeshStandardMaterial({ color: 0xe0d8c0, roughness: 0.8 });
    const capMat = new THREE.MeshStandardMaterial({ color: 0xd03a2e, roughness: 0.7, emissive: 0x2a0402 });
    for (let i = 0; i < 9; i++) {
      const x = rand(-90, 90), z = rand(-45, 22);
      if (x > -50 && x < 52 && Math.abs(z) < 7) continue;
      const s = rand(0.5, 1.1);
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.16 * s, 0.22 * s, 0.8 * s, 6), stemMat);
      stem.position.set(x, 0.4 * s, z);
      group.add(stem);
      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.55 * s, 8, 6), capMat);
      cap.scale.y = 0.6;
      cap.position.set(x, 0.85 * s, z);
      group.add(cap);
    }

    // ruinas de piedra cubiertas de musgo
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x7d8188, roughness: 0.95 });
    const mossMat = new THREE.MeshStandardMaterial({ color: 0x2f6b2c, roughness: 0.9 });
    const ruin = new THREE.Group();
    const col1 = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.15, 6.5, 9), stoneMat);
    col1.position.set(0, 3.25, 0);
    col1.rotation.z = 0.06;
    col1.castShadow = true;
    ruin.add(col1);
    const col2 = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.1, 2.6, 9), stoneMat);
    col2.position.set(4.5, 1.3, 1);
    col2.castShadow = true;
    ruin.add(col2);
    const fallen = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 5, 9), stoneMat);
    fallen.rotation.z = Math.PI / 2;
    fallen.rotation.y = 0.5;
    fallen.position.set(7.5, 0.95, 3.5);
    fallen.castShadow = true;
    ruin.add(fallen);
    for (const [mx, my, mz] of [[0, 6.4, 0], [4.5, 2.5, 1], [6.5, 1.7, 3]]) {
      const moss = new THREE.Mesh(new THREE.SphereGeometry(0.9, 8, 6), mossMat);
      moss.scale.set(1.2, 0.4, 1.2);
      moss.position.set(mx, my, mz);
      ruin.add(moss);
    }
    ruin.position.set(66, 0, -18);
    group.add(ruin);

    // tucán posado en un árbol
    const toucan = new THREE.Group();
    const tBody = sphere(0.75, new THREE.MeshStandardMaterial({ color: 0x14161a, roughness: 0.8 }), 1, 1.15, 0.85);
    toucan.add(tBody);
    const tChest = sphere(0.45, new THREE.MeshStandardMaterial({ color: 0xffd23e, roughness: 0.7 }), 1, 1.1, 0.6);
    tChest.position.set(0.28, -0.1, 0.28);
    toucan.add(tChest);
    const tBeak = new THREE.Mesh(
      new THREE.ConeGeometry(0.28, 1.5, 8),
      new THREE.MeshStandardMaterial({ color: 0xff9d2e, roughness: 0.6 })
    );
    tBeak.rotation.z = -Math.PI / 2.4;
    tBeak.position.set(1.05, 0.42, 0);
    toucan.add(tBeak);
    const tEye = sphere(0.09, eyeMat);
    tEye.position.set(0.45, 0.5, 0.35);
    toucan.add(tEye);
    toucan.position.set(-62, 9.6, -26);
    toucan.rotation.y = 0.5;
    group.add(toucan);

    // cascada que alimenta la laguna
    const cliffMat = new THREE.MeshStandardMaterial({ color: 0x5d6168, roughness: 0.95, flatShading: true });
    for (const [cx3, cy3, cs] of [[-97, 4, 5.5], [-92, 6.5, 4.5], [-101, 7, 4], [-95, 10, 3.6]]) {
      const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(cs, 0), cliffMat);
      rock.position.set(cx3, cy3, 8);
      rock.rotation.set(rand(0, 3), rand(0, 3), 0);
      rock.castShadow = true;
      group.add(rock);
    }
    const wc = document.createElement("canvas");
    wc.width = 64; wc.height = 128;
    const wg = wc.getContext("2d");
    wg.fillStyle = "rgba(120,190,220,.35)"; wg.fillRect(0, 0, 64, 128);
    for (let i = 0; i < 26; i++) {
      wg.fillStyle = `rgba(235,250,255,${rand(0.25, 0.7)})`;
      wg.fillRect(rand(0, 60), rand(0, 120), rand(2, 5), rand(10, 34));
    }
    const waterTex = new THREE.CanvasTexture(wc);
    waterTex.wrapS = waterTex.wrapT = THREE.RepeatWrapping;
    const waterfall = new THREE.Mesh(
      new THREE.PlaneGeometry(5.4, 12),
      new THREE.MeshBasicMaterial({ map: waterTex, transparent: true, depthWrite: false, side: THREE.DoubleSide })
    );
    waterfall.position.set(-94.5, 6.2, 10.5);
    group.add(waterfall);
    group.userData.waterTex = waterTex;
    const mistBase = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture("rgba(220,240,250,.55)", "rgba(220,240,250,0)"),
      transparent: true, depthWrite: false,
    }));
    mistBase.scale.set(10, 5, 1);
    mistBase.position.set(-94, 1.5, 11.5);
    group.add(mistBase);

    // bruma baja que deriva por el fondo
    const mistTex = glowTexture("rgba(200,225,215,.28)", "rgba(200,225,215,0)");
    const mists = [];
    for (let i = 0; i < 5; i++) {
      const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: mistTex, transparent: true, depthWrite: false, opacity: rand(0.4, 0.7) }));
      m.scale.set(rand(28, 48), rand(5, 8), 1);
      m.position.set(rand(-100, 100), rand(1.5, 4), rand(-70, -30));
      group.add(m);
      mists.push({ m, v: rand(0.6, 1.6) });
    }
    group.userData.mists = mists;

    // bandada de pájaros en círculos
    const birds = [];
    const birdMat = new THREE.MeshBasicMaterial({ color: 0x10141c, side: THREE.DoubleSide });
    for (let i = 0; i < 5; i++) {
      const bird = new THREE.Group();
      const wl = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.5), birdMat);
      wl.position.x = -0.8;
      const wr = wl.clone();
      wr.position.x = 0.8;
      bird.add(wl); bird.add(wr);
      bird.userData.wl = wl; bird.userData.wr = wr;
      group.add(bird);
      birds.push({ bird, ph: rand(0, 6.28), r: rand(28, 46), cy: rand(30, 44) });
    }
    group.userData.birds = birds;

    // mariposas que revolotean
    const bfColors = [0x7cc4ff, 0xffd54a, 0xff7ce0];
    const butterflies = [];
    for (let i = 0; i < 7; i++) {
      const bf = new THREE.Group();
      const wMat = new THREE.MeshBasicMaterial({ color: bfColors[i % 3], side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
      const w1 = new THREE.Mesh(new THREE.CircleGeometry(0.42, 6), wMat);
      w1.position.x = -0.3;
      const w2 = w1.clone();
      w2.position.x = 0.3;
      bf.add(w1); bf.add(w2);
      bf.userData.w1 = w1; bf.userData.w2 = w2;
      const bx = rand(-60, 60), bz = rand(-25, 18);
      bf.position.set(bx, rand(2, 8), bz);
      group.add(bf);
      butterflies.push({ bf, ph: rand(0, 6.28), bx, by: bf.position.y, bz });
    }
    group.userData.butterflies = butterflies;

    // luciérnagas
    const n = 60, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      pos[i * 3] = rand(-100, 100);
      pos[i * 3 + 1] = rand(0.8, 7);
      pos[i * 3 + 2] = rand(-70, 30);
    }
    const fg = new THREE.BufferGeometry();
    fg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    const fireflies = new THREE.Points(fg, new THREE.PointsMaterial({

  // ---------- cancha de básquet ----------
  function courtTexture() {
    const W = 1024, H = 616;
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const g = c.getContext("2d");
    g.fillStyle = "#2e6b5c"; g.fillRect(0, 0, W, H);          // exterior verde
    g.fillStyle = "#31648f"; g.fillRect(38, 38, W - 76, H - 76); // interior azul
    g.strokeStyle = "rgba(255,255,255,.9)";
    g.lineWidth = 6;
    g.strokeRect(38, 38, W - 76, H - 76);
    // línea y círculo central con logo
    g.beginPath(); g.moveTo(W / 2, 38); g.lineTo(W / 2, H - 38); g.stroke();
    g.beginPath(); g.arc(W / 2, H / 2, 78, 0, Math.PI * 2); g.stroke();
    g.fillStyle = "rgba(255,213,74,.25)";
    g.beginPath(); g.arc(W / 2, H / 2, 72, 0, Math.PI * 2); g.fill();
    g.fillStyle = "rgba(255,213,74,.85)";
    g.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = k * Math.PI / 5 - Math.PI / 2;
      const r = k % 2 ? 22 : 52;
      const px = W / 2 + Math.cos(a) * r, py = H / 2 + Math.sin(a) * r;
      k ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath();
    g.fill();
    // llaves y aros de tiro libre en ambos extremos
    for (const end of [0, 1]) {
      const dir = end === 0 ? 1 : -1;
      const bx = end === 0 ? 38 : W - 38;
      g.strokeRect(Math.min(bx, bx + dir * 210), H / 2 - 90, 210, 180);
      g.beginPath(); g.arc(bx + dir * 210, H / 2, 70, 0, Math.PI * 2); g.stroke();
      // triple
      g.beginPath();
      g.arc(bx + dir * 60, H / 2, 265, -Math.PI / 2, Math.PI / 2, end === 1);
      g.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 4;
    return tex;
  }

  // tribunas de estadio en U alrededor de la cancha, con público de colores
  function buildStands(group) {
    const stepMat = new THREE.MeshStandardMaterial({ color: 0x2a3240, roughness: 0.9 });
    const faceMat = new THREE.MeshStandardMaterial({ color: 0x39424f, roughness: 0.9 });
    const ROWS = 9, STEP_H = 2.3, STEP_D = 4.2;
    const crowdPos = [], crowdCol = [];
    const palette = [0xe04b3a, 0xffd54a, 0x4a9de0, 0x7cf29c, 0xf2f2f2, 0xff7ce0, 0xff9d2e, 0x9a7cf2];

    // cada lado: base (posición inicial), dirección de alejamiento y largo
    const sides = [
      { ox: 0,   oz: -40, dx: 0,  dz: -1, len: 170, along: "x" },   // fondo
      { ox: -60, oz: 0,   dx: -1, dz: 0,  len: 96,  along: "z" },   // detrás del lanzador
      { ox: 62,  oz: 0,   dx: 1,  dz: 0,  len: 96,  along: "z" },   // detrás del aro
    ];
    for (const s of sides) {
      for (let i = 0; i < ROWS; i++) {
        const step = new THREE.Mesh(boxGeo, i % 2 ? stepMat : faceMat);
        const cx = s.ox + s.dx * (i * STEP_D + STEP_D / 2);
        const cz = s.oz + s.dz * (i * STEP_D + STEP_D / 2);
        const topY = STEP_H * (i + 1);
        step.position.set(cx, 0, cz);
        if (s.along === "x") step.scale.set(s.len, topY, STEP_D);
        else step.scale.set(STEP_D, topY, s.len);
        group.add(step);
        // público sentado en cada fila (salteado, para que respire)
        for (let d = -s.len / 2 + 2; d < s.len / 2 - 2; d += rand(2.2, 4.2)) {
          if (Math.random() < 0.25) continue;
          const hx = s.along === "x" ? cx + d + rand(-0.4, 0.4) : cx + rand(-1, 1);
          const hz = s.along === "z" ? cz + d + rand(-0.4, 0.4) : cz + rand(-1, 1);
          crowdPos.push(hx, topY + 0.7, hz);
          const col = new THREE.Color(palette[(Math.random() * palette.length) | 0]);
          crowdCol.push(col.r, col.g, col.b);
        }
      }
    }
    const cg = new THREE.BufferGeometry();
    cg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(crowdPos), 3));
    cg.setAttribute("color", new THREE.BufferAttribute(new Float32Array(crowdCol), 3));
    const crowd = new THREE.Points(cg, new THREE.PointsMaterial({ size: 1.5, vertexColors: true, sizeAttenuation: true }));
    group.add(crowd);

    // flashes de cámaras entre el público
    const flashTex = glowTexture("rgba(255,255,255,.95)", "rgba(255,255,255,0)");
    const flashes = [];
    for (let i = 0; i < 12; i++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: flashTex, transparent: true, depthWrite: false, opacity: 0 }));
      s.scale.set(3.2, 3.2, 1);
      group.add(s);
      flashes.push({ s, life: 0 });
    }
    group.userData.flashes = flashes;
    group.userData.crowdPts = crowdPos;

    // marcador sobre la tribuna del fondo (muestra el nivel en vivo)
    const sb = document.createElement("canvas");
    sb.width = 512; sb.height = 160;
    const sg = sb.getContext("2d");
    const sbTex = new THREE.CanvasTexture(sb);
    sbTex.encoding = THREE.sRGBEncoding;
    group.userData.sb = { g: sg, tex: sbTex, last: "" };
    const board = new THREE.Mesh(
      new THREE.BoxGeometry(26, 8.5, 1.2),
      [null, null, null, null,
        new THREE.MeshBasicMaterial({ map: sbTex, toneMapped: false }),
        new THREE.MeshStandardMaterial({ color: 0x10141c })
      ].map(m => m || new THREE.MeshStandardMaterial({ color: 0x1a1f2a }))
    );
    board.position.set(0, 27, -62);
    group.add(board);
    for (const px of [-11, 11]) {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 8, 8), stepMat);
      leg.position.set(px, 19, -62);
      group.add(leg);
    }

    // banderas flameando en lo alto de las tribunas laterales
    const flagCols = [0xffd54a, 0xe04b3a];
    const flags = [];
    [[-70, -20], [72, -20]].forEach(([fx, fz], i) => {
      const mast2 = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.3, 34, 8), stepMat);
      mast2.position.set(fx, 17, fz);
      group.add(mast2);
      const fGroup = new THREE.Group();
      fGroup.position.set(fx, 32.5, fz);
      const flag = new THREE.Mesh(
        new THREE.PlaneGeometry(5, 3),
        new THREE.MeshStandardMaterial({ color: flagCols[i], roughness: 0.8, side: THREE.DoubleSide })
      );
      flag.position.x = 2.6;
      fGroup.add(flag);
      group.add(fGroup);
      flags.push(fGroup);
    });
    group.userData.flags = flags;

    // banderines de colores cruzando sobre la cancha
    const penMats = palette.slice(0, 6).map(c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide, toneMapped: false }));
    for (const [y0, z0] of [[26, -34], [24, -30]]) {
      for (let x = -56; x <= 58; x += 5) {
        const t = (x + 56) / 114;
        const sag = Math.sin(t * Math.PI) * -3.5;
        const pennant = new THREE.Mesh(new THREE.ConeGeometry(0.55, 1.6, 3), penMats[((x + 56) / 5 | 0) % penMats.length]);
        pennant.rotation.x = Math.PI;
        pennant.position.set(x, y0 + sag, z0);
        group.add(pennant);
      }
    }
  }

  // ---------- bosque medieval ----------
  function buildForest(group) {
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a4028, roughness: 0.95 });
    const pineMat = new THREE.MeshStandardMaterial({ color: 0x1e4d2b, roughness: 0.9 });
    const oakMats = [0x2a5e2a, 0x35702f, 0x3f7a35].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 }));
    const inPlayArea = (x, z) => x > -52 && x < 54 && z > -34 && z < 22;

    // árboles: pinos y robles
    for (let i = 0; i < 55; i++) {
      const x = rand(-145, 145), z = rand(-100, 50);
      if (inPlayArea(x, z)) continue;
      if (z > -12 && Math.abs(x) < 75) continue;
      const s = z > -12 ? rand(0.7, 1.1) : rand(0.8, 1.9);
      const tree = new THREE.Group();
      if (Math.random() < 0.5) {
        // pino: conos apilados
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 3, 7), trunkMat);
        trunk.position.y = 1.5;
        trunk.castShadow = true;
        tree.add(trunk);
        for (let k = 0; k < 3; k++) {
          const cone = new THREE.Mesh(new THREE.ConeGeometry(3.4 - k * 0.9, 3.4, 9), pineMat);
          cone.position.y = 4 + k * 2.4;
          cone.castShadow = true;
          tree.add(cone);
        }
      } else {
        // roble de copa redonda
        const th = rand(3.5, 7);
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.85, th, 7), trunkMat);
        trunk.position.y = th / 2;
        trunk.castShadow = true;
        tree.add(trunk);
        for (let b = 0; b < 3; b++) {
          const r = rand(2.2, 3.4);
          const blob = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 9), oakMats[(Math.random() * oakMats.length) | 0]);
          blob.position.set(rand(-1.4, 1.4), th + rand(-0.4, 2), rand(-1.4, 1.4));
          blob.castShadow = true;
          tree.add(blob);
        }
      }
      tree.scale.setScalar(s);
      tree.position.set(x, 0, z);
      tree.rotation.y = rand(0, Math.PI * 2);
      group.add(tree);
    }

    // casitas medievales al fondo
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xe8dcc0, roughness: 0.9 });
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x7a3b2a, roughness: 0.85 });
    const doorMat = new THREE.MeshStandardMaterial({ color: 0x4a3016, roughness: 0.9 });
    const winMat = new THREE.MeshStandardMaterial({ color: 0xffd876, emissive: 0xffca55, emissiveIntensity: 0.8 });
    for (let i = 0; i < 6; i++) {
      const hx = rand(-110, 110), hz = rand(-75, -32);
      if (Math.abs(hx) < 20 && hz > -45) continue;
      const w = rand(9, 13), h = rand(5.5, 7.5), d = rand(8, 11);
      const house = new THREE.Group();
      const body = new THREE.Mesh(boxGeo, wallMat);
      body.scale.set(w, h, d);
      body.castShadow = true;
      house.add(body);
      const roof = new THREE.Mesh(new THREE.ConeGeometry(w * 0.85, h * 0.7, 4), roofMat);
      roof.position.y = h + h * 0.35;
      roof.rotation.y = Math.PI / 4;
      roof.castShadow = true;
      house.add(roof);
      const door = new THREE.Mesh(new THREE.BoxGeometry(1.8, 3, 0.3), doorMat);
      door.position.set(rand(-w / 4, w / 4), 1.5, d / 2 + 0.1);
      house.add(door);
      for (let wnd = 0; wnd < 2; wnd++) {
        const win = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.3, 0.25), winMat);
        win.position.set((wnd ? 1 : -1) * w / 3.2, h * 0.6, d / 2 + 0.1);
        house.add(win);
      }
      // chimenea (guardamos la punta para el humo)
      const chim = new THREE.Mesh(new THREE.BoxGeometry(1, 2.4, 1), doorMat);
      chim.position.set(w / 4, h + 1.6, -d / 5);
      house.add(chim);
      house.position.set(hx, 0, hz);
      house.rotation.y = rand(-0.4, 0.4);
      group.add(house);
      if (!group.userData.smokeSpots) group.userData.smokeSpots = [];
      if (group.userData.smokeSpots.length < 3) {
        group.userData.smokeSpots.push(new THREE.Vector3(hx + w / 4, h + 2.9, hz - d / 5));
      }
    }

    // flores en el prado
    const flowerMats = [0xfff2f2, 0xffd54a, 0xff9dc8].map(c => new THREE.MeshBasicMaterial({ color: c }));
    for (let i = 0; i < 70; i++) {
      const x = rand(-90, 90), z = rand(-40, 26);
      if (x > -48 && x < 50 && Math.abs(z) < 5) continue;   // corredor de tiro
      const f = new THREE.Mesh(new THREE.SphereGeometry(rand(0.14, 0.26), 6, 5), flowerMats[i % 3]);
      f.position.set(x, 0.35, z);
      group.add(f);
    }
    // arbustos bajos en primer plano
    for (let i = 0; i < 14; i++) {
      const bush = new THREE.Mesh(
        new THREE.SphereGeometry(rand(0.9, 1.7), 8, 6),
        oakMats[(Math.random() * oakMats.length) | 0]
      );
      bush.position.set(rand(-70, 70), 0.55, rand(10, 22));
      bush.scale.y = 0.65;
      group.add(bush);
    }

    // fogata cerca del campamento del arquero
    const fireX = -22, fireZ = 13;
    for (let i = 0; i < 3; i++) {
      const log = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 3, 7), trunkMat);
      log.position.set(fireX, 0.35, fireZ);
      log.rotation.set(Math.PI / 2, 0, i * Math.PI / 3);
      group.add(log);
    }
    const fireCone = new THREE.Mesh(
      new THREE.ConeGeometry(0.9, 2.4, 8),
      new THREE.MeshBasicMaterial({ color: 0xff7a1f, toneMapped: false })
    );
    fireCone.position.set(fireX, 1.5, fireZ);
    group.add(fireCone);
    const fireCore = new THREE.Mesh(
      new THREE.ConeGeometry(0.45, 1.4, 8),
      new THREE.MeshBasicMaterial({ color: 0xffd54a, toneMapped: false })
    );
    fireCore.position.set(fireX, 1.2, fireZ);
    group.add(fireCore);
    const fireGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture("rgba(255,150,50,.7)", "rgba(255,150,50,0)"),
      transparent: true, depthWrite: false,
    }));
    fireGlow.scale.set(9, 9, 1);
    fireGlow.position.set(fireX, 2, fireZ);
    group.add(fireGlow);
    const fireLight = new THREE.PointLight(0xff9a3a, 1, 42, 1.8);
    fireLight.position.set(fireX, 2.6, fireZ);
    group.add(fireLight);
    group.userData.fireLight = fireLight;
    group.userData.fireCone = fireCone;

    // estandartes medievales
    for (const [bx, bz, colA, colB] of [[-8, -26, "#a03030", "#e8dcc0"], [32, -30, "#2e4a8a", "#e8dcc0"]]) {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.24, 13, 7), trunkMat);
      pole.position.set(bx, 6.5, bz);
      pole.castShadow = true;
      group.add(pole);
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3.4, 6), trunkMat);
      bar.rotation.z = Math.PI / 2;
      bar.position.set(bx + 1.5, 12.6, bz);
      group.add(bar);
      const bc = document.createElement("canvas");
      bc.width = 64; bc.height = 96;
      const bg = bc.getContext("2d");
      bg.fillStyle = colA; bg.fillRect(0, 0, 32, 96);
      bg.fillStyle = colB; bg.fillRect(32, 0, 32, 96);
      bg.fillStyle = "#e8c34a";
      bg.beginPath(); bg.arc(32, 40, 13, 0, Math.PI * 2); bg.fill();
      const bTex = new THREE.CanvasTexture(bc);
      bTex.encoding = THREE.sRGBEncoding;
      const banner = new THREE.Mesh(
        new THREE.PlaneGeometry(3, 4.6),
        new THREE.MeshStandardMaterial({ map: bTex, side: THREE.DoubleSide, roughness: 0.9 })
      );
      banner.position.set(bx + 1.5, 10.2, bz);
      banner.castShadow = true;
      group.add(banner);
      // antorcha al pie del estandarte
      const torch = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.13, 2.2, 6), trunkMat);
      torch.position.set(bx + 2.6, 1.1, bz + 1.4);
      torch.rotation.z = -0.15;
      group.add(torch);
      const tFlame = new THREE.Mesh(
        new THREE.ConeGeometry(0.35, 0.9, 7),
        new THREE.MeshBasicMaterial({ color: 0xff9d2e, toneMapped: false })
      );
      tFlame.position.set(bx + 2.9, 2.5, bz + 1.4);
      group.add(tFlame);
      const tGlow = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTexture("rgba(255,160,60,.6)", "rgba(255,160,60,0)"),
        transparent: true, depthWrite: false,
      }));
      tGlow.scale.set(4, 4, 1);
      tGlow.position.set(bx + 2.9, 2.7, bz + 1.4);
      group.add(tGlow);
    }

    // humo de las chimeneas (animado en el loop)
    const smokeTex = glowTexture("rgba(200,205,215,.5)", "rgba(200,205,215,0)");
    const smoke = [];
    for (const spot of group.userData.smokeSpots || []) {
      for (let i = 0; i < 3; i++) {
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex, transparent: true, depthWrite: false, opacity: 0 }));
        group.add(s);
        smoke.push({ s, spot, off: i / 3 });
      }
    }
    group.userData.smoke = smoke;

    // camino de tierra del arquero a la aldea
    const pathMat = new THREE.MeshStandardMaterial({ color: 0x6b5a3a, roughness: 1 });
    for (let i = 0; i < 12; i++) {
      const t = i / 11;
      const px = lerp(-30, 45, t) + Math.sin(t * 5) * 4;
      const pz = lerp(24, -40, t) + Math.cos(t * 4) * 3;
      const seg = new THREE.Mesh(new THREE.CircleGeometry(rand(2.2, 3), 8), pathMat);
      seg.rotation.x = -Math.PI / 2;
      seg.position.set(px, 0.07, pz);
      group.add(seg);
    }

    // pozo de agua de piedra
    const well = new THREE.Group();

  // ---------- cancha de fútbol ----------
  function pitchTexture() {
    const W = 1024, H = 640;
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const g = c.getContext("2d");
    // franjas de césped
    for (let i = 0; i < 8; i++) {
      g.fillStyle = i % 2 ? "#2e7d32" : "#256b28";
      g.fillRect(i * W / 8, 0, W / 8, H);
    }
    g.strokeStyle = "rgba(255,255,255,.9)";
    g.lineWidth = 6;
    g.strokeRect(30, 30, W - 60, H - 60);
    // mitad de cancha y círculo central
    g.beginPath(); g.moveTo(W / 2, 30); g.lineTo(W / 2, H - 30); g.stroke();
    g.beginPath(); g.arc(W / 2, H / 2, 85, 0, Math.PI * 2); g.stroke();
    // áreas en ambos arcos
    for (const end of [0, 1]) {
      const bx = end === 0 ? 30 : W - 30;
      const dir = end === 0 ? 1 : -1;
      g.strokeRect(Math.min(bx, bx + dir * 160), H / 2 - 130, 160, 260);
      g.strokeRect(Math.min(bx, bx + dir * 60), H / 2 - 65, 60, 130);
      g.beginPath();
      g.arc(bx + dir * 110, H / 2, 4, 0, Math.PI * 2);
      g.fillStyle = "rgba(255,255,255,.9)";
      g.fill();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 4;
    return tex;
  }

  function buildGoal(halfW, h) {
    while (goalGroup.children.length) {
      const ch = goalGroup.children.pop();
      disposeGroup(ch);
      goalGroup.remove(ch);
    }
    const postMat = new THREE.MeshStandardMaterial({ color: 0xf2f6ff, roughness: 0.4 });
    for (const sz of [-halfW, halfW]) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, h, 10), postMat);
      post.position.set(0, h / 2, sz);

      goalGroup.add(post);
    }
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, halfW * 2 + 0.56, 10), postMat);
    bar.rotation.x = Math.PI / 2;
    bar.position.set(0, h, 0);
    bar.castShadow = true;
    goalGroup.add(bar);
    // red
    const netMat = new THREE.MeshBasicMaterial({ color: 0xdfe8f2, wireframe: true, transparent: true, opacity: 0.35 });
    const back = new THREE.Mesh(new THREE.PlaneGeometry(halfW * 2, h, 10, 4), netMat);
    back.rotation.y = Math.PI / 2;
    back.position.set(2.6, h / 2, 0);
    goalGroup.add(back);
    const top = new THREE.Mesh(new THREE.PlaneGeometry(2.6, halfW * 2, 3, 10), netMat);

    top.position.set(1.3, h, 0);
    goalGroup.add(top);
  }
