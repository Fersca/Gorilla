name: Tests

# Corre la suite de Playwright (tests/) en cada push: física y emboques en
# los 7 escenarios, controles, giroscopio, modo paseo y auto-actualización.
on:
  push:
    branches:
      - main
      - master
      - claude/gorila-banana-game-7db9ll
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Correr la suite
        run: npm test

      - name: Publicar reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
