name: Tests

# Corre la suite de Playwright (tests/) en cada push: física y emboques en
# los 7 escenarios, controles, giroscopio, modo paseo y auto-actualización.
on:
  push:
    branches:
      - main
      - master
      - claude/gorila-banana-game-7db9ll
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El Chromium de Playwright (~150 MB) se cachea entre corridas, con la
      # versión de Playwright como clave: solo se descarga cuando cambia.
      - name: Versión de Playwright
        id: pw
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Caché de Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Instalar Chromium de Playwright (solo si no está cacheado)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Dependencias del sistema (cuando el navegador vino del caché)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Correr la suite
        run: npm test

      - name: Publicar reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
