name: Deploy a GitHub Pages

# Republica el juego en la rama gh-pages (de donde sirve GitHub Pages)
# cada vez que se pushea a la rama de desarrollo o a main/master.
on:
  push:
    branches:
      - main
      - master
      - claude/gorila-banana-game-7db9ll
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar en gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          # rama huérfana con el contenido actual → push forzado a gh-pages
          git checkout --orphan gh-pages-deploy
          git add -A
          git commit -m "Deploy ${GITHUB_SHA} a GitHub Pages"
          git push origin gh-pages-deploy:gh-pages --force
